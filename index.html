   ["In the first half, they scored two goals.", "Birinchi bo'limda ular ikkita gol urishdi."],
   ["Timur's team felt sad and tired.", "Temurning jamoasi xafa va charchagan edi."]],
  [["In the break, the coach spoke to the boys.", "Tanaffusda murabbiy bolalar bilan gaplashdi."],
   ["\"Don't stop,\" he said. \"Run, pass the ball, and believe.\"", "\"To'xtamanglar\", dedi u. \"Yuguringlar, to'pni uzatinglar va ishoninglar.\""],
   ["In the second half, everything changed.", "Ikkinchi bo'limda hammasi o'zgardi."],
   ["Timur's friend Akmal scored a goal.", "Temurning do'sti Akmal gol urdi."],
   ["Then Timur caught a long ball and scored too!", "Keyin Temur uzun to'pni ilib olib, u ham gol urdi!"]],
  [["Now it was two-two.", "Endi hisob ikki-ikki bo'ldi."],
   ["In the last minute, the ball hit Timur's hand in the penalty area.", "So'nggi daqiqada to'p jarima maydonchasida Temurning qo'liga tegdi."],
   ["The referee gave a penalty to the other team.", "Hakam raqib jamoaga penalti belgiladi."],
   ["Timur felt terrible.", "Temur o'zini juda yomon his qildi."],
   ["But their goalkeeper, Bek, jumped and held the ball!", "Lekin darvozabonlari Bek sakrab, to'pni ushlab qoldi!"]],
  [["The match finished two-two, and there were penalties.", "O'yin ikki-ikki tugadi va penaltilar seriyasi boshlandi."],
   ["Timur's team won four-three.", "Temurning jamoasi to'rt-uch hisobida g'alaba qozondi."],
   ["The boys ran to Bek and lifted him up.", "Bolalar Bekka yugurib borib, uni ko'tarishdi."],
   ["After the match, his father bought ice cream for everyone.", "O'yindan keyin otasi hammaga muzqaymoq olib berdi."],
   ["\"You lost the ball once, but you never lost hope,\" he told Timur.", "\"To'pni bir marta yo'qotding, lekin umidni hech qachon yo'qotmading\", dedi u Temurga."]]] },

 { id: "letter", t: "A letter from London", u: "Londondan xat", lv: "Elementary", p: [
  [["Dear Mum and Dad,", "Aziz oyijon va dadajon,"],
   ["I'm sorry, I didn't write last week.", "Kechirasizlar, o'tgan hafta yozmadim."],
   ["I was very busy with my new course.", "Yangi kursim bilan juda band edim."],
   ["I'm fine, and London is very interesting.", "Men yaxshiman, London esa juda qiziq."]],
  [["My room is small, but it's warm and clean.", "Xonam kichkina, lekin issiq va toza."],
   ["I share a kitchen with two other students.", "Oshxonani yana ikki talaba bilan baham ko'raman."],
   ["Maria is from Spain, and Kenji is from Japan.", "Mariya Ispaniyadan, Kenji esa Yaponiyadan."],
   ["Last Friday, I cooked plov for them.", "O'tgan juma ularga palov pishirdim."],
   ["They loved it and asked for more!", "Ularga juda yoqdi va yana so'rashdi!"]],
  [["The weather here is not like in Tashkent.", "Bu yerda ob-havo Toshkentdagidek emas."],
   ["It rains almost every day, and the sky is grey.", "Deyarli har kuni yomg'ir yog'adi, osmon kulrang."],
   ["I bought a big umbrella in my first week.", "Birinchi haftamdayoq katta soyabon sotib oldim."],
   ["I lost it on the bus three days later.", "Uch kundan keyin uni avtobusda yo'qotib qo'ydim."],
   ["Now I have a raincoat.", "Endi menda yomg'irpo'sh bor."]],
  [["My English is getting better.", "Ingliz tilim yaxshilanyapti."],
   ["At first, I didn't understand people in the shops.", "Avvaliga do'konlardagi odamlarni tushunmasdim."],
   ["They spoke very fast, and I felt shy.", "Ular juda tez gapirishardi, men esa uyalardim."],
   ["Now I can talk to them, and I even make jokes.", "Endi ular bilan gaplasha olaman, hatto hazillashaman ham."],
   ["My teacher says my writing is very good.", "O'qituvchim yozishim juda yaxshi deydi."]],
  [["I miss you very much.", "Sizlarni juda sog'indim."],
   ["I miss Mum's soup and our evenings in the garden.", "Oyimning sho'rvasini va bog'dagi kechalarimizni sog'indim."],
   ["Please say hello to Grandma and to my little brother.", "Iltimos, buvimga va ukamga salom ayting."],
   ["I'll come home in July.", "Iyulda uyga kelaman."],
   ["With love, your daughter Madina", "Mehr bilan, qizingiz Madina"]]] },

 { id: "photo", t: "The old photo", u: "Eski surat", lv: "Elementary", p: [
  [["Last winter, Nodira cleaned her grandfather's room.", "O'tgan qish Nodira bobosining xonasini tozaladi."],
   ["Her grandfather died two years ago.", "Bobosi ikki yil oldin vafot etgan edi."],
   ["In an old box, she found a black and white photo.", "Eski qutidan u oq-qora surat topdi."],
   ["In the photo, there was a young man and a young woman.", "Suratda bir yigit va bir qiz bor edi."],
   ["They stood in front of a big building and smiled.", "Ular katta bino oldida jilmayib turishardi."]],
  [["The young man was her grandfather.", "Yigit uning bobosi edi."],
   ["But who was the woman?", "Lekin ayol kim edi?"],
   ["It wasn't her grandmother.", "Bu buvisi emas edi."],
   ["On the back of the photo, someone wrote: \"Moscow, 1968. Remember me. Vera.\"", "Suratning orqasiga kimdir yozgan edi: \"Moskva, 1968. Meni esla. Vera.\""]],
  [["Nodira showed the photo to her grandmother.", "Nodira suratni buvisiga ko'rsatdi."],
   ["Her grandmother looked at it for a long time.", "Buvisi unga uzoq qarab turdi."],
   ["Then she smiled and told the story.", "Keyin jilmayib, voqeani aytib berdi."],
   ["\"Your grandfather studied in Moscow for four years,\" she said.", "\"Bobong Moskvada to'rt yil o'qigan\", dedi u."],
   ["\"Vera was his friend at the university. She helped him with Russian.\"", "\"Vera universitetda uning do'sti edi. Unga rus tilida yordam bergan.\""]],
  [["\"Did he love her?\" Nodira asked.", "\"U uni sevganmi?\" — so'radi Nodira."],
   ["\"Maybe a little,\" her grandmother laughed.", "\"Balki ozgina\", deb kuldi buvisi."],
   ["\"But he came back to Tashkent, and he met me.\"", "\"Lekin u Toshkentga qaytdi va men bilan tanishdi.\""],
   ["\"He kept this photo, and he never hid it from me.\"", "\"U bu suratni saqlab qo'ydi va hech qachon mendan yashirmadi.\""],
   ["\"He was an honest man.\"", "\"U halol inson edi.\""]],
  [["Nodira put the photo in a new frame.", "Nodira suratni yangi ramkaga soldi."],
   ["Now it stands on the shelf next to a photo of her grandparents' wedding.", "Endi u javonda bobosi va buvisining to'y surati yonida turibdi."],
   ["Sometimes Nodira looks at the young man in the photo.", "Ba'zan Nodira suratdagi yigitga qaraydi."],
   ["She thinks about his life before her family began.", "U oilasi boshlanishidan oldingi uning hayoti haqida o'ylaydi."],
   ["Every photo has a story, she thinks.", "Har bir suratning o'z tarixi bor, deb o'ylaydi u."]]] },

 { id: "english", t: "Learning English at thirty", u: "O'ttiz yoshda ingliz tili", lv: "Elementary", p: [
  [["At school, Jamshid didn't like English.", "Maktabda Jamshid ingliz tilini yoqtirmasdi."],
   ["The lessons were boring, and he forgot all the words.", "Darslar zerikarli edi, u hamma so'zlarni unutib qo'yardi."],
   ["Later, he became an engineer and found a good job at a factory.", "Keyinroq u muhandis bo'ldi va zavoddan yaxshi ish topdi."],
   ["But last year, his factory started working with a company in Germany.", "Lekin o'tgan yili zavodi Germaniyadagi bir kompaniya bilan ishlay boshladi."],
   ["Suddenly, he needed English every day.", "To'satdan unga ingliz tili har kuni kerak bo'lib qoldi."]],
  [["His first online meeting was a disaster.", "Uning birinchi onlayn uchrashuvi falokat bo'ldi."],
   ["His manager asked him a simple question.", "Rahbari unga oddiy savol berdi."],
   ["Jamshid understood the question, but he couldn't answer.", "Jamshid savolni tushundi, lekin javob bera olmadi."],
   ["He knew the words in his head, but he couldn't say them.", "So'zlarni bilardi, lekin ularni ayta olmadi."],
   ["After the meeting, he felt angry with himself.", "Uchrashuvdan keyin u o'zidan jahli chiqdi."]],
  [["That evening, he made a plan.", "O'sha kuni kechqurun u reja tuzdi."],
   ["Every day, he learned five new words.", "Har kuni beshta yangi so'z o'rgandi."],
   ["He wrote each word by hand, not only on his phone.", "Har bir so'zni faqat telefonda emas, qo'lda ham yozdi."],
   ["In the morning, he read short stories on the metro.", "Ertalab metroda qisqa hikoyalar o'qidi."],
   ["In the evening, he listened to English podcasts while he cooked.", "Kechqurun ovqat pishirayotganda inglizcha podkastlar tingladi."]],
  [["The first month was hard.", "Birinchi oy qiyin bo'ldi."],
   ["Some days he was tired and didn't want to study.", "Ba'zi kunlari charchab, o'qigisi kelmasdi."],
   ["But he never stopped for more than one day.", "Lekin hech qachon bir kundan ortiq to'xtamadi."],
   ["After three months, he noticed something.", "Uch oydan keyin u bir narsani payqadi."],
   ["In meetings, the answers came faster.", "Uchrashuvlarda javoblar tezroq kela boshladi."]],
  [["Last week, Jamshid showed a new machine to the German visitors in English.", "O'tgan hafta Jamshid nemis mehmonlariga yangi dastgohni ingliz tilida ko'rsatib berdi."],
   ["He spoke for ten minutes and made only a few mistakes.", "U o'n daqiqa gapirdi va bir nechtagina xato qildi."],
   ["His manager said, \"Great job, Jamshid!\"", "Rahbari: \"Ajoyib ish, Jamshid!\" dedi."],
   ["On the way home, he smiled all the time.", "Uyga qaytishda u tinmay jilmaydi."],
   ["English is not easy, he thinks, but a little every day really works.", "Ingliz tili oson emas, deb o'ylaydi u, lekin har kuni ozgina — haqiqatan ishlaydi."]]] },
 { id: "flat", t: "Our flat", u: "Bizning xonadon", lv: "Beginner", p: [
  [["We live in a flat on the fifth floor.", "Biz beshinchi qavatdagi xonadonda yashaymiz."],
   ["The building is new, and there is a lift.", "Bino yangi, lift ham bor."],
   ["Our flat has three rooms, a kitchen and a bathroom.", "Xonadonimizda uchta xona, oshxona va hammom bor."],
   ["It isn't very big, but it's light and warm.", "U unchalik katta emas, lekin yorug' va issiq."]],
  [["The living room is my favourite room.", "Mehmonxona — eng sevimli xonam."],
   ["There is a big sofa, a TV and a lot of plants.", "Unda katta divan, televizor va ko'p gullar bor."],
   ["My wife loves plants.", "Rafiqam gullarni juda yaxshi ko'radi."],
   ["She waters them every morning.", "U har tong ularga suv quyadi."],
   ["In the evening, we sit on the sofa and drink tea.", "Kechqurun divanda o'tirib choy ichamiz."]],
  [["Our kitchen is small, but it has everything.", "Oshxonamiz kichik, lekin unda hamma narsa bor."],
   ["There is a fridge, a cooker and a small table.", "Muzlatkich, plita va kichik stol bor."],
   ["We usually have breakfast in the kitchen.", "Odatda nonushtani oshxonada qilamiz."],
   ["From the window, we can see the mountains.", "Derazadan tog'lar ko'rinadi."]],
  [["The children's room is green and yellow.", "Bolalar xonasi yashil va sariq rangda."],
   ["There are two beds, a desk and a lot of toys.", "Ikkita karavot, yozuv stoli va ko'p o'yinchoqlar bor."],
   ["The toys are always on the floor!", "O'yinchoqlar doim polda yotadi!"],
   ["Every evening, I say, \"Please put your toys in the box.\"", "Har kuni kechqurun: \"Iltimos, o'yinchoqlaringizni qutiga soling\", deyman."],
   ["They put them in the box, and the next day, they are on the floor again.", "Ular qutiga solishadi, ertasi kuni esa yana polda bo'ladi."]],
  [["Our neighbours are friendly.", "Qo'shnilarimiz xushmuomala."],
   ["On holidays, they bring us food, and we give them sweets.", "Bayramlarda ular bizga ovqat olib kelishadi, biz ularga shirinlik beramiz."],
   ["I like our flat, and I like our building.", "Menga xonadonimiz ham, binomiz ham yoqadi."],
   ["It's our home.", "Bu bizning uyimiz."]]] },

 { id: "doctor", t: "At the doctor's", u: "Shifokor qabulida", lv: "Beginner", p: [
  [["On Monday morning, Laylo felt ill.", "Dushanba kuni ertalab Laylo o'zini yomon his qildi."],
   ["She had a headache and a sore throat.", "Uning boshi og'rir, tomog'i og'rirdi."],
   ["She was also very hot.", "Isitmasi ham baland edi."],
   ["She called her office and said, \"I'm sorry, I can't come today.\"", "U ofisiga qo'ng'iroq qilib: \"Kechirasiz, bugun kela olmayman\", dedi."]],
  [["Then she went to the clinic near her house.", "Keyin uyi yaqinidagi poliklinikaga bordi."],
   ["There were a lot of people in the waiting room.", "Kutish zalida odam ko'p edi."],
   ["An old man was next to her.", "Yonida bir qariya o'tirgan edi."],
   ["\"It's always busy on Monday,\" he said and smiled.", "\"Dushanba kuni bu yer doim gavjum bo'ladi\", dedi u jilmayib."],
   ["Laylo waited for forty minutes.", "Laylo qirq daqiqa kutdi."]],
  [["Finally, the doctor called her.", "Nihoyat shifokor uni chaqirdi."],
   ["The doctor was a young woman with kind eyes.", "Shifokor mehribon ko'zli yosh ayol edi."],
   ["\"What's the problem?\" she asked.", "\"Nima bezovta qilyapti?\" — so'radi u."],
   ["Laylo told her about her head and her throat.", "Laylo unga boshi va tomog'i haqida aytdi."],
   ["The doctor looked at her throat and took her temperature.", "Shifokor uning tomog'ini ko'rdi va haroratini o'lchadi."]],
  [["\"It's a cold, not the flu,\" the doctor said.", "\"Bu shamollash, gripp emas\", dedi shifokor."],
   ["\"Drink a lot of water and hot tea with lemon.\"", "\"Ko'p suv va limonli issiq choy iching.\""],
   ["\"Stay in bed for two or three days.\"", "\"Ikki-uch kun yotib dam oling.\""],
   ["She gave Laylo a paper for the pharmacy.", "U Layloga dorixona uchun qog'oz berdi."]],
  [["Laylo bought the medicine and went home.", "Laylo dorini sotib olib, uyiga qaytdi."],
   ["Her mother made chicken soup for her.", "Onasi unga tovuq sho'rva pishirib berdi."],
   ["She slept a lot and watched old films.", "U ko'p uxladi va eski filmlar ko'rdi."],
   ["On Thursday, she felt much better.", "Payshanba kuni o'zini ancha yaxshi his qildi."],
   ["On Friday, she went back to work.", "Juma kuni ishga qaytdi."]]] },

 { id: "friend", t: "My best friend", u: "Eng yaqin do'stim", lv: "Beginner", p: [
  [["My best friend's name is Otabek.", "Eng yaqin do'stimning ismi Otabek."],
   ["We met at school when we were seven.", "Biz yetti yoshligimizda maktabda tanishganmiz."],
   ["We sat at the same desk for ten years.", "O'n yil bir partada o'tirdik."],
   ["Now we are thirty, and we are still friends.", "Hozir o'ttiz yoshdamiz va haliyam do'stmiz."]],
  [["Otabek is tall and thin, and he has black hair.", "Otabek baland bo'yli, ozg'in, sochi qora."],
   ["He wears glasses, and he always has a book in his bag.", "U ko'zoynak taqadi, sumkasida doim kitob bo'ladi."],
   ["He is very clever, but he is also very funny.", "U juda aqlli, lekin juda hazilkash ham."],
   ["When I'm sad, he always makes me laugh.", "Xafa bo'lsam, u meni doim kuldiradi."]],
  [["Otabek is a doctor.", "Otabek shifokor."],
   ["He works in a big hospital in Tashkent.", "U Toshkentdagi katta kasalxonada ishlaydi."],
   ["His work is hard, and he is often tired.", "Ishi og'ir, u tez-tez charchaydi."],
   ["But he loves his job.", "Lekin u ishini yaxshi ko'radi."],
   ["\"I help people every day,\" he says.", "\"Har kuni odamlarga yordam beraman\", deydi u."]],
  [["We don't meet very often now.", "Hozir biz unchalik tez-tez uchrashmaymiz."],
   ["He is busy, and I am busy too.", "U band, men ham bandman."],
   ["But every Sunday, we have breakfast together in a small cafe.", "Lekin har yakshanba kichik bir kafeda birga nonushta qilamiz."],
   ["We talk about our work, our families and football.", "Ishimiz, oilamiz va futbol haqida gaplashamiz."]],
  [["Last month, I had a problem at work.", "O'tgan oy ishda muammoga duch keldim."],
   ["I called Otabek at eleven o'clock at night.", "Kechasi soat o'n birda Otabekka qo'ng'iroq qildim."],
   ["He listened to me for an hour.", "U meni bir soat tingladi."],
   ["That's a real friend.", "Haqiqiy do'st shunaqa bo'ladi."]]] },

 { id: "morning", t: "A busy morning", u: "Shoshilinch tong", lv: "Beginner", p: [
  [["Usually, Dilshod's alarm rings at half past six.", "Odatda Dilshodning budilnigi olti yarimda jiringlaydi."],
   ["But this morning, his phone was dead.", "Lekin bugun ertalab telefoni o'chib qolgan edi."],
   ["He opened his eyes and looked at the clock.", "U ko'zini ochib, soatga qaradi."],
   ["It was eight o'clock!", "Soat sakkiz edi!"],
   ["His meeting was at nine.", "Uchrashuvi soat to'qqizda edi."]],
  [["He jumped out of bed and ran to the bathroom.", "U to'shakdan sakrab turib, hammomga yugurdi."],
   ["He had a very quick shower.", "Juda tez yuvinib oldi."],
   ["He put on his shirt, but it was the wrong colour.", "Ko'ylagini kiydi, lekin rangi noto'g'ri edi."],
   ["He didn't have time to change it.", "Uni almashtirishga vaqti yo'q edi."],
   ["He didn't have breakfast.", "Nonushta ham qilmadi."]],
  [["Outside, it was raining.", "Tashqarida yomg'ir yog'ayotgan edi."],
   ["He waited for a taxi for ten minutes.", "U taksini o'n daqiqa kutdi."],
   ["The roads were full of cars.", "Yo'llar mashinalarga to'la edi."],
   ["\"Faster, please,\" he said to the driver.", "\"Iltimos, tezroq\", dedi u haydovchiga."],
   ["The driver laughed. \"Everybody is late today,\" he said.", "Haydovchi kuldi: \"Bugun hamma kechikyapti\", dedi u."]],
  [["Dilshod got to the office at five past nine.", "Dilshod ofisga to'qqizdan besh daqiqa o'tganda yetib keldi."],
   ["He ran into the meeting room.", "U majlis xonasiga yugurib kirdi."],
   ["But the room was empty!", "Lekin xona bo'm-bo'sh edi!"],
   ["Then his manager came in with a cup of coffee.", "Keyin rahbari qo'lida bir piyola qahva bilan kirib keldi."],
   ["\"The meeting is tomorrow, Dilshod,\" she said.", "\"Uchrashuv ertaga, Dilshod\", dedi u."]],
  [["Dilshod sat down and laughed.", "Dilshod o'tirib, kulib yubordi."],
   ["Then he went to the cafe and had a big breakfast.", "Keyin kafega borib, to'yib nonushta qildi."],
   ["That evening, he bought a new alarm clock.", "O'sha kuni kechqurun yangi budilnik sotib oldi."]]] },

 { id: "clothes", t: "Shopping for clothes", u: "Kiyim xaridi", lv: "Beginner", p: [
  [["Next week, Zarina has a job interview.", "Kelasi hafta Zarinaning ish suhbati bor."],
   ["She needs new clothes.", "Unga yangi kiyim kerak."],
   ["On Saturday, she goes to a big shopping centre with her sister, Nigora.", "Shanba kuni u singlisi Nigora bilan katta savdo markaziga boradi."]],
  [["The first shop is very expensive.", "Birinchi do'kon juda qimmat."],
   ["Zarina likes a dark blue jacket.", "Zarinaga to'q ko'k kurtka yoqadi."],
   ["\"How much is it?\" she asks.", "\"Bu qancha turadi?\" — so'raydi u."],
   ["\"Two million sum,\" the shop assistant says.", "\"Ikki million so'm\", deydi sotuvchi."],
   ["\"Oh, that's too expensive,\" Zarina says, and they leave.", "\"Voy, bu juda qimmat ekan\", deydi Zarina va ular chiqib ketishadi."]],
  [["In the second shop, there is a sale.", "Ikkinchi do'konda chegirma bor."],
   ["Zarina tries on a grey skirt and a white blouse.", "Zarina kulrang yubka va oq bluzka kiyib ko'radi."],
   ["The skirt is too small.", "Yubka juda kichik."],
   ["\"Do you have it in a bigger size?\" she asks.", "\"Bundan kattaroq o'lchami bormi?\" — so'raydi u."],
   ["The assistant brings a medium, and it fits perfectly.", "Sotuvchi o'rtacha o'lchamini olib keladi va u juda yaxshi tushadi."]],
  [["\"You look great,\" Nigora says.", "\"Senga juda yarashdi\", deydi Nigora."],
   ["Zarina looks in the mirror and smiles.", "Zarina oynaga qarab jilmayadi."],
   ["She looks smart and confident.", "U ko'rinishidan tartibli va o'ziga ishongan."],
   ["The skirt and the blouse cost six hundred thousand sum together.", "Yubka va bluzka birgalikda olti yuz ming so'm turadi."]],
  [["Zarina pays by card.", "Zarina karta bilan to'laydi."],
   ["Then the two sisters go to a cafe and have ice cream.", "Keyin ikki opa-singil kafega borib, muzqaymoq yeyishadi."],
   ["\"Now I'm ready for the interview,\" Zarina says.", "\"Endi suhbatga tayyorman\", deydi Zarina."]]] },

 { id: "garden", t: "My grandfather's garden", u: "Bobomning bog'i", lv: "Beginner", p: [
  [["My grandfather is seventy-eight years old.", "Bobom yetmish sakkiz yoshda."],
   ["He lives in a house with a big garden in Fergana.", "U Farg'onada katta bog'li uyda yashaydi."],
   ["The garden is his world.", "Bog' — uning olami."],
   ["He works there every day, from morning to evening.", "U har kuni ertalabdan kechgacha o'sha yerda ishlaydi."]],
  [["In the garden, there are apple, pear and cherry trees.", "Bog'da olma, nok va gilos daraxtlari bor."],
   ["There are also tomatoes, cucumbers and a lot of herbs.", "Pomidor, bodring va ko'plab ko'katlar ham bor."],
   ["My grandfather grows everything himself.", "Bobom hammasini o'zi o'stiradi."],
   ["He never buys vegetables at the market.", "U hech qachon bozordan sabzavot sotib olmaydi."]],
  [["Every summer, I visit him for two weeks.", "Har yozda uning oldiga ikki haftaga boraman."],
   ["We get up early, at five o'clock.", "Biz erta, soat beshda turamiz."],
   ["It's cool in the morning, and the birds sing.", "Ertalab salqin bo'ladi, qushlar sayraydi."],
   ["We water the trees and pick the fruit.", "Daraxtlarga suv quyamiz va mevalarni teramiz."],
   ["My grandfather teaches me the names of all the plants.", "Bobom menga barcha o'simliklarning nomini o'rgatadi."]],
  [["At noon, it's very hot.", "Tushda havo juda issiq bo'ladi."],
   ["We sit under a big walnut tree and drink green tea.", "Katta yong'oq daraxti tagida o'tirib, ko'k choy ichamiz."],
   ["My grandfather tells me stories about his life.", "Bobom menga hayoti haqida hikoyalar aytib beradi."],
   ["He planted that walnut tree when my father was born.", "U o'sha yong'oq daraxtini otam tug'ilganda ekkan."]],
  [["\"A tree is like a family,\" he says.", "\"Daraxt oilaga o'xshaydi\", deydi u."],
   ["\"You plant it, you give it water, and you wait.\"", "\"Ekasan, suv berasan va kutasan.\""],
   ["When I go home, he always gives me a big box of fruit.", "Uyga qaytayotganimda u doim menga bir quti meva beradi."],
   ["It's the best fruit in the world.", "Bu dunyodagi eng mazali meva."]]] },

 { id: "mosh", t: "A cat called Mosh", u: "Mosh ismli mushuk", lv: "Beginner", p: [
  [["One cold evening in November, Aziz heard a small sound near his door.", "Noyabrdagi sovuq kechalarning birida Aziz eshigi yonida mayin ovoz eshitdi."],
   ["He opened the door and saw a little grey kitten.", "U eshikni ochib, kichkina kulrang mushukchani ko'rdi."],
   ["It was wet and very hungry.", "U ho'l va juda och edi."],
   ["Aziz brought it into the flat and gave it some milk.", "Aziz uni uyga olib kirdi va biroz sut berdi."]],
  [["His children were very happy.", "Bolalari juda xursand bo'lishdi."],
   ["\"Can we keep it?\" they asked.", "\"Uni o'zimizda qoldirsak bo'ladimi?\" — so'rashdi ular."],
   ["Aziz looked at his wife, Nilufar.", "Aziz rafiqasi Nilufarga qaradi."],
   ["She smiled and said, \"Yes, but you must look after it.\"", "U jilmayib: \"Mayli, lekin unga o'zlaring qaraysizlar\", dedi."],
   ["The children called the kitten Mosh.", "Bolalar mushukchani Mosh deb atashdi."]],
  [["Now Mosh is two years old, and he is big and fat.", "Endi Mosh ikki yoshda, katta va semiz."],
   ["He sleeps all day on the sofa.", "U kun bo'yi divanda uxlaydi."],
   ["At night, he runs around the flat and plays with everything.", "Kechasi esa uy bo'ylab yugurib, hamma narsa bilan o'ynaydi."],
   ["Last week, he broke Nilufar's favourite cup.", "O'tgan hafta u Nilufarning sevimli piyolasini sindirdi."]],
  [["Mosh loves fish, but he hates water.", "Mosh baliqni yaxshi ko'radi, lekin suvni yomon ko'radi."],
   ["When it's time for a bath, he hides under the bed.", "Cho'milish vaqti kelsa, karavot tagiga yashirinib oladi."],
   ["The children always find him and laugh.", "Bolalar uni doim topib, kulishadi."]],
  [["In the evening, when Aziz comes home, Mosh waits for him at the door.", "Kechqurun Aziz uyga kelganda Mosh uni eshik oldida kutib turadi."],
   ["\"He thinks he's a dog,\" Nilufar says.", "\"U o'zini it deb o'ylaydi\", deydi Nilufar."],
   ["Aziz sits in his chair, and Mosh sits on his knees.", "Aziz kreslosiga o'tiradi, Mosh esa uning tizzasiga chiqib oladi."],
   ["It's the best part of his day.", "Bu uning kunidagi eng yoqimli damlar."]]] },

 { id: "khiva", t: "The night train", u: "Tungi poyezd", lv: "Elementary", p: [
  [["Last October, Shahzoda took the night train from Tashkent to Khiva.", "O'tgan oktabrda Shahzoda Toshkentdan Xivaga tungi poyezdda bordi."],
   ["It was her first long trip alone.", "Bu uning yolg'iz o'zi qilgan birinchi uzoq safari edi."],
   ["The train left at eight o'clock in the evening.", "Poyezd kechqurun soat sakkizda jo'nadi."],
   ["The journey took fifteen hours.", "Yo'l o'n besh soat davom etdi."]],
  [["Her compartment had four beds.", "Kupesida to'rtta o'rin bor edi."],
   ["An old woman, a young mother and a little boy were there.", "U yerda bir kampir, yosh ona va kichkina bola bor edi."],
   ["At first, nobody spoke.", "Avvaliga hech kim gapirmadi."],
   ["Then the old woman opened her bag and took out bread, grapes and samsa.", "Keyin kampir sumkasini ochib, non, uzum va somsa chiqardi."],
   ["\"Eat, my children,\" she said.", "\"Yenglar, bolalarim\", dedi u."]],
  [["Soon everybody was talking and laughing.", "Ko'p o'tmay hamma gaplashib, kulisha boshladi."],
   ["The old woman was from Urgench.", "Kampir Urganchdan ekan."],
   ["She told them about her eleven grandchildren.", "U ularga o'n bitta nevarasi haqida gapirib berdi."],
   ["The little boy fell asleep on his mother's knees.", "Kichkina bola onasining tizzasida uxlab qoldi."],
   ["Outside the window, the desert was dark and silent.", "Deraza ortida cho'l qorong'i va sokin edi."]],
  [["Shahzoda didn't sleep much.", "Shahzoda ko'p uxlamadi."],
   ["At five in the morning, she stood by the window.", "Ertalab soat beshda deraza oldida turdi."],
   ["The sun came up over the sand.", "Quyosh qumlar ustidan ko'tarildi."],
   ["The sky was pink, then orange, then gold.", "Osmon avval pushti, keyin to'q sariq, keyin oltin rangga kirdi."],
   ["She took a photo, but the photo wasn't as beautiful as the real thing.", "U suratga oldi, lekin surat haqiqatdagidek chiroyli chiqmadi."]],
  [["At eleven o'clock, the train arrived.", "Soat o'n birda poyezd yetib keldi."],
   ["The old woman hugged Shahzoda like her own granddaughter.", "Kampir Shahzodani o'z nevarasidek quchoqladi."],
   ["\"Come and visit us in Urgench,\" she said, and wrote her phone number on a piece of paper.", "\"Urganchga mehmonga kel\", dedi u va qog'ozga telefon raqamini yozib berdi."],
   ["Shahzoda still keeps that paper in her wallet.", "Shahzoda o'sha qog'ozni hali ham hamyonida saqlab yuradi."]]] },

 { id: "interview", t: "The Omelette Test", u: "Omlet sinovi", lv: "Elementary", p: [
  [["Bobur saw the job advert on Monday.", "Bobur ish e'lonini dushanba kuni ko'rdi."],
   ["A big restaurant in the city centre needed a young cook.", "Shahar markazidagi katta restoranga yosh oshpaz kerak edi."],
   ["He called them the same evening and told them about himself.", "U o'sha kuni kechqurunoq qo'ng'iroq qilib, o'zi haqida aytib berdi."],
   ["On Wednesday, they called him back.", "Chorshanba kuni unga qayta qo'ng'iroq qilishdi."],
   ["\"Can you come for an interview on Friday at ten?\"", "\"Juma kuni soat o'nda suhbatga kela olasizmi?\""]],
  [["Bobur was nervous.", "Bobur hayajonda edi."],
   ["He spent two evenings preparing.", "U ikki kechani tayyorgarlikka sarfladi."],
   ["He read about the restaurant and looked at their whole menu.", "Restoran haqida o'qidi va ularning butun menyusini ko'rib chiqdi."],
   ["He practised his answers in front of the mirror.", "Javoblarini oyna oldida mashq qildi."],
   ["His sister laughed at him, but she also helped him.", "Opasi ustidan kuldi, lekin yordam ham berdi."]],
  [["On Friday, he arrived twenty minutes early.", "Juma kuni u yigirma daqiqa erta yetib keldi."],
   ["The kitchen was big and clean, with a lot of shiny pots.", "Oshxona katta va toza edi, unda ko'plab yaltiroq qozonlar bor edi."],
   ["Two people interviewed him: a man and a woman.", "Uni ikki kishi suhbatdan o'tkazdi: bir erkak va bir ayol."],
   ["They asked about his experience and his favourite dishes.", "Ular tajribasi va eng yoqtirgan taomlari haqida so'rashdi."],
   ["Then the woman gave him a small task.", "Keyin ayol unga kichik topshiriq berdi."]],
  [["\"Make an omelette and a salad for two people. You have thirty minutes.\"", "\"Ikki kishi uchun omlet va salat tayyorlang. Sizda o'ttiz daqiqa bor.\""],
   ["Bobur's hands were cold, but he began to work.", "Boburning qo'llari muzlab ketgan edi, lekin u ishga kirishdi."],
   ["He thought about his mother's kitchen and cooked quickly.", "U onasining oshxonasini eslab, tez pishirdi."],
   ["When he finished, he explained how he made each dish.", "Tugatgach, har bir taomni qanday tayyorlaganini tushuntirib berdi."],
   ["The man tasted the food and wrote something in his notebook.", "Erkak taomni tatib ko'rdi va daftariga nimadir yozdi."]],
  [["\"Thank you. We'll call you next week,\" they said.", "\"Rahmat. Kelasi hafta qo'ng'iroq qilamiz\", deyishdi ular."],
   ["The next week was very long.", "Keyingi hafta juda uzoq cho'zildi."],
   ["On Thursday, his phone rang.", "Payshanba kuni telefoni jiringladi."],
   ["\"Congratulations, Bobur. You got the job!\"", "\"Tabriklaymiz, Bobur. Siz ishga qabul qilindingiz!\""],
   ["He shouted so loudly that his neighbour knocked on the wall.", "U shunchalik baland qichqirdiki, qo'shnisi devorni taqillatdi."]]] },

 { id: "power", t: "The power cut", u: "Chiroq o'chdi", lv: "Elementary", p: [
  [["Last January, it was very cold in Tashkent.", "O'tgan yanvarda Toshkentda havo juda sovuq edi."],
   ["One evening, Madina was cooking dinner, and her husband was working on his laptop.", "Bir kuni kechqurun Madina kechki ovqat pishirayotgan, eri esa noutbukda ishlayotgan edi."],
   ["The children were watching cartoons.", "Bolalar multfilm ko'rishayotgan edi."],
   ["Suddenly, everything went dark.", "To'satdan hamma yoq qorong'i bo'lib qoldi."]],
  [["\"Mum! The TV stopped!\" shouted her son.", "\"Oyi! Televizor o'chib qoldi!\" — qichqirdi o'g'li."],
   ["Madina looked out of the window.", "Madina derazadan qaradi."],
   ["The whole street was dark.", "Butun ko'cha qorong'i edi."],
   ["Her husband found some candles in a drawer.", "Eri tortmadan bir nechta sham topdi."],
   ["They put them on the table and lit them.", "Ularni stolga qo'yib, yoqishdi."]],
  [["The dinner wasn't ready, and the cooker was electric.", "Kechki ovqat tayyor emas edi, plita esa elektr bilan ishlardi."],
   ["So they ate bread, cheese and cold chicken.", "Shuning uchun ular non, pishloq va sovuq tovuq yeyishdi."],
   ["The children thought it was an adventure.", "Bolalar buni sarguzasht deb o'ylashdi."],
   ["\"It's like camping!\" said her daughter.", "\"Xuddi chodirda yashagandek!\" — dedi qizi."]],
  [["There was no internet and no TV.", "Internet ham, televizor ham yo'q edi."],
   ["The phones were almost dead.", "Telefonlar deyarli o'chib qolgan edi."],
   ["So they sat together under a big blanket.", "Shuning uchun katta adyol ostida birga o'tirishdi."],
   ["Madina's husband told the children stories from his childhood.", "Madinaning eri bolalarga bolaligidan hikoyalar aytib berdi."],
   ["Then they played word games and sang songs.", "Keyin so'z o'yinlari o'ynashdi va qo'shiq aytishdi."]],
  [["At ten o'clock, the lights came back.", "Soat o'nda chiroq qaytib keldi."],
   ["The TV turned on, and the fridge started to hum.", "Televizor yondi, muzlatkich g'uvillay boshladi."],
   ["\"Oh no,\" said her son. \"Can we turn it off again?\"", "\"Voy yo'q\", dedi o'g'li. \"Yana o'chirib qo'ysak bo'ladimi?\""],
   ["Madina laughed.", "Madina kulib yubordi."],
   ["Now, once a month, they have a \"dark evening\" with candles and no phones.", "Endi oyda bir marta ular shamlar yoqib, telefonsiz \"qorong'i kecha\" o'tkazishadi."]]] },
 { id: "istanbul", t: "Lost in Istanbul", u: "Istanbulda adashib", lv: "Elementary", p: [
  [["Last spring, Javohir went to Istanbul for a conference.", "O'tgan bahorda Javohir konferensiya uchun Istanbulga bordi."],
   ["On the last day, he had a free afternoon.", "Oxirgi kuni tushdan keyin bo'sh vaqti bor edi."],
   ["He decided to walk around the old city alone.", "U eski shaharni yolg'iz aylanishga qaror qildi."],
   ["He didn't take a map. \"I have my phone,\" he thought.", "Xarita olmadi. \"Telefonim bor-ku\", deb o'yladi u."]],
  [["He saw the Blue Mosque and the big bazaar.", "U Ko'k masjidni va katta bozorni ko'rdi."],
   ["The bazaar was huge, with thousands of small shops.", "Bozor ulkan edi, minglab kichik do'konlar bor edi."],
   ["He bought a scarf for his mother and some Turkish sweets.", "Onasi uchun ro'mol va bir oz turk shirinligi sotib oldi."],
   ["Then he walked down narrow streets towards the sea.", "Keyin tor ko'chalar bo'ylab dengiz tomon yurdi."],
   ["After two hours, he wanted to go back to the hotel.", "Ikki soatdan keyin mehmonxonaga qaytmoqchi bo'ldi."]],
  [["He took out his phone, but the battery was dead.", "Telefonini oldi, lekin quvvati tugagan edi."],
   ["He didn't know the name of the street, and he didn't speak Turkish.", "U ko'chaning nomini bilmasdi, turkcha ham gapirmasdi."],
   ["It was getting dark.", "Qorong'i tusha boshladi."],
   ["He felt a little scared.", "U biroz qo'rqib ketdi."]],
  [["He went into a small tea house.", "U kichik bir choyxonaga kirdi."],
   ["An old man was sitting there with a newspaper.", "U yerda bir qariya gazeta o'qib o'tirgan edi."],
   ["Javohir tried English, but the man didn't understand.", "Javohir inglizcha gapirib ko'rdi, lekin qariya tushunmadi."],
   ["Then Javohir said a few words in Uzbek.", "Keyin Javohir o'zbekcha bir necha so'z aytdi."],
   ["The old man smiled. \"Kardeş! Brother!\" he said. Many words were almost the same!", "Qariya jilmaydi: \"Kardeş! Birodar!\" dedi. Ko'p so'zlar deyarli bir xil ekan!"]],
  [["The old man gave him a glass of tea and charged his phone.", "Qariya unga bir stakan choy berdi va telefonini quvvatladi."],
   ["They talked for an hour with hands, smiles and half-Turkish, half-Uzbek words.", "Ular bir soat qo'l ishoralari, tabassumlar va yarim turkcha, yarim o'zbekcha so'zlar bilan suhbatlashishdi."],
   ["Then the old man's grandson walked Javohir to his hotel.", "Keyin qariyaning nevarasi Javohirni mehmonxonasigacha kuzatib qo'ydi."],
   ["\"Getting lost was the best part of my trip,\" Javohir told his friends later.", "\"Adashib qolishim safarimning eng yaxshi qismi bo'ldi\", dedi keyinroq Javohir do'stlariga."]]] },

 { id: "neighbour", t: "The new neighbour", u: "Yangi qo'shni", lv: "Elementary", p: [
  [["In August, a new family moved into the flat next to ours.", "Avgustda qo'shni xonadonga yangi oila ko'chib keldi."],
   ["For two days, we heard loud noises: drilling, hammering and moving furniture.", "Ikki kun davomida baland shovqinlarni eshitdik: parmalash, bolg'a urish va mebel surish."],
   ["My husband was angry. \"Who are these people?\" he said.", "Erimning jahli chiqdi: \"Bular kim o'zi?\" dedi."],
   ["On the third day, there was a knock at our door.", "Uchinchi kuni eshigimiz taqillandi."]],
  [["A woman of about forty stood there with a plate of pastries.", "Eshik oldida qirq yoshlardagi ayol bir likop pishiriq bilan turardi."],
   ["\"Hello, I'm Gulnora, your new neighbour,\" she said.", "\"Assalomu alaykum, men Gulnoraman, yangi qo'shningiz\", dedi u."],
   ["\"I'm sorry about the noise. We're almost finished.\"", "\"Shovqin uchun uzr. Deyarli tugatdik.\""],
   ["The pastries were still warm.", "Pishiriqlar hali iliq edi."],
   ["My husband ate four of them and forgot about the noise.", "Erim ulardan to'rttasini yedi va shovqinni unutib yubordi."]],
  [["Gulnora was a music teacher.", "Gulnora musiqa o'qituvchisi ekan."],
   ["She had a piano, and in the evenings we heard her play.", "Uning pianinosi bor edi, kechqurunlari uning chalayotganini eshitardik."],
   ["At first, I thought it was the radio.", "Avvaliga radio deb o'ylabman."],
   ["My daughter, Sevara, listened at the wall every evening.", "Qizim Sevara har kuni kechqurun devorga quloq tutib tinglardi."]],
  [["One day, Sevara asked me, \"Mum, can I learn the piano?\"", "Bir kuni Sevara mendan so'radi: \"Oyi, pianino o'rgansam bo'ladimi?\""],
   ["I spoke to Gulnora, and she agreed to teach her twice a week.", "Gulnora bilan gaplashdim, u haftada ikki marta dars berishga rozi bo'ldi."],
   ["She didn't want any money.", "U hech qanday pul olishni xohlamadi."],
   ["\"Bring me some of your plov sometimes,\" she said, and laughed.", "\"Ba'zan palovingizdan olib kelib turing\", dedi u kulib."]],
  [["That was a year ago.", "Bu bir yil oldin edi."],
   ["Now Sevara can play five songs.", "Endi Sevara beshta kuy chala oladi."],
   ["Last month, she played at a school concert, and Gulnora sat in the first row.", "O'tgan oy u maktab konsertida chaldi, Gulnora esa birinchi qatorda o'tirdi."],
   ["Sometimes the best friends come with a lot of noise.", "Ba'zan eng yaxshi do'stlar katta shovqin bilan kirib keladi."]]] },

 { id: "cooking", t: "Cooking for the first time", u: "Birinchi marta ovqat pishirish", lv: "Elementary", p: [
  [["Sanjar is twenty-two, and he has just moved to a student flat.", "Sanjar yigirma ikki yoshda, u yaqinda talabalar turar joyiga ko'chib o'tdi."],
   ["At home, his mother always cooked for him.", "Uyda onasi doim unga ovqat pishirib berardi."],
   ["He never learned to cook anything except eggs.", "U tuxumdan boshqa hech narsa pishirishni o'rganmagan edi."],
   ["After two weeks of eggs and bread, he was tired of them.", "Ikki hafta tuxum va non yegach, ulardan bezor bo'ldi."]],
  [["\"I'll cook plov,\" he told his roommate, Ulug'bek.", "\"Palov pishiraman\", dedi u xonadoshi Ulug'bekka."],
   ["Ulug'bek looked at him. \"Are you sure?\"", "Ulug'bek unga qaradi: \"Ishonchingiz komilmi?\""],
   ["Sanjar called his mother and wrote down the recipe.", "Sanjar onasiga qo'ng'iroq qildi va retseptni yozib oldi."],
   ["Then he went to the market and bought rice, carrots, onions, meat and oil.", "Keyin bozorga borib, guruch, sabzi, piyoz, go'sht va yog' sotib oldi."]],
  [["Cutting the carrots took him one hour.", "Sabzi to'g'rashga bir soat ketdi."],
   ["He cut his finger two times.", "Barmog'ini ikki marta kesib oldi."],
   ["The onions made him cry.", "Piyoz uni yig'latib yubordi."],
   ["He put too much oil in the pot, and it was very hot.", "Qozonga juda ko'p yog' quydi, yog' esa juda qizib ketdi."],
   ["When he added the meat, the oil jumped everywhere.", "Go'shtni solganda yog' har tomonga sachradi."]],
  [["Then he made a big mistake: he forgot about the water.", "Keyin u katta xato qildi: suvni unutib qo'ydi."],
   ["He put in the rice, closed the lid and went to watch football.", "Guruchni soldi, qopqog'ini yopdi va futbol ko'rgani ketdi."],
   ["Twenty minutes later, there was a strange smell.", "Yigirma daqiqadan keyin g'alati hid keldi."],
   ["The bottom of the plov was black.", "Palovning tagi qorayib ketgan edi."]],
  [["They ate the top part. It was not great, but it was not terrible.", "Ular ustki qismini yeyishdi. Zo'r emasdi, lekin dahshatli ham emasdi."],
   ["\"Next time will be better,\" said Ulug'bek kindly.", "\"Keyingi safar yaxshiroq bo'ladi\", dedi Ulug'bek mehribonlik bilan."],
   ["Sanjar tried again the next Sunday, and the next.", "Sanjar keyingi yakshanba yana urinib ko'rdi, undan keyingisida ham."],
   ["His fifth plov was really good.", "Uning beshinchi palovi haqiqatan ham mazali chiqdi."],
   ["Now all the students on his floor come to his room on Sundays.", "Endi qavatidagi barcha talabalar yakshanba kunlari uning xonasiga kelishadi."]]] },

 { id: "laptop", t: "The broken laptop", u: "Buzilgan noutbuk", lv: "Elementary", p: [
  [["Kamola works from home as a translator.", "Kamola uydan turib tarjimon bo'lib ishlaydi."],
   ["Her laptop is the most important thing in her life after her family.", "Oilasidan keyin noutbuki hayotidagi eng muhim narsa."],
   ["Last Tuesday, she had a big deadline.", "O'tgan seshanba uning muhim topshirish muddati bor edi."],
   ["She needed to send a fifty-page document by six o'clock.", "U soat oltigacha ellik sahifali hujjat yuborishi kerak edi."]],
  [["At two o'clock, her little son ran into the room with a glass of juice.", "Soat ikkida kichkina o'g'li qo'lida bir stakan sharbat bilan xonaga yugurib kirdi."],
   ["He tripped over the cable.", "U simga qoqilib ketdi."],
   ["The juice went all over the keyboard.", "Sharbat butun klaviatura bo'ylab to'kildi."],
   ["The screen went black.", "Ekran qorayib qoldi."],
   ["Kamola didn't shout, but she wanted to.", "Kamola qichqirmadi, garchi juda qichqirgisi kelgan bo'lsa ham."]],
  [["She turned the laptop upside down and dried it with a towel.", "U noutbukni to'ntarib, sochiq bilan quritdi."],
   ["Then she called a repair shop.", "Keyin ta'mirlash ustaxonasiga qo'ng'iroq qildi."],
   ["\"Bring it tomorrow,\" the man said.", "\"Ertaga olib keling\", dedi usta."],
   ["\"I can't wait until tomorrow!\" she said.", "\"Ertagacha kuta olmayman!\" — dedi u."]],
  [["Luckily, she remembered something: she saved her work online every hour.", "Baxtiga, u bir narsani esladi: u har soatda ishini internetga saqlab borardi."],
   ["She borrowed her husband's old computer.", "U erining eski kompyuterini qarzga oldi."],
   ["It was very slow, and the letter \"e\" didn't work well.", "U juda sekin edi, \"e\" harfi ham yaxshi ishlamasdi."],
   ["But she opened her document and continued.", "Lekin u hujjatini ochib, ishni davom ettirdi."],
   ["She worked without a break for four hours.", "U to'rt soat tanaffussiz ishladi."]],
  [["At five fifty-five, she pressed \"Send\".", "Soat oltiga besh daqiqa qolganda u \"Yuborish\" tugmasini bosdi."],
   ["Her son came in quietly and gave her a drawing.", "O'g'li sekin kirib, unga bir rasm berdi."],
   ["It was a picture of a laptop with a big heart on it.", "Bu ustida katta yurak chizilgan noutbuk rasmi edi."],
   ["\"Sorry, Mum,\" it said.", "Unda \"Kechir, oyi\" deb yozilgan edi."],
   ["The repair cost a lot of money, but she still keeps that drawing on her desk.", "Ta'mirlash qimmatga tushdi, lekin u o'sha rasmni hali ham stolida saqlaydi."]]] },

 { id: "video", t: "Grandma learns to video call", u: "Buvim video qo'ng'iroqni o'rganadi", lv: "Elementary", p: [
  [["My grandmother is eighty-one, and she lives in Samarkand.", "Buvim sakson bir yoshda, u Samarqandda yashaydi."],
   ["I live in Tashkent, and my brother lives in Seoul.", "Men Toshkentda, akam esa Seulda yashaydi."],
   ["For years, she only had an old phone with big buttons.", "Yillar davomida uning faqat katta tugmali eski telefoni bor edi."],
   ["She could only call and answer calls.", "U faqat qo'ng'iroq qilishi va qo'ng'iroqlarga javob berishi mumkin edi."]],
  [["Last New Year, we gave her a smartphone.", "O'tgan Yangi yilda biz unga smartfon sovg'a qildik."],
   ["She looked at it like it was a dangerous animal.", "U telefonga xuddi xavfli hayvonga qaragandek qaradi."],
   ["\"I'm too old for this,\" she said.", "\"Men bunga juda qariman\", dedi u."],
   ["\"You can see Akbar's face every day,\" I said.", "\"Har kuni Akbarning yuzini ko'rishingiz mumkin\", dedim men."],
   ["She was quiet for a moment. Then she said, \"Show me.\"", "U bir lahza jim qoldi. Keyin: \"Ko'rsat-chi\", dedi."]],
  [["I stayed with her for three days and taught her.", "Uning oldida uch kun qolib, o'rgatdim."],
   ["I wrote everything in a notebook in big letters.", "Hammasini daftarga katta harflar bilan yozib berdim."],
   ["\"Green button — answer. Red button — finish.\"", "\"Yashil tugma — javob berish. Qizil tugma — tugatish.\""],
   ["The first time, she held the phone to her ear during a video call.", "Birinchi safar u video qo'ng'iroq paytida telefonni qulog'iga tutdi."],
   ["My brother only saw her ear for five minutes!", "Akam besh daqiqa davomida faqat uning qulog'ini ko'rdi!"]],
  [["But she practised every day.", "Lekin u har kuni mashq qildi."],
   ["After a week, she could call both of us without help.", "Bir haftadan keyin u ikkalamizga ham yordamsiz qo'ng'iroq qila oladigan bo'ldi."],
   ["After a month, she sent her first photo — a picture of her soup.", "Bir oydan keyin u birinchi suratini yubordi — sho'rvasining surati."],
   ["After two months, she started sending voice messages at six in the morning.", "Ikki oydan keyin ertalab soat oltida ovozli xabarlar yubora boshladi."]],
  [["Now she calls my brother every Sunday.", "Endi u har yakshanba akamga qo'ng'iroq qiladi."],
   ["She shows him her garden, her neighbours and her new curtains.", "U akamga bog'ini, qo'shnilarini va yangi pardalarini ko'rsatadi."],
   ["Last week, she told me, \"Your brother looks thin. Tell him to eat more.\"", "O'tgan hafta u menga: \"Akang ozib ketibdi. Ko'proq ovqat yesin, deb ayt\", dedi."],
   ["Some things don't change, even with new technology.", "Ba'zi narsalar hatto yangi texnologiya bilan ham o'zgarmaydi."]]] },

 { id: "marathon", t: "The first marathon", u: "Birinchi marafon", lv: "Elementary", p: [
  [["Two years ago, Nodir couldn't run for five minutes.", "Ikki yil oldin Nodir besh daqiqa ham yugura olmasdi."],
   ["He worked at a desk all day and ate a lot of fast food.", "U kun bo'yi stol ortida ishlardi va ko'p fast-fud yerdi."],
   ["One day, he climbed the stairs to the fourth floor and couldn't breathe.", "Bir kuni u zinadan to'rtinchi qavatga chiqdi va nafas ola olmay qoldi."],
   ["\"Something must change,\" he thought.", "\"Nimadir o'zgarishi kerak\", deb o'yladi u."]],
  [["The next morning, he went to the park at six o'clock.", "Ertasi kuni ertalab soat oltida u parkka bordi."],
   ["He ran for three minutes and walked for two.", "Uch daqiqa yugurdi, ikki daqiqa yurdi."],
   ["He did this six times.", "Buni olti marta takrorladi."],
   ["His legs hurt for three days.", "Oyoqlari uch kun og'ridi."],
   ["But he went back to the park again and again.", "Lekin u parkka qayta-qayta bordi."]],
  [["After three months, he could run for thirty minutes without stopping.", "Uch oydan keyin u o'ttiz daqiqa to'xtamasdan yugura oladigan bo'ldi."],
   ["He stopped eating fast food and started cooking at home.", "Fast-fud yeyishni to'xtatdi va uyda ovqat pishira boshladi."],
   ["He lost twelve kilos.", "U o'n ikki kilo vazn tashladi."],
   ["He felt like a new person.", "U o'zini yangi odamdek his qildi."]],
  [["Then a friend told him about the Tashkent Marathon.", "Keyin bir do'sti unga Toshkent marafoni haqida aytdi."],
   ["Forty-two kilometres seemed impossible.", "Qirq ikki kilometr imkonsizdek tuyuldi."],
   ["But Nodir found a training plan online and followed it for six months.", "Lekin Nodir internetdan mashg'ulot rejasini topdi va olti oy unga amal qildi."],
   ["He ran in the rain, in the heat and in the dark.", "U yomg'irda ham, jaziramada ham, qorong'ida ham yugurdi."]],
  [["On the day of the race, there were thousands of runners.", "Poyga kuni minglab yuguruvchilar bor edi."],
   ["The first twenty kilometres were easy.", "Birinchi yigirma kilometr oson o'tdi."],
   ["After thirty, everything hurt, and he wanted to stop.", "O'ttizinchi kilometrdan keyin hamma joyi og'rib, to'xtagisi keldi."],
   ["Then he saw his wife and daughter with a big sign: \"Go, Dad!\"", "Keyin u rafiqasi va qizini \"Olg'a, dada!\" deb yozilgan katta plakat bilan ko'rdi."],
   ["He finished in four hours and fifty minutes. He cried at the finish line.", "U marraga to'rt soat ellik daqiqada yetib keldi. Marrada yig'lab yubordi."]]] },

 { id: "nophone", t: "A day without a phone", u: "Telefonsiz bir kun", lv: "Elementary", p: [
  [["Malika checked her phone more than a hundred times a day.", "Malika telefonini kuniga yuz martadan ko'proq tekshirardi."],
   ["She checked it in the morning before she opened her eyes properly.", "Ertalab ko'zlarini tuzukroq ochmasdanoq uni tekshirardi."],
   ["She checked it at lunch, on the bus and in bed at night.", "Tushlikda, avtobusda va kechasi yotganda ham tekshirardi."],
   ["One Saturday, she decided to try something: a whole day without her phone.", "Bir shanba kuni u bir narsani sinab ko'rishga qaror qildi: butun kun telefonsiz."]],
  [["She turned it off and put it in a drawer.", "U telefonini o'chirib, tortmaga solib qo'ydi."],
   ["The first hour was strange.", "Birinchi soat g'alati o'tdi."],
   ["Her hand looked for the phone again and again.", "Qo'li qayta-qayta telefonni qidirardi."],
   ["She didn't know the time, because she didn't have a watch.", "U soat necha bo'lganini bilmasdi, chunki qo'l soati yo'q edi."],
   ["She felt nervous. \"What if someone needs me?\" she thought.", "U xavotirlandi: \"Agar kimgadir kerak bo'lib qolsam-chi?\" deb o'yladi."]],
  [["She made breakfast and ate it slowly, looking out of the window.", "U nonushta tayyorladi va derazadan tashqariga qarab, uni shoshilmay yedi."],
   ["Then she went for a long walk in the park.", "Keyin parkda uzoq sayr qildi."],
   ["She noticed things she never saw before: old trees, a small fountain and children feeding birds.", "U ilgari hech qachon ko'rmagan narsalarni payqadi: qari daraxtlar, kichik favvora va qushlarga don berayotgan bolalar."],
   ["She sat on a bench and read a book for two hours.", "U skameykada o'tirib, ikki soat kitob o'qidi."]],
  [["In the afternoon, she visited her aunt without calling first.", "Tushdan keyin u oldindan qo'ng'iroq qilmasdan xolasinikiga bordi."],
   ["Her aunt was surprised and very happy.", "Xolasi hayron qoldi va juda xursand bo'ldi."],
   ["They drank tea and talked for three hours.", "Ular choy ichib, uch soat suhbatlashishdi."],
   ["Nobody looked at a screen.", "Hech kim ekranga qaramadi."]],
  [["At nine in the evening, she turned her phone on.", "Kechqurun soat to'qqizda u telefonini yoqdi."],
   ["There were forty-seven messages.", "Qirq yettita xabar kelgan edi."],
   ["None of them were important.", "Ularning birortasi ham muhim emas edi."],
   ["Now Malika has a phone-free Saturday once a month.", "Endi Malikaning oyda bir marta telefonsiz shanbasi bo'ladi."],
   ["\"It's the most relaxing day of the month,\" she says.", "\"Bu oyning eng xotirjam kuni\", deydi u."]]] },

 { id: "bus", t: "The wrong bus", u: "Noto'g'ri avtobus", lv: "Elementary", p: [
  [["On his first day in Tashkent, Farrux wanted to visit his uncle in Chilanzar.", "Toshkentdagi birinchi kunida Farrux Chilonzordagi tog'asinikiga bormoqchi bo'ldi."],
   ["He came from a small village near Termez.", "U Termiz yaqinidagi kichik qishloqdan kelgan edi."],
   ["In his village, there was only one bus, and everybody knew it.", "Qishlog'ida faqat bitta avtobus bor edi va uni hamma bilardi."],
   ["In Tashkent, there were hundreds.", "Toshkentda esa yuzlab avtobus bor edi."]],
  [["At the bus stop, he saw a bus with the number 15.", "Bekatda u 15-raqamli avtobusni ko'rdi."],
   ["\"My uncle said fifteen, I think,\" he said to himself, and got on.", "\"Tog'am o'n besh degandi, shekilli\", dedi u o'ziga o'zi va avtobusga chiqdi."],
   ["He paid with his new transport card and sat by the window.", "U yangi transport kartasi bilan to'ladi va deraza yoniga o'tirdi."],
   ["The city was big and beautiful.", "Shahar katta va chiroyli edi."],
   ["He looked at the tall buildings and forgot about time.", "U baland binolarga qarab, vaqtni unutdi."]],
  [["After forty minutes, the bus stopped, and everybody got off.", "Qirq daqiqadan keyin avtobus to'xtadi va hamma tushib ketdi."],
   ["It was the last stop.", "Bu oxirgi bekat edi."],
   ["Farrux looked around. There were no tall buildings here, only fields.", "Farrux atrofga qaradi. Bu yerda baland binolar yo'q edi, faqat dalalar bor edi."],
   ["\"Where is Chilanzar?\" he asked the driver.", "\"Chilonzor qayerda?\" — so'radi u haydovchidan."],
   ["The driver laughed. \"On the other side of the city, my friend!\"", "Haydovchi kuldi: \"Shaharning narigi tomonida, do'stim!\""]],
  [["Farrux called his uncle.", "Farrux tog'asiga qo'ng'iroq qildi."],
   ["\"I said FIVE, not fifteen!\" his uncle said.", "\"Men BESH degandim, o'n besh emas!\" — dedi tog'asi."],
   ["The driver felt sorry for him.", "Haydovchiga u achinib ketdi."],
   ["\"Stay on the bus. I'm going back to the centre. I'll show you the right stop.\"", "\"Avtobusda qoling. Men markazga qaytyapman. Sizga to'g'ri bekatni ko'rsatib qo'yaman.\""]],
  [["The driver didn't take money for the second trip.", "Haydovchi ikkinchi safar uchun pul olmadi."],
   ["On the way, he told Farrux about the city: the metro, the markets and the best cheap cafes.", "Yo'lda u Farruxga shahar haqida gapirib berdi: metro, bozorlar va eng arzon yaxshi kafelar haqida."],
   ["Farrux arrived at his uncle's house three hours late.", "Farrux tog'asinikiga uch soat kechikib yetib bordi."],
   ["But he arrived with a new friend in the city — the driver gave him his phone number.", "Lekin u shaharda yangi do'st orttirib keldi — haydovchi unga telefon raqamini berdi."]]] },

 { id: "birthday", t: "A birthday surprise", u: "Tug'ilgan kun sovg'asi", lv: "Elementary", p: [
  [["Next Friday is Shoira's fortieth birthday.", "Kelasi juma Shoiraning qirq yoshga to'ladigan kuni."],
   ["She told her family, \"I don't want a party. I'm too busy.\"", "U oilasiga: \"Bazm kerak emas. Juda bandman\", dedi."],
   ["But her husband, Alisher, had a secret plan.", "Lekin eri Alisherning yashirin rejasi bor edi."],
   ["He wanted to give her the best surprise of her life.", "U unga hayotidagi eng yaxshi kutilmagan sovg'ani bermoqchi edi."]],
  [["For three weeks, Alisher worked in secret.", "Uch hafta davomida Alisher yashirincha harakat qildi."],
   ["He called Shoira's old school friends.", "U Shoiraning eski maktabdosh dugonalariga qo'ng'iroq qildi."],
   ["Some of them lived in other cities, and one lived in Germany.", "Ulardan ba'zilari boshqa shaharlarda, biri esa Germaniyada yashardi."],
   ["He booked a small restaurant and ordered her favourite cake.", "U kichik restoranni band qildi va uning sevimli tortiga buyurtma berdi."],
   ["Their children made a video with old family photos.", "Bolalari eski oilaviy suratlardan video tayyorlashdi."]],
  [["The hardest part was keeping the secret.", "Eng qiyini sirni saqlash bo'ldi."],
   ["Once, Shoira saw a message on Alisher's phone: \"Cake ready on Friday\".", "Bir kuni Shoira Alisherning telefonida \"Tort jumaga tayyor\" degan xabarni ko'rib qoldi."],
   ["\"What cake?\" she asked.", "\"Qanaqa tort?\" — so'radi u."],
   ["\"It's for a colleague,\" Alisher said quickly. His face was red.", "\"Hamkasbim uchun\", dedi Alisher tezda. Yuzi qizarib ketdi."]],
  [["On Friday evening, Alisher said, \"Let's have dinner, just the two of us.\"", "Juma kuni kechqurun Alisher: \"Kel, ikkalamiz kechki ovqatga boraylik\", dedi."],
   ["They drove to the restaurant.", "Ular restoranga mashinada borishdi."],
   ["When Shoira opened the door, the lights came on, and thirty people shouted, \"Surprise!\"", "Shoira eshikni ochganda chiroqlar yondi va o'ttiz kishi: \"Kutilmagan sovg'a!\" deb qichqirdi."],
   ["She saw her parents, her children and her friends from school.", "U ota-onasini, bolalarini va maktabdosh dugonalarini ko'rdi."],
   ["Then she saw Dildora, her best friend from Germany. She didn't see her for twelve years.", "Keyin u Germaniyadan kelgan eng yaqin dugonasi Dildorani ko'rdi. Uni o'n ikki yildan beri ko'rmagan edi."]],
  [["Shoira cried and laughed at the same time.", "Shoira bir vaqtning o'zida ham yig'ladi, ham kuldi."],
   ["They watched the video, ate cake and danced until midnight.", "Ular videoni ko'rishdi, tort yeyishdi va yarim tungacha raqs tushishdi."],
   ["In the car, Shoira held Alisher's hand.", "Mashinada Shoira Alisherning qo'lini ushlab oldi."],
   ["\"You're a terrible liar,\" she said. \"But you're a wonderful husband.\"", "\"Sen yolg'onni umuman eplay olmaysan\", dedi u. \"Lekin ajoyib ersan.\""]]] },

 { id: "moving", t: "Moving to a new city", u: "Yangi shaharga ko'chish", lv: "Elementary", p: [
  [["Last year, Diyora got a job in Navoi.", "O'tgan yili Diyora Navoiydan ish topdi."],
   ["She was born in Tashkent and lived there all her life.", "U Toshkentda tug'ilgan va butun umri shu yerda yashagan edi."],
   ["Her family, her friends and her favourite places were all there.", "Oilasi, do'stlari va sevimli joylari — hammasi o'sha yerda edi."],
   ["But the job was very good, so she said yes.", "Lekin ish juda yaxshi edi, shuning uchun u rozi bo'ldi."]],
  [["The first month was lonely.", "Birinchi oy yolg'iz o'tdi."],
   ["She didn't know anybody.", "U hech kimni tanimasdi."],
   ["After work, she sat in her small flat and called her mother.", "Ishdan keyin kichkina xonadonida o'tirib, onasiga qo'ng'iroq qilardi."],
   ["The city was quiet, and the evenings were long.", "Shahar sokin, kechalar esa uzun edi."],
   ["Some evenings, she wanted to pack her bags and go home.", "Ba'zi kechalari u yuklarini yig'ib, uyga qaytib ketgisi kelardi."]],
  [["Then she made a decision.", "Keyin u bir qarorga keldi."],
   ["\"I'll say yes to everything for one month,\" she thought.", "\"Bir oy davomida hamma narsaga 'ha' deyman\", deb o'yladi u."],
   ["When a colleague invited her to lunch, she went.", "Bir hamkasbi uni tushlikka taklif qilganda, u bordi."],
   ["When her neighbour asked for help with a computer, she helped.", "Qo'shnisi kompyuter bilan yordam so'raganda, yordam berdi."],
   ["She joined a running club and an English speaking club.", "U yugurish klubiga va ingliz tilida suhbat klubiga a'zo bo'ldi."]],
  [["Slowly, things changed.", "Asta-sekin hammasi o'zgardi."],
   ["The running club met every Saturday morning by the lake.", "Yugurish klubi har shanba ertalab ko'l bo'yida yig'ilardi."],
   ["After the run, they always had breakfast together.", "Yugurishdan keyin ular doim birga nonushta qilishardi."],
   ["Her neighbour's family invited her for plov every Friday.", "Qo'shnisining oilasi uni har juma palovga taklif qilardi."],
   ["She found a small bookshop with a cafe, and the owner knew her name.", "U kafesi bor kichik kitob do'konini topdi, do'kon egasi uning ismini bilardi."]],
  [["Now Diyora has lived in Navoi for a year.", "Endi Diyora Navoiyda bir yildan beri yashaydi."],
   ["She still misses Tashkent sometimes.", "U hali ham ba'zan Toshkentni sog'inadi."],
   ["But when she visits her parents, after a week she says, \"I want to go home.\"", "Lekin ota-onasinikiga borganda, bir haftadan keyin: \"Uyga qaytgim keldi\", deydi."],
   ["And by \"home\", she means Navoi.", "\"Uy\" deganda esa Navoiyni nazarda tutadi."]]] },

{"id": "plaunch", "t": "The Lost Suitcase", "u": "Yo'qolgan chamadon", "lv": "Pre-intermediate", "p": [[["Last spring, my older brother was studying in Almaty, and I decided to visit him for a week.", "O'tgan bahorda akam Olmaotada o'qiyotgan edi va men bir haftaga uning oldiga borishga qaror qildim."], ["I had never flown alone before, so I was both excited and nervous.", "Men ilgari hech qachon yolg'iz uchmagan edim, shuning uchun ham hayajonlangan, ham xavotirda edim."], ["My mother packed so much food for him that my suitcase was almost too heavy to close.", "Onam unga shunchalik ko'p ovqat solib berdiki, chamadonim yopilmaydigan darajada og'ir bo'lib qoldi."], ["There was dried fruit, homemade bread and three jars of her famous apricot jam.", "Unda quruq meva, uy noni va onamning mashhur o'rik murabbosidan uch banka bor edi."]], [["The flight was short and calm, and I watched the mountains from the window the whole time.", "Parvoz qisqa va tinch o'tdi, men butun yo'l derazadan tog'larni tomosha qildim."], ["When we landed, I went to wait for my bag with the other passengers.", "Qo'nganimizdan keyin boshqa yo'lovchilar bilan birga sumkamni kutgani bordim."], ["One by one, they took their suitcases and left.", "Ular birin-ketin chamadonlarini olib ketishdi."], ["After forty minutes, I was standing alone next to an empty belt.", "Qirq daqiqadan keyin men bo'm-bo'sh lenta yonida yolg'iz turardim."]], [["I went to the lost baggage desk, where a tired woman was drinking coffee.", "Yo'qolgan bagaj bo'limiga bordim, u yerda charchagan bir ayol qahva ichib o'tirgan edi."], ["She checked her computer and told me that my suitcase had stayed in Tashkent.", "U kompyuterini tekshirib, chamadonim Toshkentda qolib ketganini aytdi."], ["Somebody had put the wrong label on it, so it had missed the plane.", "Kimdir unga noto'g'ri yorliq yopishtirgan ekan, shuning uchun u samolyotga ulgurmay qolgan edi."], ["\"Don't worry, it will arrive tomorrow evening,\" she said.", "«Xavotir olmang, u ertaga kechqurun yetib keladi», dedi u."], ["I wasn't worried about my clothes, but I was very worried about the jam.", "Kiyimlarim uchun xavotir olmasdim, lekin murabbo uchun juda xavotirda edim."]], [["My brother met me outside and laughed when he heard the story.", "Akam meni tashqarida kutib oldi va voqeani eshitib kulib yubordi."], ["He lent me a T-shirt that was two sizes too big.", "U menga ikki o'lcham katta futbolkasini berib turdi."], ["That evening, we walked around the city and ate in a small cafe near his university.", "O'sha oqshom shahar bo'ylab sayr qildik va universiteti yaqinidagi kichik kafeda ovqatlandik."], ["He told me that he had missed our mother's cooking more than anything else.", "U menga hammadan ko'ra onamizning ovqatlarini sog'inganini aytdi."], ["I didn't tell him what was in the suitcase, because I wanted it to be a surprise.", "Chamadonda nima borligini unga aytmadim, chunki bu kutilmagan sovg'a bo'lishini xohlardim."]], [["The next evening, a driver brought the suitcase to my brother's flat.", "Ertasi kuni kechqurun bir haydovchi chamadonni akamning kvartirasiga olib keldi."], ["It looked fine from the outside, but it smelled strongly of apricots.", "Tashqaridan u joyida ko'rinardi, lekin undan o'rikning kuchli hidi kelardi."], ["When I opened it, I saw that one jar had broken and the jam had covered my clothes.", "Uni ochganimda bitta banka sinib, murabbo kiyimlarimga to'kilganini ko'rdim."], ["Luckily, the bread and the other two jars had survived the journey.", "Baxtimizga, non va qolgan ikki banka yo'lda butun qolgan edi."]], [["My brother ate the bread with jam straight from the jar, standing in the kitchen.", "Akam oshxonada tik turgan holda nonni to'g'ridan-to'g'ri bankadagi murabbo bilan yedi."], ["He said it was the best thing that had happened to him all year.", "U buni butun yil davomidagi eng yaxshi voqea deb aytdi."], ["I spent the next morning at a laundry, washing apricot jam out of my shirts.", "Ertasi tongni kir yuvish joyida ko'ylaklarimdagi o'rik murabbosini yuvib o'tkazdim."], ["Now, whenever I fly, my mother wraps every jar in three plastic bags.", "Endi qachon samolyotda uchsam, onam har bir bankani uchta polietilen paketga o'rab beradi."]]]},
{"id": "pfergana", "t": "The House in Fergana", "u": "Farg'onadagi uy", "lv": "Pre-intermediate", "p": [[["Every summer, Sardor and his two sisters used to spend their holidays at their grandmother's house in Fergana.", "Har yozda Sardor va uning ikki opa-singlisi ta'tilni Farg'onadagi buvisining uyida o'tkazishardi."], ["The house had a big garden full of apricot trees and a grapevine over the courtyard.", "Uyning o'rik daraxtlariga to'la katta bog'i va hovli ustida tok so'risi bor edi."], ["Now they were adults with jobs in Tashkent, and they rarely visited.", "Endi ular Toshkentda ishlaydigan katta odamlar edi va kamdan-kam kelishardi."], ["One day, their grandmother called and asked all three of them to come for an important conversation.", "Bir kuni buvisi qo'ng'iroq qilib, uchalasidan ham muhim suhbat uchun kelishlarini so'radi."]], [["On the train, the three of them tried to guess what it was about.", "Poyezdda uchalasi gap nima haqida ekanini taxmin qilishga urinishdi."], ["\"She's going to sell the house,\" said Malika, the oldest.", "«U uyni sotmoqchi», dedi eng kattasi Malika."], ["\"Maybe she's ill and doesn't want to tell us on the phone,\" said Zarina, looking worried.", "«Balki u kasaldir va telefonda aytishni istamayotgandir», dedi Zarina xavotir bilan."], ["Sardor didn't say anything, but he was thinking about the apricot trees.", "Sardor hech narsa demadi, lekin o'rik daraxtlari haqida o'ylayotgan edi."]], [["Their grandmother met them at the gate, looking healthy and cheerful.", "Buvisi ularni darvoza oldida sog'lom va xushchaqchaq holda kutib oldi."], ["She had cooked plov and laid the table under the grapevine, just like in the old days.", "U palov pishirib, xuddi eski kunlardagidek tok so'risi ostida dasturxon yozgan edi."], ["After dinner, she finally told them the news.", "Kechki ovqatdan keyin u nihoyat yangilikni aytdi."], ["A company from Tashkent had offered to buy the garden's apricots every year.", "Toshkentdagi bir kompaniya bog'dagi o'riklarni har yili sotib olishni taklif qilgan ekan."], ["But she was eighty-one, and she couldn't manage the harvest alone anymore.", "Lekin u sakson bir yoshda edi va hosilni endi yolg'iz uddalay olmasdi."]], [["\"If nobody helps me, I'll have to say no,\" she said simply.", "«Agar hech kim yordam bermasa, yo'q deyishimga to'g'ri keladi», dedi u oddiygina."], ["The three grandchildren looked at each other in silence.", "Uch nabira jimgina bir-biriga qarashdi."], ["Malika worked in a pharmacy, Zarina was a nurse, and Sardor was a school teacher.", "Malika dorixonada ishlardi, Zarina hamshira edi, Sardor esa maktab o'qituvchisi edi."], ["None of them knew anything about apricots, except how to eat them.", "Ularning hech biri o'rik haqida uni qanday yeyishdan boshqa hech narsa bilmasdi."]], [["Then Sardor had an idea.", "Shunda Sardorning xayoliga bir fikr keldi."], ["He could stay in Fergana for the whole summer, because the schools were closed until September.", "U butun yoz Farg'onada qolishi mumkin edi, chunki maktablar sentabrgacha yopiq edi."], ["His sisters promised to come every weekend during the harvest and to bring their children.", "Opa-singillari hosil paytida har dam olish kuni kelishga va bolalarini olib kelishga va'da berishdi."], ["Their grandmother listened, and for the first time that evening, her eyes were wet.", "Buvisi tingladi va o'sha oqshom birinchi marta uning ko'zlari namlandi."]], [["That summer was the busiest of Sardor's life.", "O'sha yoz Sardorning hayotidagi eng band yoz bo'ldi."], ["He prepared his lessons in the mornings and climbed trees in the afternoons.", "U ertalablari darslariga tayyorlandi, tushdan keyin esa daraxtlarga chiqdi."], ["The children ate more apricots than they picked, but nobody minded.", "Bolalar terganidan ko'ra ko'proq o'rik yeyishdi, lekin hech kim bunga qarshi emasdi."], ["In September, the company paid for two tonnes of fruit.", "Sentabrda kompaniya ikki tonna meva uchun pul to'ladi."], ["Their grandmother spent the money on a new roof, so that the house would be ready for many more summers.", "Buvisi pulni yangi tomga sarfladi, toki uy yana ko'p yozlarga tayyor bo'lsin."]]]},
{"id": "pdried", "t": "From the Bazaar to Telegram", "u": "Bozordan Telegramgacha", "lv": "Pre-intermediate", "p": [[["For twelve years, Dilfuza had sold dried fruit and nuts at Chorsu Bazaar.", "O'n ikki yil davomida Dilfuza Chorsu bozorida quruq meva va yong'oq sotib kelgan edi."], ["Her stall was small, but her customers loved her raisins and her honest prices.", "Uning rastasi kichik edi, lekin xaridorlar uning mayizini va halol narxlarini yaxshi ko'rishardi."], ["However, in the last two years, fewer and fewer people had come to the bazaar.", "Biroq so'nggi ikki yilda bozorga keladigan odamlar tobora kamayib borgan edi."], ["Most of them now ordered everything on their phones.", "Ularning ko'pchiligi endi hamma narsani telefonlari orqali buyurtma qilardi."]], [["Her son Bekzod, who was studying marketing, suggested opening a Telegram shop.", "Marketing o'qiyotgan o'g'li Bekzod Telegram do'kon ochishni taklif qildi."], ["At first, Dilfuza laughed at the idea.", "Avvaliga Dilfuza bu fikrga kulib qo'ydi."], ["\"Who will buy almonds from a photo?\" she asked.", "«Kim surat orqali bodom sotib oladi?» deb so'radi u."], ["But Bekzod didn't give up, and one weekend he took photos of everything on her stall.", "Lekin Bekzod taslim bo'lmadi va bir dam olish kuni rastadagi hamma narsani suratga oldi."], ["He set up a channel, wrote short descriptions and added the prices.", "U kanal ochdi, qisqa tavsiflar yozdi va narxlarni qo'shdi."]], [["In the first week, only three people placed orders, and two of them were relatives.", "Birinchi haftada faqat uch kishi buyurtma berdi, ularning ikkitasi qarindoshlar edi."], ["Then a popular food blogger tried her apricots and posted a video about them.", "Keyin mashhur bir ovqat blogeri uning o'riklarini tatib ko'rdi va ular haqida video joylashtirdi."], ["By the next morning, the channel had six hundred new subscribers.", "Ertasi tongga kelib kanalda olti yuzta yangi obunachi paydo bo'lgan edi."], ["Dilfuza's phone didn't stop ringing all day.", "Dilfuzaning telefoni kun bo'yi jiringlashdan to'xtamadi."]], [["That was when the problems started.", "Muammolar aynan shunda boshlandi."], ["They had never packed so many orders before, and they had no system at all.", "Ular ilgari hech qachon bunchalik ko'p buyurtma qadoqlamagan edi va ularda hech qanday tizim yo'q edi."], ["One customer received walnuts instead of almonds, and another got two kilos of raisins instead of two hundred grams.", "Bir xaridor bodom o'rniga yong'oq oldi, boshqasi esa ikki yuz gramm o'rniga ikki kilo mayiz oldi."], ["A woman from Chilonzor called to complain that her package had been delivered to Yunusobod.", "Chilonzorlik bir ayol posilkasi Yunusobodga yetkazilganidan shikoyat qilib qo'ng'iroq qildi."]], [["Dilfuza wanted to close the channel, but Bekzod made a simple spreadsheet instead.", "Dilfuza kanalni yopmoqchi bo'ldi, lekin Bekzod buning o'rniga oddiy jadval tuzdi."], ["Every order was given a number, and every bag was checked twice before it left the house.", "Har bir buyurtmaga raqam berildi va har bir xalta uydan chiqishidan oldin ikki marta tekshirildi."], ["They also hired a neighbour's son to deliver packages on his bicycle.", "Ular posilkalarni velosipedda yetkazib berish uchun qo'shnining o'g'lini ham ishga olishdi."], ["The customer with two kilos of raisins was told to keep them as a gift.", "Ikki kilo mayiz olgan xaridorga ularni sovg'a sifatida olib qolishni aytishdi."]], [["Six months later, the online shop was earning more than the stall.", "Olti oydan keyin onlayn do'kon rastadan ko'ra ko'proq daromad keltirayotgan edi."], ["Dilfuza still goes to the bazaar, though, because she enjoys chatting with her old customers.", "Shunday bo'lsa-da, Dilfuza hali ham bozorga boradi, chunki eski xaridorlari bilan suhbatlashishni yoqtiradi."], ["The customer with the raisins has become her most loyal buyer.", "Mayiz olgan o'sha xaridor uning eng sodiq mijoziga aylandi."], ["\"A mistake can be good advertising too,\" Dilfuza likes to say, \"if you fix it with a smile.\"", "Dilfuza shunday deyishni yaxshi ko'radi: «Agar xatoni tabassum bilan tuzatsangiz, u ham yaxshi reklama bo'lishi mumkin.»"]]]},
{"id": "pmisread", "t": "The Parrot Who Talked Too Much", "u": "Ko'p gapiradigan to'tiqush", "lv": "Pre-intermediate", "p": [[["Last month, our neighbour Akmal aka went to visit his daughter in Moscow for three weeks.", "O'tgan oy qo'shnimiz Akmal aka uch haftaga Moskvadagi qizinikiga mehmonga ketdi."], ["Before he left, he asked us to look after his parrot, Kesha.", "Ketishdan oldin u bizdan to'tiqushi Keshaga qarab turishimizni so'radi."], ["My mother was happy to help, because she loves birds.", "Onam yordam berishdan xursand edi, chunki u qushlarni yaxshi ko'radi."], ["Unfortunately, Kesha could speak much better than we had thought.", "Afsuski, Kesha biz o'ylaganimizdan ancha yaxshiroq gapirar ekan."]], [["On the first morning, my father was reading the newspaper in the kitchen.", "Birinchi kuni ertalab otam oshxonada gazeta o'qiyotgan edi."], ["Suddenly, a loud voice shouted, \"Get up! You're late!\"", "To'satdan baland ovoz: «Tur! Kechikding!» deb qichqirdi."], ["My father jumped up, grabbed his bag and ran to the door.", "Otam sakrab turdi, sumkasini oldi va eshik tomon yugurdi."], ["Then he remembered that it was Sunday.", "Keyin bugun yakshanba ekanini esladi."], ["Behind him, Kesha was laughing exactly like Akmal aka.", "Orqasida Kesha xuddi Akmal akadek kulayotgan edi."]], [["Over the next few days, the parrot learned new words very quickly.", "Keyingi bir necha kun ichida to'tiqush yangi so'zlarni juda tez o'rgandi."], ["It copied the sound of our phone, so we kept answering calls that didn't exist.", "U telefonimizning ovoziga taqlid qilardi, shuning uchun biz yo'q qo'ng'iroqlarga javob berib yurdik."], ["It also learned my little sister's favourite sentence: \"I'm not hungry!\"", "U singlimning eng sevimli gapini ham o'rganib oldi: «Men och emasman!»"], ["My mother told me that she had never seen such a clever bird.", "Onam menga hech qachon bunday aqlli qushni ko'rmaganini aytdi."]], [["The real problem started on Thursday, when my mother was talking to my aunt on the phone.", "Asl muammo payshanba kuni, onam xolam bilan telefonda gaplashayotganda boshlandi."], ["She was telling her that my father snored very loudly at night.", "U xolamga otam kechasi juda qattiq xurrak otishini aytayotgan edi."], ["That evening, my father's old friends came to play chess with him.", "O'sha kuni kechqurun otamning eski do'stlari u bilan shaxmat o'ynagani kelishdi."], ["In the middle of the game, Kesha said clearly in my mother's voice, \"He snores like a tractor!\"", "O'yinning o'rtasida Kesha onamning ovozida aniq qilib: «U traktordek xurrak otadi!» dedi."]], [["For a moment, nobody said anything.", "Bir lahza hech kim hech narsa demadi."], ["Then all the men started laughing so hard that one of them dropped his tea.", "Keyin hamma erkaklar shunchalik qattiq kulib yuborishdiki, ulardan biri choyini to'kib yubordi."], ["My father's face went red, and he looked at my mother in the kitchen.", "Otamning yuzi qizarib ketdi va u oshxonadagi onamga qaradi."], ["My mother pretended that she hadn't heard anything and kept washing the dishes.", "Onam hech narsa eshitmagandek o'zini tutib, idish yuvishda davom etdi."]], [["Since then, we have been much more careful with our words at home.", "O'shandan beri uyda so'zlarimizga ancha ehtiyot bo'lib qoldik."], ["When Kesha is in the room, we only say nice things about each other.", "Kesha xonada bo'lganida bir-birimiz haqida faqat yaxshi gaplarni gapiramiz."], ["Last week, Akmal aka came back and took his parrot home.", "O'tgan hafta Akmal aka qaytib keldi va to'tiqushini uyiga olib ketdi."], ["The next morning, we heard Kesha through the wall: \"He snores like a tractor!\"", "Ertasi kuni ertalab devor ortidan Keshaning ovozini eshitdik: «U traktordek xurrak otadi!»"], ["I think Akmal aka now knows more about our family than our closest relatives.", "Menimcha, Akmal aka endi oilamiz haqida eng yaqin qarindoshlarimizdan ham ko'proq biladi."]]]},
{"id": "pbread", "t": "The Bread on the Doorstep", "u": "Ostonadagi non", "lv": "Pre-intermediate", "p": [[["Aunt Saodat lived alone at the end of the street, in a small house with blue gates.", "Saodat xola ko'chaning oxirida, ko'k darvozali kichkina uyda yolg'iz yashardi."], ["Her husband had died years ago, and her children lived abroad.", "Eri yillar oldin vafot etgan, farzandlari esa chet elda yashashardi."], ["Every Friday morning, she found two warm loaves of non on her doorstep.", "Har juma kuni ertalab u ostonasida ikkita issiq non topardi."], ["Nobody knew who left them there, and this had been going on for almost a year.", "Ularni kim qoldirishini hech kim bilmasdi va bu deyarli bir yildan beri davom etayotgan edi."]], [["The whole mahalla had a theory.", "Butun mahallaning o'z taxmini bor edi."], ["Some people said it must be the baker from the next street.", "Ba'zilar bu qo'shni ko'chadagi novvoy bo'lsa kerak, deyishardi."], ["Others believed that one of her sons was paying someone to do it.", "Boshqalar uning o'g'illaridan biri kimgadir buning uchun pul to'layapti, deb ishonishardi."], ["Old Rahim aka insisted it was an angel, but he said that about most things.", "Keksa Rahim aka bu farishta, deb turib olardi, lekin u ko'p narsa haqida shunday derdi."]], [["Twelve-year-old Madina, who lived opposite, decided to solve the mystery.", "Qarshida yashaydigan o'n ikki yoshli Madina sirni ochishga qaror qildi."], ["She had read a lot of detective stories, and she knew that a good detective must be patient.", "U ko'plab detektiv hikoyalar o'qigan edi va yaxshi detektiv sabrli bo'lishi kerakligini bilardi."], ["On Thursday night, she set her alarm for five o'clock.", "Payshanba kechasi u budilnikni soat beshga qo'ydi."], ["Then she sat by her window with a blanket and a cup of tea.", "Keyin adyol va bir piyola choy bilan derazasi yoniga o'tirdi."]], [["At half past five, a tall figure appeared in the grey morning light.", "Soat besh yarimda kulrang tong yorug'ida baland bo'yli bir qora ko'rindi."], ["It was Javlon, the quiet teenager from number fourteen.", "Bu o'n to'rtinchi uydagi kamgap o'smir Javlon edi."], ["He put the bread down carefully, looked around and hurried away.", "U nonni ehtiyotkorlik bilan qo'ydi, atrofga qaradi va shoshib ketdi."], ["Madina was so surprised that she spilled her tea on the blanket.", "Madina shunchalik hayron qoldiki, choyini adyolga to'kib yubordi."]], [["Later that day, she found Javlon outside the school and asked him directly.", "O'sha kuni keyinroq u Javlonni maktab oldida topib, undan to'g'ridan-to'g'ri so'radi."], ["He went red and explained that he had been working at a bakery before school.", "U qizarib ketdi va maktabdan oldin novvoyxonada ishlab yurganini tushuntirdi."], ["When he was little, Aunt Saodat had taught him to read while his parents were at work.", "U kichkinaligida, ota-onasi ishda bo'lgan paytlarda, Saodat xola unga o'qishni o'rgatgan ekan."], ["\"I just wanted to say thank you,\" he said, \"but I'm not good with words.\"", "«Shunchaki rahmat aytmoqchi edim, — dedi u, — lekin gapga usta emasman.»"]], [["Madina promised to keep his secret, and she kept it for exactly three days.", "Madina uning sirini saqlashga va'da berdi va uni roppa-rosa uch kun saqladi."], ["Then she told her mother, who told the neighbours, who told everyone else.", "Keyin onasiga aytdi, onasi qo'shnilarga, qo'shnilar esa qolgan hammaga aytib chiqdi."], ["On Friday, Aunt Saodat waited at her gate until Javlon came.", "Juma kuni Saodat xola Javlon kelguncha darvozasi oldida kutib turdi."], ["She invited him in for breakfast, and now they eat the bread together every week.", "U uni nonushtaga taklif qildi va endi ular har hafta nonni birga yeyishadi."], ["Rahim aka still says it was an angel, and maybe he isn't completely wrong.", "Rahim aka hamon bu farishta edi, deydi, va balki u butunlay noto'g'ri emasdir."]]]},
