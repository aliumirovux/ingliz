  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iliq, tahririy (Busuu ruhida) — neytral ochiq fon, Onest Bold sarlavhalar, terrakota aksent; bitta ustun (640px gacha), pastda 4 bo'limli menyu */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#E9EAE5; --ink:#17171B; --muted:#5E5F67; --line:#E1E2DD; --line-strong:#CBCCC6;
  --marker:#B9441F; --on-marker:#FFFFFF; --hl:#F8E4D9; --marker-soft:#F8E4D9; --accent-text:#9C3615;
  --pron:#7A5A2B; --ok:#2C5E2A; --ok-strong:#3F8A3B; --ok-bg:#E5F2E4; --bad:#9A2B1C; --bad-strong:#C9452E; --bad-bg:#F9E3DD;
  --shadow:0 1px 2px rgba(23,23,27,.05), 0 10px 28px -14px rgba(23,23,27,.18);
  --glass:rgba(255,255,255,.72); --glass-solid:#FFFFFF; --glass-edge:rgba(255,255,255,.9); --glass-line:rgba(23,23,27,.08); --glass-shadow:0 10px 30px rgba(23,23,27,.14), 0 2px 6px rgba(23,23,27,.06); --lens:rgba(185,68,31,.13);
  --font-display:var(--font-body);
  --font-body:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:var(--font-body);
  --nav-h:64px; --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111113; --surface:#1A1A1E; --surface-2:#26262C; --ink:#EEEEE9; --muted:#A0A1A8; --line:#2A2B30; --line-strong:#3B3C42;
    --marker:#E27A4E; --on-marker:#1C1A16; --hl:#4A2A1C; --marker-soft:#3A2318; --accent-text:#F09A72;
    --pron:#D9B27A; --ok:#8BCB86; --ok-strong:#5FA85A; --ok-bg:#1C2A1B; --bad:#FF9A85; --bad-strong:#E0644C; --bad-bg:#3A1D17;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
    --glass:rgba(38,38,44,.55); --glass-solid:#26262C; --glass-edge:rgba(255,255,255,.14); --glass-line:rgba(255,255,255,.06); --glass-shadow:0 12px 34px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3); --lens:rgba(226,122,78,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#111113; --surface:#1A1A1E; --surface-2:#26262C; --ink:#EEEEE9; --muted:#A0A1A8; --line:#2A2B30; --line-strong:#3B3C42;
    --marker:#E27A4E; --on-marker:#1C1A16; --hl:#4A2A1C; --marker-soft:#3A2318; --accent-text:#F09A72;
    --pron:#D9B27A; --ok:#8BCB86; --ok-strong:#5FA85A; --ok-bg:#1C2A1B; --bad:#FF9A85; --bad-strong:#E0644C; --bad-bg:#3A1D17;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
    --glass:rgba(38,38,44,.55); --glass-solid:#26262C; --glass-edge:rgba(255,255,255,.14); --glass-line:rgba(255,255,255,.06); --glass-shadow:0 12px 34px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3); --lens:rgba(226,122,78,.2);
    color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
/* fon html'da ham: Android Chrome pastki panel rangini sahifa fonidan olishi mumkin, boshida oq chiqmasin (tajriba) */
html{background:var(--bg)}
/* sahifa almashish animatsiyasi yon tomonga chiqib, telefonda sahifani kichraytirmasin */
.stage{overflow-x:hidden}
@supports (overflow:clip){ .stage{overflow-x:clip} }
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px))}
button{font:inherit;color:inherit}
a{color:inherit}
svg{flex:none}
::selection{background:var(--hl);color:var(--ink)}
:focus-visible{outline:2px solid var(--marker);outline-offset:2px;border-radius:6px}
/* telefonda bosilganda brauzerning ko'k fonini o'chiramiz; o'rniga o'zimizning bosish holatlari */
html{-webkit-tap-highlight-color:transparent}
a.li:active,button.li:active{background:var(--marker-soft)}
.steps button:active,.back:active{opacity:.6}
.opt:active:not(:disabled),.mode:active,.chip:active,.tile:active,.me:active{transform:scale(.98)}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 36px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1{font:700 32px/1.1 var(--font-display);letter-spacing:-.025em;margin:4px 0 6px;text-wrap:balance}
h2{font:700 22px/1.2 var(--font-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0 0 20px;max-width:60ch}
.muted{color:var(--muted);font-size:15px}
.label,.eyebrow{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 10px}
.hidden{display:none!important}
.stack{display:flex;flex-direction:column;gap:12px}
.stack>*+*{margin-top:0}
.row{display:flex;gap:10px}.row>*{flex:1}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:15px;text-decoration:none;margin:0 0 4px;min-height:44px}
.back:hover{color:var(--ink)}
/* marker highlight */
.mk{color:var(--accent-text)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;min-height:52px;padding:12px 18px;font-weight:600;font-size:16px;cursor:pointer;background:var(--marker);color:var(--on-marker);width:100%;text-decoration:none;transition:transform .15s cubic-bezier(.16,1,.3,1), filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.ghost:hover{filter:brightness(.97)}
.btn:disabled{background:var(--surface-2);color:var(--muted);cursor:default;filter:none;transform:none}
.icon{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);color:var(--ink);border:0;border-radius:999px;padding:8px 14px;min-height:36px;font-weight:500;cursor:pointer;font-size:14px;line-height:1.2}
.icon:hover{filter:brightness(.96)}
.icon svg{width:17px;height:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;min-height:36px}
.chip.on{background:var(--marker-soft);color:var(--accent-text);box-shadow:inset 0 0 0 1.5px var(--marker);font-weight:600}

/* surfaces */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.hero{background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:20px}

/* today: salomlashuv, kurs joyi, bitta dars kartasi, haftalik seriya */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 0 14px}
.hello h1{margin:0}
.hello .date{color:var(--muted);font-size:14px;margin:0 0 2px}
.me{flex:none;width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--muted);text-decoration:none}
.me:hover{color:var(--ink)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.pill{position:relative;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.pill svg{width:17px;height:17px;color:var(--marker)}
.pill .dn{color:var(--muted);display:flex}.pill .dn svg{color:inherit;width:15px;height:15px}
.pill select{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer;font-size:16px}
.pill:focus-within{outline:2px solid var(--marker);outline-offset:2px}
.lesson{background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:20px}
.lesson .meta{font-size:13px;color:var(--muted);margin:0}
.lesson .meta b{color:var(--accent-text);font-weight:600}
.lesson h2{font-size:30px;line-height:1.1;letter-spacing:-.025em;margin:6px 0 4px}
.lesson .uz{color:var(--muted);font-size:15px;margin:0}
.steps{list-style:none;margin:10px 0 16px;padding:0}
.steps button{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;background:none;border:0;padding:10px 0;text-align:left;cursor:pointer}
.steps li+li button{border-top:1px solid var(--line)}
.steps .ic{flex:none;width:38px;height:38px;border-radius:12px;background:var(--marker-soft);color:var(--accent-text);display:grid;place-items:center}
.steps .ic svg{width:19px;height:19px}
.steps .done .ic{background:var(--ok-bg);color:var(--ok)}
.steps .tx{flex:1;min-width:0}
.steps .tx b{display:block;font-weight:600;font-size:15px}
.steps .tx span{display:block;font-size:13px;color:var(--muted)}
.steps .done .tx b{color:var(--muted)}
.steps .min{flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.week{display:flex;justify-content:space-between;padding:12px 14px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.week div{display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--muted)}
.week i{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--on-marker)}
.week i svg{width:16px;height:16px}
.week i.on{background:var(--marker)}
.week i.now:not(.on){background:transparent;box-shadow:inset 0 0 0 2px var(--marker)}
.week div.now{color:var(--ink);font-weight:600}
.medal{width:96px;height:96px;margin:18px auto 0;border-radius:50%;background:var(--ok-strong);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 12px var(--ok-bg)}
.medal svg{width:44px;height:44px}
.done-h{font:700 32px/1.1 var(--font-display);letter-spacing:-.025em;margin:30px 0 6px;text-align:center}
.unitname{font:600 18px/1.3 var(--font-body);margin:0}
.unituz{color:var(--muted);font-size:15px;margin:2px 0 16px}
.meter{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.meter .pbar{flex:1;margin:0}
.streak{display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:14px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.facts b{color:var(--ink);font-weight:600}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}
.foot a{color:var(--muted)}

.unitbig{font:700 34px/1.1 var(--font-display);letter-spacing:-.025em;margin:6px 0 4px}
/* unit list & rows */
.units{display:flex;flex-direction:column;gap:10px}
.unit{display:block;text-align:left;width:100%;background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .15s cubic-bezier(.16,1,.3,1)}
.unit:active{transform:scale(.99)}
.unit .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.unit b{font-size:16px;font-weight:600}
.unit .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.urow{display:flex;gap:14px;align-items:center}
.urow .num{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font:700 22px/1 var(--font-display);background:var(--surface-2)}
.urow.cur .num{background:var(--marker);color:var(--on-marker)}
.urow .tx{flex:1;min-width:0}
.urow .tx span{display:block;color:var(--muted);font-size:14px}
.urow .pct{font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.pbar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:10px;display:flex}
.pbar i{display:block;height:100%}
.pbar .m{background:var(--marker)}.pbar .s{background:color-mix(in srgb,var(--marker) 32%,var(--surface-2))}

/* unit hub sections */
.sec{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h .n{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:14px 16px;cursor:pointer;text-decoration:none;color:var(--ink)}
.li+.li{border-top:1px solid var(--line)}
a.li:hover,button.li:hover{background:var(--marker-soft)}
div.li{cursor:default}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600}
.li .tx span{display:block;color:var(--muted);font-size:14px}
.li .st{flex:none;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.li .st.full{color:var(--ok)}
.li .go{color:var(--muted)}

/* mode picker */
.modes{display:grid;gap:10px}
.mode{display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);border-radius:16px;padding:14px;cursor:pointer}
.mode.on{box-shadow:inset 0 0 0 2px var(--marker);background:var(--marker-soft)}
.mode b{display:block;font-weight:600}
.mode span{color:var(--muted);font-size:14px}
.dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);margin-top:3px}
.mode.on .dot{border:6px solid var(--marker)}

/* practice */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--marker);width:0;transition:width .25s}
.q{font:600 26px/1.25 var(--font-display);letter-spacing:-.015em;margin:6px 0 4px;word-break:break-word;text-wrap:balance}
.qsmall{font-size:22px}
.pron{color:var(--pron);font:500 15px/1.4 var(--font-mono);letter-spacing:.01em}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hintline{color:var(--muted);font-size:14px;margin-top:6px;min-height:20px;white-space:pre-wrap}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);border-radius:16px;padding:15px 16px;min-height:56px;cursor:pointer;font-size:17px;font-weight:500;transition:box-shadow .15s,background .15s}
.opt:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.opt.ok{background:var(--ok-bg);box-shadow:inset 0 0 0 2px var(--ok-strong);color:var(--ok);font-weight:600}
.opt.bad{background:var(--bad-bg);box-shadow:inset 0 0 0 2px var(--bad-strong);color:var(--bad)}
.opt:disabled{cursor:default}
input.spell,input.search,textarea{width:100%;font:inherit;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
input.spell{font-size:22px;margin-top:16px}
input.spell:focus,input.search:focus,textarea:focus{border-color:var(--marker);box-shadow:0 0 0 4px var(--hl)}
input.spell.ok{border-color:var(--ok)} input.spell.bad{border-color:var(--bad)}
.opts:empty{display:none}
input[data-lock]{caret-color:transparent}
/* telefonda yozish mashqi doim ixcham: klaviatura ochilib-yopilganda karta o'lchami o'zgarmaydi, so'z, maydon va «Tekshirish» klaviatura ustiga sig'adi */
@media (pointer:coarse){
  .wrap:has(.card input.spell){padding-top:8px}
  .wrap:has(.card input.spell) .top{margin-bottom:8px}
  .wrap:has(.card input.spell) .bar{margin-bottom:10px}
  .wrap:has(.card input.spell) .card{padding:14px 16px}
  .wrap:has(.card input.spell) .q{margin:2px 0}
  .wrap:has(.card input.spell) .tools{margin-top:8px}
  .wrap:has(.card input.spell) .hintline:empty{min-height:0;margin:0}
  .wrap:has(.card input.spell) input.spell{margin-top:10px}
  .wrap:has(.card input.spell) .card .row{margin-top:10px!important}
}
.fb{margin-top:14px;border-radius:16px;padding:14px 16px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb .icon{background:transparent;border-color:currentColor;color:inherit;padding:4px 9px}
.diff{font:600 21px/1.35 var(--font-display);letter-spacing:-.01em;margin:4px 0;color:var(--ink)}
.diff .x{background:var(--bad);color:var(--surface);border-radius:4px;padding:0 3px}
.ex{margin-top:12px;font-size:15px}
.ex small{display:block;color:var(--muted);font-style:italic}
.score{font:700 56px/1 var(--font-display);letter-spacing:-.035em;margin:10px 0;font-variant-numeric:tabular-nums}

/* word list */
.wl{list-style:none;margin:0;padding:0}
.wl li{padding:13px 0;border-top:1px solid var(--line)}
.wl li:first-child{border-top:0}
.wl .h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wl .w{font-weight:700;font-size:17px}
.wl .p{color:var(--pron);font:500 14px/1.4 var(--font-mono)}
.wl .u{margin-top:2px}
.wl .bk{font-size:13px;color:var(--muted)}
.wl .e{font-size:14px;margin-top:4px}
.wl .e small{display:block;color:var(--muted);font-style:italic}
.wl .say{margin-left:auto;padding:5px 9px}
.box{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--marker-soft);color:var(--accent-text);letter-spacing:.02em}
.box.m{background:var(--ok-bg);color:var(--ok)}
.legend{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}

/* patterns & speaking */
.rule{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.rule:first-child{border-top:0}
.rule b{font-weight:600;min-width:0}
.rule span{color:var(--muted);text-align:right;min-width:0}
blockquote{margin:10px 0;padding:12px 14px;border-left:3px solid var(--marker);background:var(--marker-soft);border-radius:0 14px 14px 0}
blockquote small{display:block;color:var(--muted);font-style:italic}
blockquote .icon{padding:3px 8px;vertical-align:middle}
.ans{margin-top:10px}
.ans p{margin:4px 0;font-size:16px}
.slot{background:var(--hl);border-radius:4px;padding:0 4px;font-weight:600}
.tip{font-size:14px;color:var(--accent-text);margin-top:8px}

/* gap tuzish */
.answer{display:flex;flex-wrap:wrap;gap:8px;min-height:72px;align-content:flex-start;align-items:center;background:var(--bg);border-radius:16px;padding:12px;margin:16px 0 14px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:0;box-shadow:inset 0 0 0 1.5px var(--line),0 2px 0 var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:9px 14px;font-size:17px;font-weight:500;cursor:pointer}
.tile:hover{box-shadow:inset 0 0 0 1.5px var(--line-strong),0 2px 0 var(--line-strong)}
.answer .tile{background:var(--marker-soft);color:var(--accent-text);box-shadow:none}
.tile.used{visibility:hidden}

/* ilovani o'rnatish kartasi */
.install{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.install img{width:44px;height:44px;border-radius:11px;flex:none}
.install .tx{flex:1;min-width:0}
.install .tx b{display:block;font-weight:600}
.install .tx span{display:block;color:var(--muted);font-size:14px}
.install .btn{width:auto;min-height:40px;padding:8px 14px;font-size:15px;flex:none}
.install .x{flex:none;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;font-size:20px;line-height:1}

nav.tabs{transition:opacity .22s ease, transform .32s cubic-bezier(.16,1,.3,1), visibility 0s}
.typing nav.tabs{opacity:0;transform:translateY(calc(100% + 16px));visibility:hidden;pointer-events:none;transition:none}

{
  id: "be", unit: 1, title: "am / is / are",
  lead: "O'zbekchada \"-man, -san, -dir\" qo'shimchasi bor. Inglizchada uning o'rnida alohida so'z turadi.",
  rules: [
    ["I am  (I'm)", "Men ...man"],
    ["You / We / They are  (you're)", "Sen/siz, biz, ular ..."],
    ["He / She / It is  (he's)", "U ..."],
    ["Inkor: I'm not · He isn't · They aren't", "...emas"],
    ["Savol: Are you ...?  Is he ...?", "...mi?  — so'z joyi almashadi"]
  ],
  examples: [["I'm a designer.", "Men dizaynerman."], ["She's from Samarkand.", "U Samarqanddan."], ["Are you tired?", "Charchadingizmi?"]],

    {q:"My brother ___ a doctor.", o:["am","is","are"], a:1, why:"Bitta odam (u) — is."},
    {q:"They ___ very friendly.", o:["is","are","am"], a:1, why:"Ular — are."},
    {q:"___ you busy today?", o:["Do","Are","Is"], a:1, why:"busy — holat (\"bandman\"), harakat emas. Holatda Are/Is."},
    {q:"He ___ tired. (emas)", o:["isn't","doesn't","aren't"], a:0, why:"tired — holat, shuning uchun is + not."},

},
{

  rules: [

},
{
  id: "neg", unit: 4, title: "Qilmayman: don't / doesn't",
  lead: "O'zbekchada \"-ma\" qo'shamiz. Inglizchada harakat so'zidan oldin don't yoki doesn't qo'yiladi.",
  rules: [

    ["He / She / It + doesn't + so'z", "She doesn't drink coffee.  ← -s yo'qoladi!"],
    ["Holat bo'lsa: I'm not / He isn't", "I'm not tired. (do emas)"]

  examples: [["I don't work on Sunday.", "Yakshanba ishlamayman."], ["He doesn't like fish.", "U baliqni yoqtirmaydi."]],

    {q:"She ___ work at the weekend.", o:["don't","doesn't","isn't"], a:1, why:"She — doesn't."},
    {q:"He doesn't ___ TV.", o:["watches","watch","watching"], a:1, why:"doesn't dan keyin -s qo'yilmaydi."},
    {q:"We ___ live in Samarkand.", o:["doesn't","don't","aren't"], a:1, why:"We — don't."},

{
  id: "q", unit: 4, title: "Savol: Do / Does ...?",
  lead: "O'zbekchada oxiriga \"-mi\" qo'shamiz. Inglizchada gap boshiga Do yoki Does qo'yiladi. \"-moq\" testi: so'zga -moq qo'shib bo'lsa (ishlamoq, ichmoq) — Do/Does. Holat bo'lsa (charchagan, band) — Are/Is.",
  rules: [
    ["Do + I/you/we/they + so'z ...?", "Do you work here?"],
    ["Does + he/she/it + so'z ...?", "Does she work here?  ← -s yo'qoladi"],
    ["Qisqa javob: Yes, I do. / No, I don't.", "Yes, she does. / No, she doesn't."],
    ["Holat: Are you ...? / Is he ...?", "Are you tired? — Yes, I am."]
  ],
  examples: [["Do you like plov?", "Oshni yaxshi ko'rasizmi?"], ["Does your brother live in Tashkent?", "Akangiz Toshkentda yashaydimi?"]],
  drill: [
    {q:"___ you drink coffee?", o:["Do","Does","Are"], a:0, why:"you — Do. drink — harakat (ichmoq)."},
    {q:"___ your brother live in Tashkent?", o:["Do","Does","Is"], a:1, why:"your brother = u → Does."},
    {q:"___ she tired?", o:["Does","Is","Do"], a:1, why:"tired — holat, -moq qo'shilmaydi → Is."},
    {q:"Does he ___ in a bank?", o:["works","work","working"], a:1, why:"Does bor bo'lsa, so'zga -s qo'shilmaydi."},
    {q:"Do you like football? — Yes, I ___.", o:["do","am","like"], a:0, why:"Do bilan so'radi → Yes, I do."},
    {q:"Does she drive? — No, she ___.", o:["don't","isn't","doesn't"], a:2, why:"Does → doesn't."},
    {q:"Have you got a car? — Yes, I ___.", o:["do","have","am"], a:1, why:"Have bilan so'radi → Yes, I have."}
  ]
},
{
  id: "freq", unit: 4, title: "Qancha tez-tez: always … never",
  lead: "Bu so'zlar harakat so'zidan OLDIN turadi, lekin am/is/are dan KEYIN.",
  rules: [
    ["always 100% · usually 85% · often 75% · sometimes 40% · never 0%", "doim · odatda · tez-tez · ba'zan · hech qachon"],
    ["I always drink tea.", "harakatdan oldin"],
    ["She is always late.", "is dan keyin  (always is emas!)"],
    ["How often ...? — Every day / at the weekend", "Qancha tez-tez?"]
  ],
  examples: [["I usually get up at 7.", "Odatda 7 da turaman."], ["He's never busy.", "U hech qachon band emas."]],
  drill: [
    {q:"Qaysi to'g'ri?", o:["I drink always tea.","I always drink tea.","Always I drink tea."], a:1, why:"always — harakat so'zidan (drink) oldin."},
    {q:"Qaysi to'g'ri?", o:["She always is late.","She is always late.","She late always is."], a:1, why:"is dan keyin: is always."},
    {q:"I ___ eat fish. (0% — hech qachon)", o:["always","never","often"], a:1, why:"0% — never."},
    {q:"We ___ go to Samarkand. (40% — ba'zan)", o:["sometimes","usually","always"], a:0, why:"40% — sometimes."},
    {q:"Qaysi to'g'ri?", o:["They are usually busy.","They usually are busy.","They busy usually are."], a:0, why:"are dan keyin: are usually."}
  ]
},
{

    {q:"___ you got a car?", o:["Do","Have","Are"], a:1, why:"have got savolida Have boshida."},

{
  id: "and", unit: 5, title: "and / but / because",
  lead: "Ikki gapni bog'lash: and = va, but = lekin, because = chunki. \"Why?\" savoliga because bilan javob beriladi.",
  rules: [
    ["I like tea and coffee.", "va — bir xil yo'nalish"],
    ["I like tea but I don't like coffee.", "lekin — qarama-qarshi"],
    ["I study English because it's useful.", "chunki — sabab"]
  ],
  examples: [["My favourite colour is black because it's smart.", "Sevimli rangim qora, chunki u ozoda ko'rinadi."]],
  drill: [
    {q:"I like jeans ___ T-shirts.", o:["and","but","because"], a:0, why:"Ikkalasi ham yoqadi — and."},
    {q:"He's tired ___ he works a lot.", o:["and","but","because"], a:2, why:"Charchaganining sababi — because."},
    {q:"I like Paris ___ it's very expensive.", o:["because","but","and"], a:1, why:"Yoqadi, lekin qimmat — but."},
    {q:"Why do you study English? — ___ it's important for my work.", o:["Because","But","And"], a:0, why:"Why? → Because."}
  ]
},

{

/* ---------- cloud sync: the viewer's own private record (db capability) ---------- */
const cloud = { ref: null, status: "local", timer: null, busy: false, dirty: false };
function pushSoon() { if (!cloud.ref) return; cloud.dirty = true; clearTimeout(cloud.timer); cloud.timer = setTimeout(push, 1500); }
async function push() {
  if (!cloud.ref || cloud.busy || !cloud.dirty) return;

  catch (e) {
    const c = e && e.code;

}
function merge(a, b) {
  const out = { srs: {}, pat: {}, streak: { last: "", n: 0 } };
  const as = a.srs || {}, bs = b.srs || {};
  new Set(Object.keys(as).concat(Object.keys(bs))).forEach(id => {
    const x = as[id], y = bs[id];
    out.srs[id] = !x ? y : !y ? x : ((y.ok + y.bad) > (x.ok + x.bad) ? y : x);
  });
  const ap = a.pat || {}, bp = b.pat || {};
  new Set(Object.keys(ap).concat(Object.keys(bp))).forEach(k => { out.pat[k] = Math.max(ap[k] || 0, bp[k] || 0); });
  const sa = a.streak || {}, sb = b.streak || {};
  out.streak = (sb.last || "") > (sa.last || "") ? sb : (sa.last ? sa : out.streak);
  out.course = Math.max(a.course || 0, b.course || 0);
  const ag = a.gr || {}, bg = b.gr || {}; out.gr = {};
  new Set(Object.keys(ag).concat(Object.keys(bg))).forEach(k => { const x = ag[k], y = bg[k]; out.gr[k] = !x ? y : !y ? x : (y.due > x.due ? y : x); });
  out.mis = Object.assign({}, a.mis || {}, b.mis || {});
  const al = a.log || {}, bl = b.log || {}; out.log = {};
  new Set(Object.keys(al).concat(Object.keys(bl))).forEach(k => { const x = al[k], y = bl[k]; out.log[k] = !x ? y : !y ? x : (y.a > x.a ? y : x); });
  return out;
}

function setStatus(st) { cloud.status = st; const el = document.getElementById("sync"); if (el) el.textContent = statusText(); }

    if (!window.claude || !window.claude.use) return;

}
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
// Leitner qutilari: 0 → yangi/xato, 5 → mustahkam. Intervallar (kun):

// So'z kamida bir marta xotiradan to'g'ri yozilmaguncha 2-qutidan yuqoriga chiqmaydi (r.sp — to'g'ri yozilganlar soni).

  if (ok) { r.b = Math.min(r.b + 1, 5); r.ok++; if (spelled) r.sp = (r.sp || 0) + 1; else if (w.a && !r.sp) r.b = Math.min(r.b, 2); } else { r.b = 0; r.bad++; }

try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}

/* ---------- router ---------- */

  const tab = h === "" ? "home" : /^(unit|soz|qolip|tuz|gapir)/.test(h) ? "unitlar" : h.startsWith("gap") ? "gap" : h.startsWith("lugat") ? "lugat" : "";

  moveLens(tab, lastTab === null); pageIn(tab); lastTab = tab;
  document.body.classList.toggle("quizmode", h.startsWith("quiz") || h === "gapmashq" || h === "tuzmashq");

/* tab bar linzasi va sahifa animatsiyasi */

  lens.style.opacity = "1"; lens.style.width = a.offsetWidth + "px"; lens.style.transform = "translateX(" + a.offsetLeft + "px)";

const UNIT_INFO = [null,
  ["First meetings", "Tanishuv"], ["Questions", "Savollar"], ["People and possessions", "Odamlar va narsalar"],
  ["My life", "Mening hayotim"], ["Style and design", "Uslub va dizayn"], ["Places and facilities", "Joylar va qulayliklar"],
  ["Skills and interests", "Ko'nikma va qiziqishlar"], ["Our past", "O'tmishimiz"], ["Unusual stories", "G'aroyib voqealar"],
  ["New places, new projects", "Yangi joylar, yangi rejalar"]];
const bookPages = n => (6 + (n - 1) * 10) + "–" + (15 + (n - 1) * 10);
const unitPats = n => PATTERNS.filter(p => p.unit === n);
const unitBuild = n => (BUILD.find(b => b.unit === n) || { items: [] }).items;
const patFrac = p => Math.min(1, (S.pat[p.id] || 0) / p.drill.length);
const buildBest = n => Math.max(S.pat["tuz-" + n] || 0, S.pat["tuzy-" + n] || 0);
function unitStat(n) {
  const ws = byUnit(n), seen = ws.filter(isSeen).length, mast = ws.filter(isMastered).length;
  const pats = unitPats(n), bl = unitBuild(n);
  const wP = ws.length ? (mast + (seen - mast) * .4) / ws.length : 0;
  const gP = pats.length ? pats.reduce((a, p) => a + patFrac(p), 0) / pats.length : 0;
  const bP = bl.length ? buildBest(n) / bl.length : 0;
  const started = seen > 0 || pats.some(p => S.pat[p.id] != null) || S.pat["tuz-" + n] != null || S.pat["tuzy-" + n] != null;
  return { words: ws.length, seen, mast, pct: Math.round((wP * .5 + gP * .3 + bP * .2) * 100), started };
}
function curUnit() {
  let n = 0;
  for (let k = 1; k <= 10; k++) if (unitStat(k).started) n = k;
  if (S.course && S.course >= n) return { n: S.course, fresh: false }; // kursda shu unitdaman
  if (!n) return { n: 1, fresh: true };
  if (unitStat(n).pct >= 85 && n < 10) n++;
  return { n, fresh: false };
}

const DAYKEY = "ingliz-day";

const MONTHS = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"];

  const due = dueWords().filter(w => !ids.has(w.id)), unseen = byUnit(n).filter(w => !isSeen(w));
  if (due.length) plan.push({ tag: "rev", t: "So'zlarni takrorlash", s: due.length + " ta so'z bugun qaytariladi", run: () => startQuiz(due, "auto", "Takrorlash", "#", "rev") });
  else if (unseen.length) plan.push({ tag: "rev", t: "Yangi so'zlar", s: "Unit " + n + " · " + Math.min(8, unseen.length) + " ta yangi so'z", run: () => startQuiz(unseen.slice(0, 8), "uz-en", "Unit " + n, "#", "rev") });
  else plan.push({ tag: "rev", t: "So'zlarni mustahkamlash", s: "Unit " + n + " · 10 ta so'z", run: () => startQuiz(shuffle(byUnit(n)).slice(0, 10), "auto", "Unit " + n, "#", "rev") });
  const pats = unitPats(n), p = pats.find(x => patFrac(x) < 1), rv = gramReview(n, p && p.id, p ? 3 : 6), plus = rv.length ? " · +" + rv.length + " ta takrorlash" : "";
  if (p) plan.push({ tag: "gram", t: "Grammatika: " + p.title, s: (S.pat[p.id] != null ? "Eng yaxshi natija: " + S.pat[p.id] + "/" + p.drill.length : "Qoida va " + p.drill.length + " ta mashq") + plus, min: rv.length ? 4 : 3, run: () => { GX = rv; go("qolip-" + p.id); } });
  else if (rv.length) plan.push({ tag: "gram", t: "Grammatika: takrorlash", s: rv.length + " ta savol, o'tilgan qoliplardan", run: () => { GX = rv; go("gtakror"); } });
  else if (pats[0]) plan.push({ tag: "gram", t: "Grammatika: " + pats[0].title, s: "Eng yaxshi natija: " + (S.pat[pats[0].id] || 0) + "/" + pats[0].drill.length, run: () => go("qolip-" + pats[0].id) });
  const bl = unitBuild(n);
  if (bl.length) {
    const mb = misBuild(true).filter(x => x.unit <= n).slice(0, 2), list = mb.concat(shuffle(bl).filter(x => !mb.includes(x))).slice(0, 5);
    plan.push({ tag: "tuz", t: "Gap tuzish", s: "Unit " + n + " · 5 ta gap" + (mb.length ? " · " + mb.length + " tasi eski xato" : " · " + (tuzMode === "yoz" ? "o'zim yozaman" : "so'zlardan yig'aman")), run: () => { startTuz(list, "Unit " + n, null, "tuz"); T.back = "#"; } });
  }

    const room = anchor.getBoundingClientRect().top - 8 - top;       // shuncha pastga surish mumkin
    const over = btn.getBoundingClientRect().bottom + 12 - (top + h);  // tugma ko'rinishi uchun shuncha surish kerak
    const dy = over > room ? room : over > 0 ? over : room < 0 ? room : 0;

function gradeReview(res) {
  const by = {}; res.forEach(r => { by[r.it.pid] = (by[r.it.pid] !== false) && r.ok; });

/* qolip savollari: 3 ta variantdan tanlash; xato «Xatolarim»ga tushadi, to'g'ri javob uni o'chiradi */
function runDrill(box, items, done, own) {
  let i = 0; const res = [];
  const draw = () => {
    if (i >= items.length) return done(res);
    const it = items[i], other = it.pid !== own;
    box.innerHTML = `<p class="label">${other ? "Takrorlash · Unit " + it.unit + ": " + esc(it.title) : "Mashq"} · ${i + 1} / ${items.length}</p><div class="q qsmall">${esc(it.q)}</div><div class="opts">${it.o.map((o, k) => `<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div><div class="fb hidden" id="pf"></div><div class="row" style="margin-top:14px"><button class="btn hidden" id="pn">Keyingisi →</button></div>`;
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === it.a, key = "g:" + it.pid + "#" + it.k;
      res.push({ it, ok }); if (ok) misDel(key); else misAdd(key); logAns(ok); save();
      box.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.k === it.a) x.classList.add("ok"); });
      if (!ok) b.classList.add("bad");
      const full = it.q.includes("___") ? it.q.replace("___", it.o[it.a]).replace(/\s*\(.*?\)\s*$/, "") : it.o[it.a];
      $("#pf").className = "fb " + (ok ? "ok" : "bad"); $("#pf").innerHTML = (ok ? "To'g'ri! " : "") + esc(it.why) + `<div style="margin-top:6px"><b>${esc(full)}</b></div>`;
      $("#pn").classList.remove("hidden"); $("#pn").focus(); say(full);
    });
    $("#pn").onclick = () => { i++; draw(); };
  };
  draw();
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const toks = s => norm(s).replace(/[^a-z0-9' ]/g, " ").split(" ").filter(Boolean);
function listen(target, out, btn) {
  if (!SR) { out.className = "fb bad"; out.textContent = "Bu brauzerda mikrofon bilan tekshirish ishlamaydi. Chrome yoki Safari'da ochib ko'ring."; return; }
  let r; try { r = new SR(); } catch (e) { out.className = "fb bad"; out.textContent = "Mikrofonni ishga tushirib bo'lmadi."; return; }
  r.lang = "en-US"; r.interimResults = false; r.maxAlternatives = 3;
  const label = btn.innerHTML; btn.disabled = true; btn.textContent = "Tinglayapman…";
  out.className = "fb"; out.textContent = "Gapni ovoz chiqarib ayting…";
  const want = toks(target);
  r.onresult = e => {
    const alts = [...e.results[0]].map(a => a.transcript);
    const score = h => { const got = new Set(toks(h)); return want.filter(w => got.has(w)).length; };
    const heard = alts.reduce((b, h) => score(h) > score(b) ? h : b, alts[0] || "");
    const got = new Set(toks(heard)), pct = want.length ? Math.round(score(heard) / want.length * 100) : 0;
    const words = target.split(/\s+/).map(w => { const k = toks(w)[0]; return !k || got.has(k) ? esc(w) : '<span class="x">' + esc(w) + "</span>"; }).join(" ");
    out.className = "fb " + (pct >= 80 ? "ok" : "bad");
    out.innerHTML = (pct >= 90 ? "Zo'r! Aniq tushunildi." : pct >= 60 ? "Yaxshi. Qizil so'zlarni yana bir bor ayting." : "Yana urinib ko'ring: sekinroq va aniqroq ayting.") +
      `<div class="diff" style="font-size:18px">${words}</div><span>Eshitildi: “${esc(heard)}”</span>`;
  };
  r.onerror = e => {
    out.className = "fb bad";
    out.textContent = e.error === "not-allowed" || e.error === "service-not-allowed" ? "Mikrofonga ruxsat berilmadi. Brauzer sozlamalarida mikrofonga ruxsat bering." : e.error === "no-speech" ? "Ovoz eshitilmadi. Qaytadan urinib ko'ring." : "Tekshirib bo'lmadi (" + e.error + "). Qaytadan urinib ko'ring.";
  };
  r.onend = () => { btn.disabled = false; btn.innerHTML = label; };
  try { r.start(); } catch (e) { btn.disabled = false; btn.innerHTML = label; }
}

const words = s => String(s).split(/\s+/).map(w => w.replace(/[.,?!]/g, "")).filter(Boolean);
const BLD = [];
BUILD.forEach(b => b.items.forEach(it => BLD.push(Object.assign({ unit: b.unit }, it))));
// Yozish rejimi: qisqartmalar ochiladi (I'm = I am), tinish belgilari va katta-kichik harf hisobga olinmaydi.
const CONTR = [[/\b(do|does|did|is|are|was|were|have|has|could|would)nt\b/g, "$1n't"], [/\bcant\b/g, "can't"], [/\bwont\b/g, "won't"], [/\bim\b/g, "i'm"],
  [/\b(he|she|it|what|where|that|there|who)'s got\b/g, "$1 has got"], [/\b(i|you|we|they)'ve\b/g, "$1 have"],
  [/\bi'm\b/g, "i am"], [/\b(you|we|they)'re\b/g, "$1 are"], [/\b(he|she|it|what|where|that|there|who)'s\b/g, "$1 is"],
  [/\bcan't\b|\bcannot\b/g, "can not"], [/\bwon't\b/g, "will not"], [/\b(\w+)n't\b/g, "$1 not"],
  [/\b(i|you|he|she|we|they)'d\b/g, "$1 would"], [/\b(i|you|he|she|we|they)'ll\b/g, "$1 will"]];
const canon = s => { let t = norm(s).replace(/[.,?!"]/g, " "); CONTR.forEach(([re, to]) => { t = t.replace(re, to); }); return t.replace(/\s+/g, " ").trim().split(" ").filter(Boolean); };
function lev(a, b) { const d = [...Array(a.length + 1)].map((_, i) => [i]); for (let j = 1; j <= b.length; j++) d[0][j] = j; for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[a.length][b.length]; }
function wordDiff(got, want) {
  const n = got.length, m = want.length, L = [...Array(n + 1)].map(() => Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = got[i] === want[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const okW = new Set(), okG = new Set(); let i = 0, j = 0;
  while (i < n && j < m) { if (got[i] === want[j]) { okG.add(i); okW.add(j); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
  return { want: want.map((w, k) => okW.has(k) ? esc(w) : '<span class="x">' + esc(w) + "</span>").join(" "), extra: got.filter((_, k) => !okG.has(k)) };
}
let tuzMode = "tile";
try { tuzMode = localStorage.getItem("ingliz-tuzmode") || "tile"; } catch (e) {}
route(/^tuz$/, () => {
  const kp = tuzMode === "yoz" ? "tuzy-" : "tuz-";
  app.innerHTML = `<a class="back" href="#unitlar">${ICON.back} Unitlar</a><h1>Gap tuzish</h1><p class="sub">O'zbekcha gapni inglizchaga aylantiring · ${BLD.length} ta gap</p>
  <div class="stack">
    <div class="card"><p class="label">Mashq turi</p><div class="modes">
      ${modeBtn("tile", "So'zlardan yig'aman", "So'zlarni to'g'ri tartibda bosasiz. Orasida tuzoq so'zlar ham bor (am, do).")}
      ${modeBtn("yoz", "O'zim yozaman", "Gapni o'zingiz to'liq yozasiz. I'm va I am — ikkalasi ham to'g'ri.")}
    </div></div>
    <button class="btn" id="mix">Aralash: hamma unitlardan 10 ta gap</button>
    <div class="units">${BUILD.map(b => { const best = S.pat[kp + b.unit]; return `<button class="unit" data-tu="${b.unit}"><div class="t"><b>Unit ${b.unit}</b><span class="n">${b.items.length} gap${best != null ? " · eng yaxshi: " + best + "/" + b.items.length : ""}</span></div><div class="muted" style="margin-top:2px">${esc(b.items[0].u)} · ${esc(b.items[1].u)} …</div></button>`; }).join("")}</div>
  </div>`;
  document.querySelectorAll(".mode").forEach(b => { b.classList.toggle("on", b.dataset.m === tuzMode); b.onclick = () => { tuzMode = b.dataset.m; try { localStorage.setItem("ingliz-tuzmode", tuzMode); } catch (e) {} render(); }; });
  $("#mix").onclick = () => startTuz(shuffle(BLD).slice(0, 10), "Aralash", null);
  document.querySelectorAll("[data-tu]").forEach(b => b.onclick = () => { const n = +b.dataset.tu; startTuz(BLD.filter(x => x.unit === n), "Unit " + n, kp + n); });
});
let T = null;
function startTuz(list, title, key, tag) {
  if (!list.length) return;
  T = { q: shuffle(list), i: 0, right: 0, total: list.length, wrong: [], again: new Set(), title, key, tag, mode: tuzMode, back: location.hash || "#tuz" };
  if (location.hash === "#tuzmashq") render(); else go("tuzmashq");
}
function tuzResult(it, ok) { if (!T.again.has(it)) { logAns(ok); if (ok) { T.right++; misDel("b:" + it.e); } else { T.wrong.push(it); T.again.add(it); T.q.push(it); misAdd("b:" + it.e); } save(); } }
function tuzNext() { T.i++; if (T.i < T.q.length) render(); else tuzFinish(); }
route(/^tuzmashq$/, () => {
  if (!T) return go("tuz");
  const it = T.q[T.i], yoz = T.mode === "yoz";
  app.innerHTML = `<div class="top"><button class="icon" id="quit">${ICON.back} Chiqish</button><span>${T.i + 1} / ${T.q.length}</span><span>✓ ${T.right}</span></div>
  <div class="bar"><i style="width:${T.i / T.q.length * 100}%"></i></div>
  <div class="card"><p class="label">${esc(T.title)} · ${yoz ? "inglizcha yozing" : "inglizcha gap tuzing"}</p><div class="q qsmall">${esc(it.u)}</div>
    ${yoz ? `<input class="spell" id="tin" style="font-size:19px" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Inglizcha yozing…">
      <div class="tools"><button class="icon" id="th1">1-so'z</button><button class="icon" id="th2">So'zlar</button></div><div class="hintline" id="thint"></div>`
    : `<div class="answer" id="ans"></div><div class="tiles" id="bank"></div>`}
    <div class="fb hidden" id="tf"></div>
    <div class="row" style="margin-top:14px">${yoz ? "" : `<button class="btn ghost" id="clr">Tozalash</button>`}<button class="btn" id="chk" disabled>Tekshirish</button></div>
  </div>`;
  $("#quit").onclick = () => { const b = T.back; T = null; location.hash = b; };
  let done = false;
  const show = (cls, html) => {
    $("#tf").className = "fb " + cls;
    $("#tf").innerHTML = html + ` <button class="icon" data-say="${esc(it.e)}" style="padding:4px 8px">${ICON.vol}</button><div style="margin-top:6px">${esc(it.h)}</div>`;
    bindSay($("#tf")); say(it.e);
    const c = $("#clr"); if (c) c.classList.add("hidden");
    $("#chk").disabled = false; $("#chk").textContent = T.i + 1 < T.q.length ? "Keyingisi →" : "Natijani ko'rish"; if (document.activeElement !== $("#tin")) $("#chk").focus();
  };
  if (yoz) {
    const inp = $("#tin"), want = canon(it.e);
    inp.focus(); // darhol: oldingi gapdan qolgan klaviatura yopilmasdan yangi maydonga o'tadi
    inp.oninput = () => { if (!done) $("#chk").disabled = !inp.value.trim(); };
    $("#th1").onclick = () => { $("#thint").textContent = "1-so'z: " + words(it.e)[0]; };
    $("#th2").onclick = () => { $("#thint").textContent = words(it.e).length + " ta so'z: " + words(it.e).map(w => w[0] + "…").join(" "); };
    const check = () => {
      if (done) return tuzNext();
      if (!inp.value.trim()) return;
      done = true; inp.dataset.lock = inp.value;
      const got = canon(inp.value), exact = got.join(" ") === want.join(" ");
      const close = !exact && got.length === want.length && lev(got.join(" "), want.join(" ")) === 1 && want.join(" ").length > 8;
      const ok = exact || close; tuzResult(it, ok);
      inp.className = "spell " + (ok ? "ok" : "bad"); inp.style.fontSize = "19px";
      if (exact) show("ok", `To'g'ri! <b>${esc(it.e)}</b>`);
      else if (close) { const d = wordDiff(got, want); show("ok", `To'g'ri, faqat bitta harf xato: <div class="diff" style="font-size:18px">${d.want}</div>`); }
      else { const d = wordDiff(got, want); show("bad", `To'g'risi: <b>${esc(it.e)}</b>${d.want.includes('class="x"') ? `<div style="margin-top:8px">Qizil — xato yozilgan yoki tushib qolgan so'zlar:</div><div class="diff" style="font-size:18px">${d.want}</div>` : ""}${d.extra.length ? `<div>Ortiqcha: <s>${esc(d.extra.join(" "))}</s></div>` : ""}`); }
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check(); } });
    $("#chk").onclick = check;
    return;
  }
  const want = words(it.e), have = new Set(want.map(w => w.toLowerCase()));
  const tiles = shuffle(want.concat((it.x || []).filter(x => !have.has(x.toLowerCase()))));
  const picked = [];
  const draw = () => {
    $("#ans").innerHTML = picked.length ? picked.map((k, j) => `<button class="tile" data-j="${j}">${esc(tiles[k])}</button>`).join("") : `<span class="muted">So'zlarni bosing…</span>`;
    $("#bank").innerHTML = tiles.map((t, k) => `<button class="tile ${picked.includes(k) ? "used" : ""}" data-k="${k}">${esc(t)}</button>`).join("");
    $("#ans").querySelectorAll("[data-j]").forEach(b => b.onclick = () => { if (done) return; picked.splice(+b.dataset.j, 1); draw(); });
    $("#bank").querySelectorAll("[data-k]").forEach(b => b.onclick = () => { if (done || picked.includes(+b.dataset.k)) return; picked.push(+b.dataset.k); say(tiles[+b.dataset.k]); draw(); });
    if (!done) $("#chk").disabled = !picked.length;
  };
  $("#clr").onclick = () => { if (done) return; picked.length = 0; draw(); };
  $("#chk").onclick = () => {
    if (done) return tuzNext();
    done = true;
    const ok = picked.map(k => tiles[k].toLowerCase()).join(" ") === want.join(" ").toLowerCase();
    tuzResult(it, ok);
    show(ok ? "ok" : "bad", (ok ? "To'g'ri! " : "To'g'risi: ") + `<b>${esc(it.e)}</b>`);
  };
  draw();
});
function tuzFinish() {
  if (T.tag) markDone(T.tag);
  const { right, total, wrong, title, key, back, tag } = T; T = null;
  if (key) { S.pat[key] = Math.max(S.pat[key] || 0, right); save(); }
  app.innerHTML = `<div class="stack"><div class="card" style="text-align:center"><p class="label">${esc(title)} · natija</p><div class="score">${right} / ${total}</div>
    <p class="muted">${wrong.length ? "Xato gaplarni yana bir marta tuzib ko'ring." : "Zo'r! Hamma gap birinchi urinishda to'g'ri."}</p></div>
    ${wrong.length ? `<div class="card"><p class="label">Xato qilingan gaplar</p><ul class="wl">${wrong.map(it => `<li><div class="h"><span class="w">${esc(it.e)}</span><button class="icon say" data-say="${esc(it.e)}">${ICON.vol}</button></div><div class="u">${esc(it.u)}</div><div class="e"><small>${esc(it.h)}</small></div></li>`).join("")}</ul></div>` : ""}
    <div class="card">${lessonBtn(tag)}${wrong.length ? `<button class="btn${LES && tag ? " ghost" : ""}" id="again">Xatolarni qayta tuzish</button><div style="height:10px"></div>` : ""}<button class="btn ghost" id="back">${backLabel(tag)}</button></div></div>`;
  bindSay(app); bindLesson();
  const a = $("#again"); if (a) a.onclick = () => { startTuz(wrong, title, null); T.back = back; };
  $("#back").onclick = () => { location.hash = back; };
}

/* ---------- SOZLAMA: export / import ---------- */
route(/^sozlama$/, () => {
  app.innerHTML = `<a class="back" href="#">${ICON.back} Bugun</a><h1>Natijani ko'chirish</h1>
  <p class="sub">Odatda natijalar hisobingizda o'zi saqlanadi. Bu sahifa zaxira uchun: kodni nusxalab qo'ying yoki boshqa joyga "Yuklash" orqali o'tkazing.</p>
  <div class="stack">${installCard(true)}<div class="card"><p class="label">Mening kodim</p><textarea id="ex" rows="4" readonly>${esc(btoa(unescape(encodeURIComponent(JSON.stringify(S)))))}</textarea>
  <div style="height:10px"></div><button class="btn" id="cp">Nusxalash</button></div>
  <div class="card"><p class="label">Boshqa qurilmadan yuklash</p><textarea id="im" rows="4" placeholder="Kodni shu yerga qo'ying"></textarea><div style="height:10px"></div><button class="btn ghost" id="ld">Yuklash</button><p class="muted" id="msg"></p></div></div>`;
  bindInstall();
  $("#cp").onclick = () => { const t = $("#ex"); t.select(); try { navigator.clipboard.writeText(t.value); } catch (e) { try { document.execCommand("copy"); } catch (e2) {} } $("#cp").textContent = "Nusxalandi ✓"; };
  $("#ld").onclick = () => { try { const d = JSON.parse(decodeURIComponent(escape(atob($("#im").value.trim())))); if (!d.srs) throw 0; S = Object.assign({ srs: {}, pat: {}, streak: { last: "", n: 0 }, gr: {}, mis: {}, log: {} }, d); save(); $("#msg").textContent = "Yuklandi ✓"; } catch (e) { $("#msg").textContent = "Kod noto'g'ri. Qaytadan nusxalab ko'ring."; } };
});

render();
initCloud();
})();
</script>

</body></html>
