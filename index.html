/* Weekly goal card */
.mq{border-radius:28px;padding:18px;background:radial-gradient(120% 90% at 100% 0%,var(--hl) 0%,transparent 60%),var(--card,var(--surface));box-shadow:var(--card-sm)}

.mq h2{font-size:20px;margin:0 0 6px}
.mq-why{margin:0;font-size:14px;color:var(--muted);line-height:1.4}
/* Weekly goal progress steps */
.mqa-steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0;padding:0}
.mqa-steps li{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:10px;border-radius:14px;background:var(--surface-2);min-width:0}
.mqa-steps .dot{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--card,var(--surface));box-shadow:inset 0 0 0 2px var(--line-strong);position:relative;z-index:1}
.mqa-steps .dot svg{width:11px;height:11px}
.mqa-steps .done .dot{background:var(--ok);box-shadow:none;color:var(--bg)}
.mqa-steps .now .dot{box-shadow:inset 0 0 0 2px var(--marker),0 0 0 4px color-mix(in srgb,var(--marker) 22%,transparent)}
.mqa-steps .now .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--marker)}
.mqa-steps .tx{min-width:0}
.mqa-steps .tx b{display:block;font-size:13px;font-weight:600;color:var(--ink);line-height:1.3}
.mqa-steps .tx>span{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.mqa-steps .done .tx>span{color:var(--ok)}.mqa-steps .now .tx>span{color:var(--accent-text)}
.mqa-steps .tx>.pips{display:flex;gap:3px;margin-top:7px}.mqa-steps .pips i{width:10px;height:4px;border-radius:2px;background:var(--line-strong)}.mqa-steps .pips i.on{background:var(--marker)}
.mqa-top{display:flex;align-items:center;gap:8px;margin:0 0 4px}.mqa-top .mq-t{margin:0}
.mqa-top .sep{color:var(--muted);font-size:13px}
.mqa-top .mq-ch{margin:-8px 0;min-height:44px;padding:0 4px;font-size:13px}
.mqa-act{display:flex;flex-direction:column;align-items:stretch}
.mq-says{display:block}
@media (min-width:980px){

  .wrap.home .mqa-steps .tx b{font-size:14px}.wrap.home .mqa-steps .tx>span{font-size:13px}

  .wrap.home .mqa-steps .pips i{width:14px}
  .wrap.home .mqa-act{align-items:center;gap:6px;min-width:236px}
  .wrap.home .mqa .btn.mq-go{width:auto;padding:0 26px;white-space:nowrap}
  .wrap.home .mqa .mq-hint{margin:0;font-size:12px}

.mq-opt .tx{flex:1;font-size:15px;line-height:1.3}.mq-opt small{display:block;color:var(--muted);font-size:12px}
.mq-pick .btn{width:100%;margin-top:10px}

.mq-res.ok{background:var(--ok-bg);color:var(--ok)}.mq-res.part{background:var(--hl);color:var(--accent-text)}.mq-res.no{background:var(--surface-2);color:var(--ink)}

.mq-nt{margin:2px 0;font-size:16px;font-weight:600}
.mq-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mq-row .btn{width:100%}
.mq-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:6px 0 8px}.mq-top .mq-t{margin:0}
.mq-cnt{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
