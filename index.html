const normSay = s => norm(s).replace(/[-.,!?']/g, " ").replace(/^(a|an|the|to) /, "").replace(/\s+/g, " ").trim();
function hearWord(onres, onerr, onact) {
  let got = false;
  try {
    const r = new SR(); r.lang = "en-US"; r.interimResults = true; r.maxAlternatives = 5;
    const act = v => { if (onact) onact(v); };
    r.onsoundstart = () => act(.5); r.onspeechstart = () => act(.8); r.onspeechend = () => act(0);
    r.onresult = e => { const res = e.results[e.results.length - 1]; act(1); if (res.isFinal && !got) { got = true; onres([...res].map(a => a.transcript)); } };
    r.onerror = e => { got = true; onerr(e.error); };

}
/* Telegram uslubidagi ovoz to'lqini: mikrofon atrofida ikki qatlam «suyuq» shakl; gapirganda o'sadi, jimlikda tinchlanadi */
const blobPath = (R, amp, t, seed) => { let d = ""; for (let i = 0; i <= 64; i++) { const a = i / 64 * Math.PI * 2, r = R * (1 + amp * (Math.sin(3 * a + t * 1.3 + seed) * .5 + Math.sin(5 * a - t * 1.7 + seed * 2) * .3 + Math.sin(2 * a + t * .9) * .2)); d += (i ? "L" : "M") + (Math.cos(a) * r).toFixed(1) + " " + (Math.sin(a) * r).toFixed(1); } return d + "Z"; };
let micAnim = null;
function micWave(stage) {
  const b1 = stage.querySelector(".b1"), b2 = stage.querySelector(".b2"), bar = $("#micq");
  let lvl = 0, target = 0, t0 = performance.now(), last = t0, heardAt = 0, quiet = 0, stopped = false;
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  stage.classList.add("live");
  const api = {
    act(v) { target = Math.max(target, v); if (v > 0) { heardAt = performance.now(); quiet = 0; } },
    stop() { stopped = true; stage.classList.remove("live"); if (bar) bar.style.width = "0%"; }
  };
  const frame = now => {
    if (stopped || !stage.isConnected) return;
    const dt = now - last; last = now; target *= Math.pow(.2, dt / 1000); lvl += (target - lvl) * Math.min(1, dt / 90);
    const t = (now - t0) / 1000;
    if (!calm) { b1.setAttribute("d", blobPath(52 + lvl * 30, .05 + lvl * .14, t, 0)); b2.setAttribute("d", blobPath(46 + lvl * 18, .04 + lvl * .1, t * 1.4, 2)); }
    // gapirib bo'lingach 1,2 s jimlik — o'zi to'xtaydi va tekshiradi
    if (heardAt) { quiet = now - heardAt; if (bar) bar.style.width = Math.min(100, quiet / 1200 * 100) + "%"; if (quiet > 1200 && srObj) { srObj.stop(); heardAt = 0; } }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  return api;
}
function askSay(w) {

    <p class="micst" id="micst" role="status">Bosing va inglizcha ayting</p><span class="micq" aria-hidden="true"><i id="micq"></i></span>
    <button class="btn ghost totype" id="totype">Yozib javob berish</button></div>`;

    const q = tlQuiz(L, i), ok = opt != null && (q.kind === "dict" ? tlSame(opt, q.ans) : opt === q.ans);
    picked = opt; phase = "res"; uzOpen = false;
    if (mode === "hard") { if (ok) arr[i] = "1"; }
    else if (arr[i] !== "1" && arr[i] !== "0") arr[i] = ok ? "1" : "0";
    saveR(); logAns(ok); touchStreak(); save(); buzz(ok);
    if (++answered >= 10) markDone("tl");
    draw();
  };
  const nextSentence = () => {
    halt(); picked = null; uzOpen = false; aiBox.innerHTML = "";
    if (mode === "hard") { k++; if (k >= seq.length) return finish(); i = seq[k]; phase = "idle"; return draw(); }
    if (i >= N - 1) { const sc = score(); tlSave(L.n, { i: N - 1, done: true, pct: sc.pct }); markDone("tl"); return finish(); }
    if (SC.length > 1 && i + 1 === scEnd(scOf(i))) {
      const x = scOf(i), part = arr.slice(SC[x][0], i + 1), q = part.filter(c => c === "1" || c === "0").length, ok = part.filter(c => c === "1").length;
      toast(`Sahna ${x + 1} / ${SC.length} tugadi`, null, null, { sub: q ? `${q} ta savoldan ${ok} tasi to'g'ri` : "Keyingi sahnaga o'tamiz" });
      i++; phase = "idle"; tlSave(L.n, { i }); return draw();
    }
    i++; phase = "idle"; tlSave(L.n, { i }); draw(); playCur(true);
  };

  /* ---- chizish ---- */
  function segs() {
    const list = mode === "hard" ? seq : L.s.map((_, j) => j);
    segEl.innerHTML = list.map(j => { const c = arr[j]; return `<i class="${mode === "main" && j && SC.some(x => x[0] === j) ? "s0 " : ""}${j === i && mode !== "watch" && (phase === "idle" || phase === "ask") ? "cur" : c === "1" ? "ok" : c === "0" ? "no" : c === "-" ? "seen" : ""}"></i>`; }).join("");
    segEl.classList.toggle("hidden", mode === "watch" || phase === "fin");
  }
  function draw() {
    segs();
    cov.classList.toggle("hidden", !(mode === "watch" || phase === "idle" || (phase === "ask" && !picked)));
    if (phase === "fin") return;
    const s = L.s[i], q = tlQuiz(L, i), pos = mode === "hard" ? `Qiyin gap ${k + 1} / ${seq.length}` : `Gap ${i + 1} / ${N}`;
    if (mode === "watch") {
      body.innerHTML = `<div class="card tl-listen"><div class="tl-wave${playing ? " on" : ""}" aria-hidden="true">${"<i></i>".repeat(9)}</div><b>Butun sahna · matnsiz</b><span class="muted">${mmss(L.s[N - 1][1] - L.s[0][0])} · ${N} gap, to'xtovsiz</span></div>`;
      acts.innerHTML = `<div class="tl-acts"><button class="tl-act tl-sq" id="tlback" aria-label="Natijaga qaytish">${ICON.x}</button><button class="tl-act tl-main" id="tlmain">${playing ? ICON_PAUSE + "<span>Pauza</span>" : ICON_PLAY + `<span>${v.currentTime > L.s[0][0] + 1 ? "Davom ettirish" : "Boshlash"}</span>`}</button></div>`;
      $("#tlmain").onclick = () => playing ? pause() : v.currentTime > L.s[0][0] + 1 && v.currentTime < L.s[N - 1][1] - 0.5 ? (endAt = L.s[N - 1][1], onEnd = () => { mode = "main"; finish(); }, resume()) : run(L.s[0][0], L.s[N - 1][1], () => { mode = "main"; finish(); });
      $("#tlback").onclick = () => { halt(); mode = "main"; finish(); };
      return;
    }
    if (phase === "idle") {
      const x = scOf(i), intro = mode === "main" && !playing && !seenSc.has(x) && SC[x][1] ? `<div class="tl-scene"><p class="label">${SC.length > 1 ? `Sahna ${x + 1} / ${SC.length}` : "Dars haqida"}</p><p>${esc(SC[x][1])}</p></div>` : "";
      body.innerHTML = `${intro}<div class="card tl-listen"><div class="tl-meta"><p class="tl-pos">${pos}</p>${tlWho(s[4])}</div><div class="tl-wave${playing ? " on" : ""}" aria-hidden="true">${"<i></i>".repeat(9)}</div><b>${playing ? "Eshitilmoqda…" : "Avval quloq bilan"}</b><span class="muted">${q ? "Keyin bitta savol bo'ladi" : "Matn eshitgandan keyin ochiladi"}</span></div>`;
      acts.innerHTML = `<div class="tl-acts">${playing ? `<button class="tl-act tl-sq" id="tlre" aria-label="Boshidan eshitish">${ICON_RE}</button>` : ""}<button class="tl-act tl-main" id="tlmain">${playing ? ICON_PAUSE + "<span>Pauza</span>" : ICON_PLAY + `<span>${v.currentTime > s[0] + 0.3 && v.currentTime < s[1] - 0.1 ? "Davom ettirish" : "Eshitish"}</span>`}</button></div><div class="tl-tools">${spdChip()}</div>`;
      $("#tlmain").onclick = () => playing ? pause() : v.currentTime > s[0] + 0.3 && v.currentTime < s[1] - 0.1 && endAt === s[1] ? (onEnd = () => { phase = q ? "ask" : "shown"; if (phase === "shown" && arr[i] === " ") { arr[i] = "-"; saveR(); } draw(); }, resume()) : playCur(true);
      const re = $("#tlre"); if (re) re.onclick = () => playCur(true);
    } else if (phase === "ask") {
      const len = q.word.length;
      const qh = q.kind === "dict"
        ? `<p class="q-label">Eshitgan so'zni yozing</p><p class="tl-cl" lang="en">${q.toks.map((t, j) => j === q.k ? `${esc(q.pre)}<input class="tl-in" id="tlin" type="text" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" maxlength="${len + 4}" style="width:${len + 2}ch" placeholder="${"•".repeat(len)}" aria-label="Tushib qolgan so'z, ${len} harf">${esc(q.post)}` : esc(t)).join(" ")}</p><p class="muted tl-dh" id="tldh">${len} ta harf</p>`
        : q.kind === "cloze"
        ? `<p class="q-label">Eshitgan so'zni qo'ying</p><p class="tl-cl" lang="en">${q.toks.map((t, j) => j === q.k ? `${esc(q.pre)}<span class="tl-blank"></span>${esc(q.post)}` : esc(t)).join(" ")}</p><div class="tl-bank">${q.opts.map(o => `<button class="tl-opt" data-o="${esc(o)}" lang="en">${esc(o)}</button>`).join("")}</div>`
        : `<p class="q-label">Qaysi gapni eshitdingiz?</p><div class="tl-picks">${q.opts.map(o => `<button class="tl-opt tl-pick" data-o="${esc(o)}" lang="en">${esc(o)}</button>`).join("")}</div>`;
      body.innerHTML = `<div class="tl-ask"><div class="tl-meta"><p class="tl-pos">${pos}</p>${tlWho(s[4])}</div>${qh}</div>`;
      acts.innerHTML = `${q.kind === "dict" ? `<div class="tl-acts"><button class="tl-act tl-main" id="tlchk" disabled><span>Tekshirish</span></button></div>` : ""}<div class="tl-tools">${repChip()}${spdChip()}${q.kind === "dict" ? `<button class="tl-chip" id="tlhint">Birinchi harf</button>` : ""}<button class="tl-chip" id="tlidk">Bilmayman</button></div>`;
      body.querySelectorAll(".tl-opt").forEach(b => b.onclick = () => { if (!playing) answer(b.dataset.o); else { halt(); answer(b.dataset.o); } });
      const inp = $("#tlin");
      if (inp) {
        const chk = $("#tlchk"), go_ = () => { if (!inp.value.trim()) return; halt(); answer(inp.value.trim()); };
        inp.oninput = () => { chk.disabled = !inp.value.trim(); };
        inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); go_(); } };
        chk.onclick = go_;
        $("#tlhint").onclick = e => { const w = q.word; if (!tlNorm(inp.value).startsWith(tlNorm(w[0]))) inp.value = w[0]; $("#tldh").textContent = `${w.length} ta harf · «${w[0]}» bilan boshlanadi`; e.currentTarget.disabled = true; chk.disabled = false; inp.focus(); };
        if (!playing) inp.focus({ preventScroll: true });
      }
      $("#tlidk").onclick = () => { halt(); answer(null); };
    } else {
      // res / shown: matn ochiq
      const ok = phase === "res" && picked != null && (q.kind === "dict" ? tlSame(picked, q.ans) : picked === q.ans), hl = q ? q.k : -1;
      const info = q ? tlLookup(q.word) : null;
      const addOk = info && info.u && !info.book && !info.inPlan && !info.mine && !(tlSt(L.n).w || []).includes(info.w);
      body.innerHTML = `<div class="card tl-card"><div class="tl-meta"><p class="tl-pos">${pos}</p>${tlWho(s[4])}</div><p class="tl-en" id="tlen" lang="en">${enHTML(s[2], phase === "res" ? hl : -1)}</p>
        ${s[3] ? (uzOpen ? `<p class="tl-uz">${esc(s[3])}</p>` : `<button class="tl-uzb" id="tluzb">${ICON_SHOW}<span>Tarjimani ko'rish</span></button>`) : ""}</div>
        ${phase === "res" ? `<div class="tl-res ${ok ? "ok" : "bad"}" role="status"><p class="tl-rh">${ok ? ICON.check + "To'g'ri!" : picked == null ? "Mana to'g'risi" : "Bu safar emas"}</p>
          <p class="tl-rt"><b lang="en">${esc(q.word)}</b>${info && info.u ? " — " + esc(info.u) : ""}${!ok && q.kind === "pick" && picked ? `<br><span class="muted">Siz tanlagan: <s lang="en">${esc(picked)}</s></span>` : ""}${q.kind === "dict" && picked && tlNorm(picked) !== tlNorm(q.word) ? `<br><span class="muted">Siz yozgan: <s lang="en">${esc(picked)}</s>${ok ? " — bitta harf farq, imloga e'tibor bering" : ""}</span>` : ""}</p>
          ${ok ? "" : `<p class="tl-rn">Bu gap «qiyin gaplar»ga tushdi — oxirida yana mashq qilasiz.</p>`}</div>` : `<p class="gohint tl-hint">Tanimagan so'zni bosing — tarjimasi chiqadi</p>`}`;
      const last = mode === "hard" ? k >= seq.length - 1 : i >= N - 1;
      acts.innerHTML = `<div class="tl-acts"><button class="tl-act tl-sq" id="tlre" aria-label="Yana eshitish">${playing ? ICON_PAUSE : ICON_RE}</button>${phase === "res" && addOk ? `<button class="tl-act tl-add" id="tladd2">${ICON.plus}<span>Takrorga</span></button>` : ""}<button class="tl-act tl-main${phase === "res" && ok ? " tl-ok" : ""}" id="tlmain"><span>${last ? "Tugatish" : phase === "res" ? "Davom etish" : "Keyingi gap"}</span></button></div>
        <div class="tl-tools">${SR ? `<button class="tl-chip" id="tlmic">${ICON_MIC}<span>Qaytarish</span></button>` : ""}${spdChip()}${ai ? `<button class="tl-chip" id="tlwhy">${ICON_WHY}<span>Tushuntir</span></button>` : ""}</div><div class="micout tl-mo" id="tlmo" aria-live="polite"></div>`;
      $("#tlre").onclick = () => playing ? pause() : playCur(false);
      $("#tlmain").onclick = nextSentence;
      const ub = $("#tluzb"); if (ub) ub.onclick = () => { uzOpen = true; draw(); };
      // shadowing: gap yana eshitiladi, tugagach mikrofon o'zi yoqiladi — gapni ortidan qaytarasiz
      const mic = $("#tlmic"); if (mic) mic.onclick = () => run(s[0], s[1], () => { draw(); const b = $("#tlmic"), o = $("#tlmo"); if (b && o) listen(s[2], o, b); });
      const ad = $("#tladd2"); if (ad) ad.onclick = () => { addWord(info, s); draw(); };
      body.querySelectorAll(".tl-w").forEach(b => { b.onclick = () => wordSheet(b.dataset.w); b.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); wordSheet(b.dataset.w); } }; });
      const why = $("#tlwhy");
      if (why) why.onclick = () => {
        why.disabled = true;
        aiBox.innerHTML = `<div class="ai" role="status"><div class="sk"></div><div class="sk" style="width:70%"></div><p class="muted" style="margin:8px 0 0;font-size:13px">Tushuntirish tayyorlanmoqda…</p></div>`;
        aiAsk({ mode: "sentence", answer: s[2], uz: s[3] || "" }).then(r => {
          aiBox.innerHTML = `<div class="ai"><p>${esc(r.izoh || "")}</p>${aiExample(r.misol)}</div>`; bindSay(aiBox);
        }).catch(e => { aiBox.innerHTML = `<div class="ai"><p class="muted">${esc(aiErr(e.code))}</p></div>`; }).finally(() => { why.disabled = false; });
      };
    }
    const sp = $("#tlspd"); if (sp) sp.onclick = () => { tlSetPref("spd", rate() < 1 ? "1" : ".75"); v.playbackRate = rate(); draw(); };
    const rp = $("#tlrep"); if (rp) rp.onclick = () => playCur(false);
  }

  /* ---- natija ---- */
  function finish() {
    halt(); phase = "fin"; aiBox.innerHTML = ""; segs(); cov.classList.add("hidden");
    const sc = score(); if (sc.pct != null && tlSt(L.n).done) tlSave(L.n, { pct: sc.pct });
    const st = tlSt(L.n), next = TL.lessons.find(x => x.n === L.n + 1), w = st.w || [];
    const hard = arr.map((c, j) => c === "0" ? j : -1).filter(j => j >= 0);
    const C = 2 * Math.PI * 52, pct = sc.pct == null ? 100 : sc.pct;
    const head = sc.pct == null ? "Dars tugadi" : pct >= 90 ? "A'lo!" : pct >= 70 ? "Zo'r natija" : pct >= 50 ? "Yaxshi boshlanish" : "Quloq endi o'rganyapti";
    const prev = st.prev != null && sc.pct != null ? `<p class="muted tl-prev">O'tgan safar: ${st.prev}%${sc.pct > st.prev ? ` · <b class="tl-up">+${sc.pct - st.prev}%</b>` : ""}</p>` : "";
    body.innerHTML = `<div class="card tl-fin">
      <div class="tl-ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" class="tr"/><circle cx="60" cy="60" r="52" class="fg" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct / 100)).toFixed(1)}"/></svg><div><b>${sc.pct == null ? "✓" : sc.pct + "%"}</b>${sc.pct == null ? "" : "<span>to'g'ri</span>"}</div></div>
      <h2>${head}</h2>
      <p class="muted">${sc.q ? `${sc.q} ta savoldan ${sc.ok} tasini eshitib topdingiz` : `${N} ta gap tinglandi`}</p>${prev}
      <div class="tl-stats"><div><b>${N}</b><span>gap</span></div><div><b>${w.length}</b><span>yangi so'z</span></div><div class="fire"><b>${liveStreak()}</b><span>kun seriya</span></div></div>
      ${hard.length ? `<div class="tl-hard"><p class="label">Qiyin gaplar</p>${hard.slice(0, 3).map(j => `<p lang="en"><i></i>${esc(L.s[j][2])}</p>`).join("")}${hard.length > 3 ? `<p class="muted">+${hard.length - 3} ta gap</p>` : ""}</div>` : ""}
    </div>`;
    acts.innerHTML = `${lessonBtn("tl")}<div class="tl-fbtn">
      ${hard.length ? `<button class="btn" id="tlhard">${hard.length} ta qiyin gapni mashq qilish</button>` : ""}
      <button class="btn${hard.length ? " ghost" : ""}" id="tlwatch">${ICON_PLAY} Butun sahnani matnsiz ko'rish</button>
      ${next ? `<a class="btn ghost" href="#tinglash-${next.n}">Keyingi dars: ${esc(next.t)}</a>` : ""}
      <button class="btn ghost" id="tlagain">Darsni qaytadan boshlash</button></div>`;
    bindLesson();
    const hb = $("#tlhard"); if (hb) hb.onclick = () => { mode = "hard"; seq = hard; k = 0; i = seq[0]; phase = "idle"; draw(); playCur(true); };
    $("#tlwatch").onclick = () => { mode = "watch"; phase = "watch"; draw(); run(L.s[0][0], L.s[N - 1][1], () => { mode = "main"; finish(); }); };
    $("#tlagain").onclick = () => { tlSave(L.n, { i: 0, r: "", done: false, prev: score().pct, pass: (tlSt(L.n).pass || 1) + 1 }); arr = Array(N).fill(" "); mode = "main"; i = 0; phase = "idle"; draw(); };
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---- so'z oynasi ---- */
  const sh = $("#tlsh"), shb = $("#tlshb");
  const closeSheet = () => { sh.classList.add("hidden"); };

  sh.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  function addWord(info, s) {
    const id = "my|" + norm(info.w);
    if (!S.my.some(m => m.id === id)) { S.my.push({ id, w: info.w, u: info.u, p: info.p || "", e: s[2], t: s[3] || "" }); untomb("my:" + id); syncMyWords(); }

  }
  function wordSheet(raw) {
    const info = tlLookup(raw); if (!info) return;
    if (playing) pause();
    const s = L.s[i], added = (tlSt(L.n).w || []).includes(info.w) || info.mine;
    const name = /^[A-Z]/.test(String(raw).replace(/^[^A-Za-z]+/, "")) && !info.u;
    const sbody = u => `<div class="tl-wh"><div><b id="tlsw" lang="en">${esc(info.w)}</b>${info.p ? `<span class="pron">[${esc(info.p)}]</span>` : ""}</div><button class="icon" data-say="${esc(info.w)}" aria-label="Talaffuzni eshitish">${ICON.vol}</button></div>
      <p class="tl-wu">${u ? esc(u) : name ? `<span class="muted">Ism yoki joy nomi — tarjima qilinmaydi</span>` : `<span class="muted">Ilova lug'atida hali yo'q</span>`}</p>
      ${info.book ? `<p class="muted tl-wn">Kitobda bor: Unit ${un(info.book.unit)} — rejaga o'zi tushadi.</p>` : info.inPlan ? `<p class="muted tl-wn">«So'z boyligi»da o'rganilmoqda.</p>` : added ? `<p class="tl-wn tl-ok">✓ Takrorga qo'shilgan</p>` : u ? `<button class="btn" id="tladd">${ICON.plus} Takrorga qo'shish</button>` : ""}`;
    shb.innerHTML = sbody(info.u); sh.classList.remove("hidden"); bindSay(shb);

    bindAdd();

      shb.querySelector(".tl-wu").innerHTML = `<span class="muted">Claude'dan so'ralmoqda…</span>`;
      aiAsk({ mode: "word", answer: s[2], word: info.w }).then(r => {
        info.u = r.tarjima || ""; info.p = info.p || r.pron || ""; shb.innerHTML = sbody(info.u) + (r.izoh ? `<p class="muted tl-wn">${esc(r.izoh)}</p>` : ""); bindSay(shb); bindAdd();
      }).catch(e => { shb.querySelector(".tl-wu").innerHTML = `<span class="muted">${esc(aiErr(e.code))}</span>`; });
    }
    const cl = shb.querySelector(".tl-shx"); if (cl) cl.focus({ preventScroll: true });
  }

  /* ---- holatlar ---- */
  v.addEventListener("loadedmetadata", () => { if (v.paused && v.currentTime < 0.1) { try { v.currentTime = L.s[i][0]; } catch (e) {} } }, { once: true });
  v.addEventListener("waiting", () => { const b = $("#tlmain span"); if (playing && b) b.textContent = "Yuklanmoqda…"; });
  v.addEventListener("playing", () => { if (playing) draw(); });
  v.addEventListener("error", () => {
    halt();
    acts.innerHTML = `<div class="card tl-err"><p><b>Video ochilmadi.</b> Internet sekin yoki VOA serveri javob bermayapti.</p><button class="btn" id="tlretry">Qayta urinish</button></div>`;
    $("#tlretry").onclick = () => { v.load(); draw(); };

  phase === "fin" ? finish() : draw();
  const off = () => { if (location.hash !== "#tinglash-" + L.n) { halt(); const o = document.getElementById("tlsh"); if (o) o.remove(); window.removeEventListener("hashchange", off); } };

function widgetCard() {
  if (!AUTH || cloud.kind === "claude") return "";
  return `<details class="card sy wg" id="wgc"><summary><span class="sy-ic">${ICON_WG}</span><span><b>Telefon widgeti</b><span>Uy ekranida bugungi takror soni va seriya</span></span></summary>

    <div id="wgbody">${wgSteps()}</div>
    <p class="sy-err" id="wgmsg" role="status"></p>
    <div class="sy-row"><button class="tlink" id="wgnew">Kalitni yangilash</button><span class="muted" style="font-size:13px">Eski widget ishlamay qoladi</span></div>
  </details>`;
}
async function wgKey(renew) {
  const tok = await sbToken();
  if (renew) await sbFetch("/rest/v1/widget_keys?user_id=eq." + AUTH.uid, { method: "DELETE" }, tok);
  let r = await sbFetch("/rest/v1/widget_keys?select=key", {}, tok);
  if (!r || !r[0]) r = await sbFetch("/rest/v1/widget_keys?select=key", { method: "POST", headers: { Prefer: "return=representation" }, body: "{}" }, tok);
  const key = r && r[0] && r[0].key; if (!key) throw new Error("key");
  return key;
}
async function wgScript(key) {
  const s = await fetch("widget-scriptable.js", { cache: "no-store" }); if (!s.ok) throw new Error("script");
  return (await s.text()).replace("__KEY__", key);
}
function bindWidget() {
  const box = $("#wgc"); if (!box) return;
  const msg = $("#wgmsg");
  // tayyor kalitni joriy tabdagi tugmaga qo'yadi (iPhone uchun skript ham oldindan tayyorlanadi: Safari kechikkan nusxani taqiqlaydi)
  const fill = async () => {
    if (WG.os === "android") { const a = $("#wglink"); if (!a || !WG.key) return; a.href = "ingliztakror://k/" + WG.key; a.removeAttribute("aria-disabled"); a.textContent = "Ilovaga ulash"; return; }
    const btn = $("#wgcp"), tx = $("#wgtx"); if (!btn || !WG.key) return;
    if (!WG.text) WG.text = await wgScript(WG.key);
    tx.value = WG.text; btn.disabled = false; btn.textContent = "Skriptni nusxalash";
    btn.onclick = () => {
      const done = () => { msg.textContent = "Nusxalandi ✓ Endi Scriptable'ni oching (3-qadam)."; };
      const manual = () => { tx.classList.remove("hidden"); tx.focus(); tx.select(); msg.textContent = "Avtomatik nusxalab bo'lmadi: matnni belgilab, «Nusxalash» ni bosing."; };
      try { navigator.clipboard.writeText(WG.text).then(done, manual); } catch (e) { manual(); }
    };
  };
  const prep = renew => { if (WG.busy) return; WG.busy = true; msg.textContent = "";
    if (renew) { WG.key = ""; WG.text = ""; $("#wgbody").innerHTML = wgSteps(); }
    wgKey(renew).then(k => { WG.key = k; return fill(); })
      .then(() => { if (renew) msg.textContent = WG.os === "android" ? "Yangi kalit tayyor. «Ilovaga ulash» ni qayta bosing." : "Yangi kalit tayyor. Skriptni qayta nusxalab, Scriptable'dagisining o'rniga qo'ying."; })
      .catch(() => { msg.textContent = "Tayyorlab bo'lmadi. Internetni tekshirib, qayta oching."; })
      .finally(() => { WG.busy = false; }); };
  box.addEventListener("toggle", () => { if (!box.open) return; if (!WG.key) prep(false); else fill().catch(() => {}); });
  box.querySelectorAll(".wg-os [data-os]").forEach(b => b.onclick = () => {
    WG.os = b.dataset.os; msg.textContent = "";
    box.querySelectorAll(".wg-os [data-os]").forEach(x => x.setAttribute("aria-selected", String(x === b)));
    $("#wgbody").innerHTML = wgSteps(); if (WG.key) fill().catch(() => {});
  });
  // eski widget ishlamay qoladi — ikkinchi bosish bilan tasdiqlanadi
  const nb = $("#wgnew"); let armed = 0;
  nb.onclick = () => { if (Date.now() - armed < 4000) { armed = 0; nb.textContent = "Kalitni yangilash"; prep(true); return; }
    armed = Date.now(); nb.textContent = "Ha, yangilash"; setTimeout(() => { if (armed && Date.now() - armed >= 4000) { armed = 0; nb.textContent = "Kalitni yangilash"; } }, 4100); };
}
route(/^sozlama$/, () => {
  app.innerHTML = `${nav(`#`, `Bugun`, `Sozlamalar`)}
  <div class="stack">${cloud.kind === "claude" ? `<p class="sub">Natijalar hisobingizda o'zi saqlanadi.</p>` : `<div class="card sy" id="sycard">${syncCardInner()}</div>${widgetCard()}`}${installCard(true)}${remCard()}${clsCard()}
  <div class="card"><p class="label">Zaxira · oxirgisi: ${bakWhen()}</p>
    <button class="btn" id="bk">${sv('<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>')} Zaxira faylini saqlash</button>
    <p class="gohint" style="text-align:left">Telefonda «Ulashish» oynasi ochiladi — Telegram «Saqlangan xabarlar»ga yuboring.</p><p class="muted" id="bkmsg" role="status"></p></div>
  <div class="card"><p class="label">Zaxiradan tiklash</p>
    <label class="btn ghost" for="bf">Faylni tanlash<input type="file" id="bf" class="vh" accept=".json,application/json,text/plain"></label>
    <p class="gohint" style="text-align:left">Hozirgi natijalar o'chmaydi: har so'z bo'yicha ko'proq ishlangani qoladi.</p><p class="muted" id="msg" role="status"></p></div>
  <details class="card"><summary class="label" style="cursor:pointer;margin:0">Kod orqali (eski usul)</summary><div style="height:12px"></div>
    <p class="label">Mening kodim</p><textarea id="ex" rows="4" readonly>${esc(btoa(unescape(encodeURIComponent(JSON.stringify(S)))))}</textarea>
    <div style="height:10px"></div><button class="btn ghost" id="cp">Nusxalash</button>
    <div style="height:16px"></div><p class="label">Boshqa qurilmadan kod</p><textarea id="im" rows="4" placeholder="Kodni shu yerga qo'ying"></textarea><div style="height:10px"></div><button class="btn ghost" id="ld">Yuklash</button></details>
  ${canSpeak() ? `<div class="card"><label class="sw"><span><b>Takrorlashda gapirish savollari</b><span class="muted">Ba'zan so'zni ovoz chiqarib aytasiz. Ofisda bo'lsangiz — «Yozib javob bering».</span></span><input type="checkbox" id="spk"${spkOn() ? " checked" : ""}></label></div>` : ""}
  ${canBuzz() ? `<div class="card"><label class="sw"><span><b>Javobda titrash</b><span class="muted">To'g'ri — bir marta, xato — ikki marta</span></span><input type="checkbox" id="vib"${buzzOn() ? " checked" : ""}></label></div>` : ""}</div>`;
  bindInstall(); bindRem(); bindCls(); bindSync();
  const sk = $("#spk"); if (sk) sk.onchange = () => { try { localStorage.setItem("ingliz-spk", sk.checked ? "1" : "0"); } catch (e) {} };
  const vb = $("#vib"); if (vb) vb.onchange = () => { try { localStorage.setItem("ingliz-vib", vb.checked ? "1" : "0"); } catch (e) {} buzz(true); };
  $("#cp").onclick = () => {
    const t = $("#ex"), b = $("#cp"); t.select(); persist();
    const ok = () => { bakMark(); b.textContent = "Nusxalandi ✓"; };
    const old = () => { let r = false; try { r = document.execCommand("copy"); } catch (e) {} if (r) ok(); else b.textContent = "Kodni belgilab, o'zingiz nusxalang"; };
    try { navigator.clipboard.writeText(t.value).then(ok, old); } catch (e) { old(); }
  };
  const done = add => { $("#msg").textContent = "Tiklandi ✓" + (add > 0 ? " · " + add + " ta yangi so'z natijasi qo'shildi" : " · natijalar birlashtirildi"); };
  $("#ld").onclick = () => { try { done(restoreBackup(readBackup($("#im").value))); } catch (e) { $("#msg").textContent = "Kod noto'g'ri. Qaytadan nusxalab ko'ring."; } };
  bindWidget();
  $("#bk").onclick = async () => { const b = $("#bk"); b.disabled = true; const r = await saveBackup(); b.disabled = false; $("#bkmsg").textContent = r === "fail" ? "Saqlab bo'lmadi. «Kod orqali» usulini ishlating." : r === "cancel" ? "" : "Saqlandi ✓"; };
  $("#bf").onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { done(restoreBackup(readBackup(t))); } catch (er) { $("#msg").textContent = "Bu fayl zaxira emas. «ingliz-zaxira-…json» faylini tanlang."; } }); e.target.value = ""; };
});

if (OAUTH && OAUTH.err) { const c = OAUTH.err === "access_denied"; OAUTH = null; toast(c ? "Google bilan kirish bekor qilindi" : "Google orqali kirib bo'lmadi", null, null, { type: c ? "info" : "err", sub: c ? "Xohlasangiz, email orqali kiring yoki mehmon bo'lib davom eting." : "Qayta urinib ko'ring yoki email orqali kiring." }); }
initCloud();
if (isStandalone() && Object.keys(S.srs).length >= 10) persist();
})();
