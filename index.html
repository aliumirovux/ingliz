<script>/* PWA: telefonda "ilova" qilib o'rnatish. Faqat GitHub Pages va lokal serverda ishlaydi, Claude sahifasida kerak emas. */
(function () {
  if (!/github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) return;
  window.INGLIZ_PWA = true;
  const add = (tag, attrs) => { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); document.head.appendChild(e); };
  add("link", { rel: "manifest", href: "manifest.webmanifest" });

  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iliq, tahririy (Busuu ruhida) — neytral ochiq fon, Onest Bold sarlavhalar, terrakota aksent; bitta ustun (640px gacha), pastda 4 bo'limli menyu */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#E9EAE5; --ink:#17171B; --muted:#5E5F67; --line:#E1E2DD; --line-strong:#CBCCC6;
  --marker:#B9441F; --on-marker:#FFFFFF; --hl:#F8E4D9; --marker-soft:#F8E4D9; --accent-text:#9C3615;
  --pron:#7A5A2B; --ok:#2C5E2A; --ok-strong:#3F8A3B; --ok-bg:#E5F2E4; --bad:#9A2B1C; --bad-strong:#C9452E; --bad-bg:#F9E3DD;
  --shadow:0 1px 2px rgba(23,23,27,.05), 0 10px 28px -14px rgba(23,23,27,.18);
  --glass:rgba(255,255,255,.72); --glass-solid:#FFFFFF; --glass-edge:rgba(255,255,255,.9); --glass-line:rgba(23,23,27,.08); --glass-shadow:0 10px 30px rgba(23,23,27,.14), 0 2px 6px rgba(23,23,27,.06); --lens:rgba(185,68,31,.13);
  --font-display:var(--font-body);
  --font-body:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:var(--font-body);
  --nav-h:64px; --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111113; --surface:#1A1A1E; --surface-2:#26262C; --ink:#EEEEE9; --muted:#A0A1A8; --line:#2A2B30; --line-strong:#3B3C42;
    --marker:#E27A4E; --on-marker:#1C1A16; --hl:#4A2A1C; --marker-soft:#3A2318; --accent-text:#F09A72;
    --pron:#D9B27A; --ok:#8BCB86; --ok-strong:#5FA85A; --ok-bg:#1C2A1B; --bad:#FF9A85; --bad-strong:#E0644C; --bad-bg:#3A1D17;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
    --glass:rgba(38,38,44,.55); --glass-solid:#26262C; --glass-edge:rgba(255,255,255,.14); --glass-line:rgba(255,255,255,.06); --glass-shadow:0 12px 34px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3); --lens:rgba(226,122,78,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#111113; --surface:#1A1A1E; --surface-2:#26262C; --ink:#EEEEE9; --muted:#A0A1A8; --line:#2A2B30; --line-strong:#3B3C42;
    --marker:#E27A4E; --on-marker:#1C1A16; --hl:#4A2A1C; --marker-soft:#3A2318; --accent-text:#F09A72;
    --pron:#D9B27A; --ok:#8BCB86; --ok-strong:#5FA85A; --ok-bg:#1C2A1B; --bad:#FF9A85; --bad-strong:#E0644C; --bad-bg:#3A1D17;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
    --glass:rgba(38,38,44,.55); --glass-solid:#26262C; --glass-edge:rgba(255,255,255,.14); --glass-line:rgba(255,255,255,.06); --glass-shadow:0 12px 34px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3); --lens:rgba(226,122,78,.2);
    color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
/* fon html'da ham: Android Chrome pastki panel rangini sahifa fonidan olishi mumkin, boshida oq chiqmasin (tajriba) */
html{background:var(--bg)}
/* sahifa almashish animatsiyasi yon tomonga chiqib, telefonda sahifani kichraytirmasin */
.stage{overflow-x:hidden}
@supports (overflow:clip){ .stage{overflow-x:clip} }
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px))}
button{font:inherit;color:inherit}
a{color:inherit}
svg{flex:none}
::selection{background:var(--hl);color:var(--ink)}
input,textarea{caret-color:var(--marker)}
html{scrollbar-color:var(--line-strong) transparent;scrollbar-width:thin}
:focus-visible{outline:2px solid var(--marker);outline-offset:2px;border-radius:6px}
/* telefonda bosilganda brauzerning ko'k fonini o'chiramiz; o'rniga o'zimizning bosish holatlari */
html{-webkit-tap-highlight-color:transparent}
a.li:active,button.li:active{background:var(--marker-soft)}
.steps button:active,.back:active{opacity:.6}
.opt:active:not(:disabled),.mode:active,.chip:active,.tile:active,.me:active{transform:scale(.98)}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 36px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1{font:700 32px/1.1 var(--font-display);letter-spacing:-.025em;margin:4px 0 6px;text-wrap:balance}
h2{font:700 22px/1.2 var(--font-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0 0 20px;max-width:60ch}
.muted{color:var(--muted);font-size:15px}
.label,.eyebrow{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 10px}
.hidden{display:none!important}
.stack{display:flex;flex-direction:column;gap:12px}
.stack>*+*{margin-top:0}
.row{display:flex;gap:10px}.row>*{flex:1}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:15px;text-decoration:none;margin:0 0 4px;min-height:44px}
.back:hover{color:var(--ink)}
/* marker highlight */
.mk{color:var(--accent-text)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;min-height:52px;padding:12px 18px;font-weight:600;font-size:16px;cursor:pointer;background:var(--marker);color:var(--on-marker);width:100%;text-decoration:none;transition:transform .15s cubic-bezier(.16,1,.3,1), filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.ghost:hover{filter:brightness(.97)}
.btn:disabled{background:var(--surface-2);color:var(--muted);cursor:default;filter:none;transform:none}
.icon{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);color:var(--ink);border:0;border-radius:999px;padding:8px 14px;min-height:36px;font-weight:500;cursor:pointer;font-size:14px;line-height:1.2}
.icon:hover{filter:brightness(.96)}
.icon svg{width:17px;height:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;min-height:44px}
.chip.on{background:var(--marker-soft);color:var(--accent-text);box-shadow:inset 0 0 0 1.5px var(--marker);font-weight:600}
.chip svg{width:16px;height:16px;flex:none;margin-left:-3px}
.picked{margin:12px 0 0;font-size:14px;color:var(--muted)}
.picked b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.gohint{margin:8px 2px 0;font-size:14px;color:var(--muted);text-align:center}
/* takror savol yorlig'i (xato javob oxirida qayta so'raladi) */
.qtag{display:inline-block;background:var(--surface-2);color:var(--ink);font-weight:600;border-radius:999px;padding:2px 9px;margin-right:6px;font-size:12px}
.qtag.re{background:var(--marker-soft);color:var(--accent-text)}
.qbig{font-size:34px}
.pron.tr{color:var(--muted);font-family:inherit;font-style:italic}
.q .gap{color:var(--accent-text);letter-spacing:.06em}
.intro .iu{font:600 19px/1.35 var(--font-display);margin-top:14px}
.intro .ex{background:var(--surface-2);border-radius:14px;padding:12px 14px}
/* eslatgich */
.hook{display:flex;align-items:flex-start;gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--hl);color:var(--ink);font-size:15px;font-style:normal}
.hook .hi{flex:none;color:var(--accent-text);display:flex}.hook .hi svg{width:18px;height:18px}
.hook .ht{flex:1;min-width:0}.hook .ht b{display:block;font-size:12px;font-weight:600;color:var(--accent-text);margin-bottom:2px}
.hook .hl{flex:none;background:none;border:0;color:var(--accent-text);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:12px 4px;margin:-12px -4px;text-decoration:underline;text-underline-offset:3px}
.hook:has(.hadd){background:none;padding:0}
.hadd{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:0;border-radius:999px;padding:8px 14px;background:var(--marker-soft);color:var(--accent-text);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.hadd svg{width:16px;height:16px}
.hook.edit{display:block;background:var(--surface-2)}
.hook.edit .label{margin-bottom:8px}
.hrow{display:flex;gap:8px;align-items:center}
.hrow .hin{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
.hrow .hin:focus{border-color:var(--marker);box-shadow:0 0 0 4px var(--hl)}
.hrow .icon{min-height:44px;flex:none}
.hhelp{margin:8px 0 0;font-size:13px;color:var(--muted)}
.box.hard{background:var(--bad-bg);color:var(--bad)}
.steps .lock .ic{background:var(--surface-2);color:var(--muted)}
.steps .lock .tx b{color:var(--muted)}
.steps .lock .min svg{width:16px;height:16px}
.steps button:disabled{cursor:default}
/* ayting */
.mic{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0 4px}
.micbtn{width:84px;height:84px;border-radius:50%;border:0;background:var(--marker);color:var(--on-marker);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.micbtn svg{width:34px;height:34px}
.micbtn:active{transform:scale(.95)}
.micbtn.on{animation:micpulse 1.2s ease-in-out infinite}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 var(--hl)}50%{box-shadow:0 0 0 16px var(--hl)}}
@media (prefers-reduced-motion:reduce){.micbtn.on{animation:none;outline:4px solid var(--hl)}}
.micst{margin:0;text-align:center;font-size:15px;color:var(--muted);min-height:22px}
.hl2{background:none;border:0;color:var(--accent-text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;padding:8px 6px;text-decoration:underline;text-underline-offset:3px}
.wl li .del{margin-top:2px;color:var(--bad)}
/* mening so'zlarim */
.myf label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
.myf input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
.myf input:focus{border-color:var(--marker);box-shadow:0 0 0 4px var(--hl)}
.myf details{margin-top:12px}
.myf summary{cursor:pointer;color:var(--accent-text);font-weight:600;font-size:14px;min-height:44px;display:flex;align-items:center}
.myf .btn{margin-top:16px}
.myf #mymsg{margin:10px 0 0}
/* eslab qolish */
.ret .retn{font:700 44px/1 var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:2px 0 12px}
.retbar{position:relative;height:10px;border-radius:99px;background:var(--surface-2);overflow:visible}
.retbar i{display:block;height:100%;border-radius:99px;background:var(--marker)}
.retbar b{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink);border-radius:2px}
.ret .muted{margin:12px 0 0;font-size:14px}
.rettg{position:relative;height:18px}.rettg span{position:absolute;top:4px;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap}
/* birinchi ochilish: kursdagi unitni tanlash */
.ask-unit h2{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:4px 0 6px}
.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 0}
.ugrid button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:var(--surface-2);color:var(--ink);border-radius:16px;padding:10px 12px;min-height:58px;cursor:pointer;font:inherit}
.ugrid button b{font-size:20px;min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.ugrid button span{font-size:13px;line-height:1.25;color:var(--muted)}
.ugrid button.guess{box-shadow:inset 0 0 0 2px var(--marker);background:var(--marker-soft)}
.ugrid button.guess span{color:var(--accent-text)}
.ugrid button:active{transform:scale(.98)}

/* surfaces */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.hero{background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:20px}

/* today: salomlashuv, kurs joyi, bitta dars kartasi, haftalik seriya */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 0 14px}
.hello h1{margin:0}
.hello .date{color:var(--muted);font-size:14px;margin:0 0 2px}
.me{flex:none;width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--muted);text-decoration:none}
.me:hover{color:var(--ink)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.pill{position:relative;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.pill svg{width:17px;height:17px;color:var(--marker)}
.pill .dn{color:var(--muted);display:flex}.pill .dn svg{color:inherit;width:15px;height:15px}
.pill select{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer;font-size:16px}
.pill:focus-within{outline:2px solid var(--marker);outline-offset:2px}
.lesson{background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:20px}
.lesson .meta{font-size:13px;color:var(--muted);margin:0}
.lesson .meta b{color:var(--accent-text);font-weight:600}
.lesson h2{font-size:30px;line-height:1.1;letter-spacing:-.025em;margin:6px 0 4px}
.lesson .uz{color:var(--muted);font-size:15px;margin:0}
.steps{list-style:none;margin:10px 0 16px;padding:0}
.steps button{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;background:none;border:0;padding:10px 0;text-align:left;cursor:pointer}
.steps li+li button{border-top:1px solid var(--line)}
.steps .ic{flex:none;width:38px;height:38px;border-radius:12px;background:var(--marker-soft);color:var(--accent-text);display:grid;place-items:center}
.steps .ic svg{width:19px;height:19px}
.steps .done .ic{background:var(--ok-bg);color:var(--ok)}
.steps .tx{flex:1;min-width:0}
.steps .tx b{display:block;font-weight:600;font-size:15px}
.steps .tx span{display:block;font-size:13px;color:var(--muted)}
.steps .done .tx b{color:var(--muted)}
.steps .min{flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.week{display:flex;justify-content:space-between;padding:12px 14px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.week div{display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--muted)}
.week i{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--on-marker)}
.week i svg{width:16px;height:16px}
.week i.on{background:var(--marker)}
.week i.now:not(.on){background:transparent;box-shadow:inset 0 0 0 2px var(--marker)}
.week div.now{color:var(--ink);font-weight:600}
.medal{width:96px;height:96px;margin:18px auto 0;border-radius:50%;background:var(--ok-strong);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 12px var(--ok-bg)}
.medal svg{width:44px;height:44px}
.done-h{font:700 32px/1.1 var(--font-display);letter-spacing:-.025em;margin:30px 0 6px;text-align:center}
.unitname{font:600 18px/1.3 var(--font-body);margin:0}
.unituz{color:var(--muted);font-size:15px;margin:2px 0 16px}
.meter{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-weight:600;font-size:15px}
.meter .pbar{flex:1;margin:0}
.streak{display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:14px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.facts b{color:var(--ink);font-weight:600}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}
.foot a{color:var(--muted);display:inline-block;padding:15px 4px;margin:-15px -4px}
.facts a{color:inherit;display:inline-block;padding:14px 0;margin:-14px 0}

.unitbig{font:700 34px/1.1 var(--font-display);letter-spacing:-.025em;margin:6px 0 4px}
/* unit list & rows */
.units{display:flex;flex-direction:column;gap:10px}
.unit{display:block;text-align:left;width:100%;background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .15s cubic-bezier(.16,1,.3,1)}
.unit:active{transform:scale(.99)}
.unit .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.unit b{font-size:16px;font-weight:600}
.unit .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.urow{display:flex;gap:14px;align-items:center}
.urow .num{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font:700 22px/1 var(--font-display);background:var(--surface-2)}
.urow.cur .num{background:var(--marker);color:var(--on-marker)}
.urow .tx{flex:1;min-width:0}
.urow .tx span{display:block;color:var(--muted);font-size:14px}
.urow .pct{font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.pbar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:10px;display:flex}
.pbar i{display:block;height:100%}
.pbar .m{background:var(--marker)}.pbar .s{background:color-mix(in srgb,var(--marker) 32%,var(--surface-2))}
.pbar.split{height:10px;margin:2px 0 12px;gap:2px;background:transparent}
.pbar.split i{border-radius:99px}.pbar.split::after{content:"";flex:1;background:var(--surface-2);border-radius:99px}
.split-l{list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 14px;padding:0;font-size:13px;color:var(--muted)}
.split-l li{display:flex;align-items:center;gap:6px}
.split-l i{width:10px;height:10px;border-radius:50%;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-strong)}
.split-l i.m{background:var(--marker);box-shadow:none}.split-l i.s{background:color-mix(in srgb,var(--marker) 32%,var(--surface-2));box-shadow:none}
.split-l b{color:var(--ink);font-weight:600}
.due{display:flex;align-items:center;gap:8px;margin:-4px 0 14px;font-size:14px;color:var(--accent-text)}
.due svg{width:16px;height:16px;flex:none}.due b{font-weight:700}
.clamp{display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.streak{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 4px;font-size:14px;color:var(--muted)}
.streak svg{width:17px;height:17px;color:var(--marker)}.streak b{color:var(--ink);font-weight:600}

/* unit hub sections */
.sec{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h .n{color:var(--muted);font-size:14px}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:14px 16px;cursor:pointer;text-decoration:none;color:var(--ink)}
.li+.li{border-top:1px solid var(--line)}
a.li:hover,button.li:hover{background:var(--marker-soft)}
div.li{cursor:default}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600}
.li .tx span{display:block;color:var(--muted);font-size:14px}
.li .st{flex:none;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.li .st.full{color:var(--ok)}
.li .go{color:var(--muted)}

/* mode picker */
.modes{display:grid;gap:10px}
.mode{display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);border-radius:16px;padding:14px;cursor:pointer}
.mode.on{box-shadow:inset 0 0 0 2px var(--marker);background:var(--marker-soft)}
.mode b{display:block;font-weight:600}
.mode span{color:var(--muted);font-size:14px}
.dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);margin-top:3px}
.mode.on .dot{border:6px solid var(--marker)}

/* practice */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--marker);width:0;transition:width .25s}
.q{font:600 26px/1.25 var(--font-display);letter-spacing:-.015em;margin:6px 0 4px;word-break:break-word;text-wrap:balance}
.qsmall{font-size:22px}
.pron{color:var(--pron);font:500 15px/1.4 var(--font-mono);letter-spacing:.01em}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hintline{color:var(--muted);font-size:14px;margin-top:6px;min-height:20px;white-space:pre-wrap}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);border-radius:16px;padding:15px 16px;min-height:56px;cursor:pointer;font-size:17px;font-weight:500;transition:box-shadow .15s,background .15s}
.opt:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.opt.ok{background:var(--ok-bg);box-shadow:inset 0 0 0 2px var(--ok-strong);color:var(--ok);font-weight:600}
.opt.bad{background:var(--bad-bg);box-shadow:inset 0 0 0 2px var(--bad-strong);color:var(--bad)}
.opt:disabled{cursor:default}
.spell,input.search,textarea{width:100%;font:inherit;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
.spell{font-size:22px;margin-top:16px}
/* yozish maydoni — bir qatorli textarea: Chrome klaviatura ustiga parol/karta/manzil panelini chiqarmaydi */
textarea.spell{display:block;resize:none;overflow:hidden;white-space:pre;height:auto}
.spell:focus,input.search:focus,textarea:focus{border-color:var(--marker);box-shadow:0 0 0 4px var(--hl)}
.spell.ok{border-color:var(--ok)} .spell.bad{border-color:var(--bad)}
.opts:empty{display:none}
[data-lock]{caret-color:transparent}
/* telefonda yozish mashqi doim ixcham: klaviatura ochilib-yopilganda karta o'lchami o'zgarmaydi, so'z, maydon va «Tekshirish» klaviatura ustiga sig'adi */
@media (pointer:coarse){
  .wrap:has(.card .spell){padding-top:8px}
  .wrap:has(.card .spell) .top{margin-bottom:8px}
  .wrap:has(.card .spell) .bar{margin-bottom:10px}
  .wrap:has(.card .spell) .card{padding:14px 16px}
  .wrap:has(.card .spell) .q{margin:2px 0}
  .wrap:has(.card .spell) .tools{margin-top:8px}
  .wrap:has(.card .spell) .hintline:empty{min-height:0;margin:0}
  .wrap:has(.card .spell) .spell{margin-top:10px}
  .wrap:has(.card .spell) .card .row{margin-top:10px!important}
}
.fb{margin-top:14px;border-radius:16px;padding:14px 16px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb .icon{background:transparent;border-color:currentColor;color:inherit;padding:4px 9px}
.diff{font:600 21px/1.35 var(--font-display);letter-spacing:-.01em;margin:4px 0;color:var(--ink)}
.diff .x{background:var(--bad);color:var(--surface);border-radius:4px;padding:0 3px}
.ex{margin-top:12px;font-size:15px}
.ex small{display:block;color:var(--muted);font-style:italic}
.score{font:700 56px/1 var(--font-display);letter-spacing:-.035em;margin:10px 0;font-variant-numeric:tabular-nums}

/* word list */
.wl{list-style:none;margin:0;padding:0}
.wl li{padding:13px 0;border-top:1px solid var(--line)}
.wl li:first-child{border-top:0}
.wl .h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wl .w{font-weight:700;font-size:17px}
.wl .p{color:var(--pron);font:500 14px/1.4 var(--font-mono)}
.wl .u{margin-top:2px}
.wl .bk{font-size:13px;color:var(--muted)}
.wl .e{font-size:14px;margin-top:4px}
.wl .e small{display:block;color:var(--muted);font-style:italic}
.wl .say{margin-left:auto;padding:5px 9px}
.box{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--marker-soft);color:var(--accent-text);letter-spacing:.02em}
.box.m{background:var(--ok-bg);color:var(--ok)}
.legend{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}

/* patterns & speaking */
.rule{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.rule:first-child{border-top:0}
.rule b{font-weight:600;min-width:0}
.rule span{color:var(--muted);text-align:right;min-width:0}
blockquote{margin:10px 0;padding:12px 14px;background:var(--surface-2);border-radius:14px}
blockquote small{display:block;color:var(--muted);font-style:italic}
blockquote .icon{padding:3px 8px;vertical-align:middle}
.ans{margin-top:10px}
.ans p{margin:4px 0;font-size:16px}
.slot{background:var(--hl);border-radius:4px;padding:0 4px;font-weight:600}
.tip{font-size:14px;color:var(--accent-text);margin-top:8px}

/* gap tuzish */
.answer{display:flex;flex-wrap:wrap;gap:8px;min-height:72px;align-content:flex-start;align-items:center;background:var(--bg);border-radius:16px;padding:12px;margin:16px 0 14px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:0;box-shadow:inset 0 0 0 1.5px var(--line),0 2px 0 var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:9px 14px;font-size:17px;font-weight:500;cursor:pointer}
.tile:hover{box-shadow:inset 0 0 0 1.5px var(--line-strong),0 2px 0 var(--line-strong)}
.answer .tile{background:var(--marker-soft);color:var(--accent-text);box-shadow:none}
.tile.used{visibility:hidden}

/* ilovani o'rnatish kartasi */
.install{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.install img,.install .ic{width:44px;height:44px;border-radius:11px;flex:none}
.install .ic{display:grid;place-items:center;background:var(--marker-soft);color:var(--accent-text)}
a.tx{color:inherit;text-decoration:none;padding-block:4px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;cursor:pointer}
.sw b{display:block;font-weight:600}
.sw input{flex:none;width:24px;height:24px;margin:0;accent-color:var(--marker)}
.install .tx{flex:1;min-width:0}
.install .tx b{display:block;font-weight:600}
.install .tx span{display:block;color:var(--muted);font-size:14px}
.install .btn{width:auto;min-height:44px;padding:8px 14px;font-size:15px;flex:none}
.install.bak{flex-wrap:wrap;row-gap:12px}
.install.bak .btn{order:3;flex:1 1 100%;margin-left:58px}
details.card summary::marker{color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.btn{position:relative}label.btn:focus-within{outline:2px solid var(--marker);outline-offset:2px}
.install .x{flex:none;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;font-size:20px;line-height:1;min-width:48px;min-height:48px;margin:-8px -12px -8px -12px}

/* nav: iOS uslubidagi suzuvchi shisha tab bar */
nav.tabs{position:fixed;z-index:10;left:calc(12px + env(safe-area-inset-left, 0px));right:calc(12px + env(safe-area-inset-right, 0px));bottom:calc(12px + env(safe-area-inset-bottom, 0px));margin:0 auto;max-width:440px;height:var(--nav-h);padding:5px;display:flex;gap:2px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-edge)}
nav.tabs a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:999px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.01em;transition:color .25s ease;position:relative;z-index:1;-webkit-tap-highlight-color:transparent}
nav.tabs a .i{display:grid;place-items:center;height:26px;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
nav.tabs a.on .i{transform:translateY(-1px) scale(1.06)}
nav.tabs a:active .i{transform:scale(.88);transition-duration:.1s}
nav.tabs a .i svg{width:23px;height:23px}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.on{color:var(--accent-text)}
/* bitta linza tabdan tabga sirpanib o'tadi: prujinali egri chiziq, yo'lda biroz cho'ziladi */
nav.tabs .lens{position:absolute;z-index:0;left:0;top:5px;bottom:5px;width:0;border-radius:999px;background:var(--lens);box-shadow:inset 0 1px 0 var(--glass-edge), inset 0 0 0 1px var(--glass-line);pointer-events:none;opacity:0;transition:transform .55s cubic-bezier(.3,1.3,.4,1), width .55s cubic-bezier(.3,1.3,.4,1), opacity .2s ease}
/* klaviatura ochilganda menyu darhol yo'qoladi (animatsiya qilsa, ekran qisqarib ketgani uchun klaviatura bilan tepaga ko'tarilib ko'rinadi), yopilganda pastdan silliq qaytadi */
nav.tabs{transition:opacity .22s ease, transform .32s cubic-bezier(.16,1,.3,1), visibility 0s}
.typing nav.tabs{opacity:0;transform:translateY(calc(100% + 16px));visibility:hidden;pointer-events:none;transition:none}
/* dars va test — alohida rejim: pastki menyu yo'q, chiqish «Chiqish» tugmasi orqali */
.quizmode nav.tabs{display:none}
body.quizmode{padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px))}
/* telefonda javob tugmalari va «Keyingisi» bosh barmoq yetadigan pastki qismda (yozish maydoni ochiq bo'lsa — yo'q, u yerda joyni klaviatura oladi) */
@media (pointer:coarse) and (max-width:640px){
  .quizmode .wrap:not(:has(.spell:not(.hidden))){display:flex;flex-direction:column;padding-bottom:0;min-height:calc(100vh - env(safe-area-inset-top, 0px) - 2 * env(safe-area-inset-bottom, 0px) - 24px);min-height:calc(100dvh - env(safe-area-inset-top, 0px) - 2 * env(safe-area-inset-bottom, 0px) - 24px)}
  .quizmode .wrap:not(:has(.spell:not(.hidden))) > .card{flex:1 0 auto;display:flex;flex-direction:column}
  .quizmode .wrap:not(:has(.spell:not(.hidden))) > .card:not(:has(> .opts:not(:empty), > .tiles)) > .row:not(.hidden){margin-top:auto!important;padding-top:14px}
  /* test va so'z bo'laklari: izoh variantlar ustida chiqadi — javob berilgach variantlar joyidan siljimaydi, «Keyingisi» uchun joy oldindan ajratilgan */
  .quizmode .wrap:not(:has(.spell:not(.hidden))) > .card:has(> .opts:not(:empty), > .tiles) > :is(.fb,.ex){order:1}
  .quizmode .wrap:not(:has(.spell:not(.hidden))) > .card:has(> .opts:not(:empty), > .tiles) > :is(.opts,.tiles){order:2;margin-top:auto;padding-top:14px}
  .quizmode .wrap:not(:has(.spell:not(.hidden))) > .card:has(> .opts:not(:empty), > .tiles) > .row{order:3;min-height:52px}
}
nav.tabs .lens.still{transition:none}
nav.tabs .lens.pop{animation:lens-pop .55s cubic-bezier(.3,1.2,.4,1)}
@keyframes lens-pop{0%{scale:1 1}30%{scale:1.14 .88}65%{scale:.97 1.03}100%{scale:1 1}}
/* sahifa almashishi: tab yo'nalishidan yumshoq kirib keladi */
#app.enter{animation:page-in .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes page-in{from{opacity:.25;transform:translate(var(--dx, 0px), var(--dy, 8px))}to{opacity:1;transform:none}}
nav.tabs a .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ nav.tabs{background:var(--glass-solid)} }
@media (prefers-reduced-transparency: reduce){ nav.tabs{background:var(--glass-solid);-webkit-backdrop-filter:none;backdrop-filter:none} }

@media (min-width:700px){ h1{font-size:38px} .unitbig{font-size:44px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* ===== TONAL elementlar (1-variant): chegarasiz, yuzalar rang toni bilan ajraladi. Ranglar, tuzilma va pastki menyu o'zgarmaydi ===== */
:root{--track:#E2E3DE;--edge:#8C8D86;--rr:24px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface:#1D1D22;--surface-2:#2A2A31;--track:#2E2E35;--edge:#6E6F78;--seg-on:#44444D}}
:root[data-theme="dark"]{--surface:#1D1D22;--surface-2:#2A2A31;--track:#2E2E35;--edge:#6E6F78;--seg-on:#44444D}
/* yuzalar: soya o'rniga ton */
.card,.list,.lesson,.week,.install,.unit,.hero{box-shadow:none}
.card,.list,.install,.unit{border-radius:var(--rr)}
.lesson{border-radius:28px}
.me,.pill{box-shadow:none;background:var(--surface)}
/* tugmalar */
.btn{border-radius:999px;min-height:56px}
.btn.ghost{background:var(--marker-soft);color:var(--accent-text)}
.btn:disabled{background:var(--surface-2);color:var(--muted)}
.icon{min-height:40px;padding:8px 14px;font-weight:600}
/* ro'yxat: alohida yumaloq qatorlar, ajratuvchi chiziq yo'q */
.list{padding:4px;overflow:visible}
.li{border-radius:20px;min-height:64px;padding:12px}
.li+.li{border-top:0;margin-top:2px}
.li:hover{background:var(--press,rgba(0,0,0,.03))}
.li .st{background:var(--surface-2);border-radius:999px;padding:4px 10px;display:inline-flex;align-items:center;gap:4px}
.li .st svg{width:14px;height:14px}
.li .st.full{background:var(--ok-bg);color:var(--ok)}
/* chiplar va tanlov kartalari */
.chip{border-radius:12px;min-height:40px;background:var(--surface-2);box-shadow:none;font-weight:500}
.chip.on{background:var(--marker);color:var(--on-marker);box-shadow:none}
.mode{background:var(--surface-2);box-shadow:none;border-radius:20px}
.mode.on{background:var(--marker-soft);box-shadow:inset 0 0 0 2px var(--marker)}
.dot{border-color:var(--edge)}
.ugrid button{border-radius:18px}
/* progress */
.pbar{height:8px;background:var(--track)}
.pbar.split{height:12px;gap:3px}
.pbar.split::after{background:var(--track)}
.meter .pbar{height:8px}
.bar{height:10px;background:var(--track)}
.bar i{border-radius:99px}
.retbar{height:12px;background:var(--track)}
.split-l i{background:var(--track);box-shadow:none}
/* test */
.top .icon#quit{width:44px;height:44px;padding:0;justify-content:center;border-radius:50%}
.top .icon#quit svg{width:20px;height:20px}
.opts{gap:10px}
.opt{box-shadow:none;background:var(--surface);border-radius:20px;min-height:60px;padding:16px 18px}
.card .opt{background:var(--surface-2)}
.opt:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--edge)}
.opt:disabled:not(.ok):not(.bad){opacity:.6}
.tile{box-shadow:none;background:var(--surface-2);border-radius:14px}
.tile:hover{box-shadow:inset 0 0 0 1.5px var(--edge)}
/* maydonlar: to'ldirilgan, fokusda terrakota halqa */
.spell,input.search,textarea,.myf input,.hrow .hin{border:0;background:var(--surface-2);box-shadow:inset 0 0 0 2px transparent;border-radius:16px}
.spell:focus,input.search:focus,textarea:focus,.myf input:focus,.hrow .hin:focus{border:0;background:var(--surface);box-shadow:inset 0 0 0 2px var(--marker),0 0 0 4px var(--hl)}
.spell.ok{box-shadow:inset 0 0 0 2px var(--ok-strong)}.spell.bad{box-shadow:inset 0 0 0 2px var(--bad-strong)}
.card .spell,.card textarea,.card input.search{background:var(--surface-2)}
input.search{background:var(--surface)}
/* checkbox → kalit (switch) */
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:52px!important;height:32px!important;margin:0;border-radius:99px;background:var(--track);box-shadow:inset 0 0 0 2px var(--edge);position:relative;cursor:pointer;transition:background .2s}
input[type=checkbox]::after{content:"";position:absolute;left:6px;top:6px;width:20px;height:20px;border-radius:50%;background:var(--edge);transition:left .2s cubic-bezier(.3,1.3,.5,1),width .2s,height .2s,top .2s}
input[type=checkbox]:checked{background:var(--marker);box-shadow:none}
input[type=checkbox]:checked::after{left:26px;top:4px;width:24px;height:24px;background:var(--on-marker)}
input[type=checkbox]:focus-visible{outline:2px solid var(--marker);outline-offset:3px}
/* test ekrani: kartasiz, yuqorida ✕ + progress + hisob */
.top{justify-content:flex-start;gap:12px;margin:2px 0 18px}
.top .bar{flex:1;margin:0;height:10px}
.top .cnt{flex:none;font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
.top .icon#quit{flex:none}
.qcard{background:none;padding:0;border-radius:0}
.qcard > .label{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.qcard > .label:not(#qlabel),.qcard #qlabel .ltx{display:inline-flex;align-items:center;width:max-content;max-width:100%;background:var(--marker-soft);color:var(--accent-text);font-size:13px;font-weight:600;border-radius:999px;padding:4px 12px}
.qcard #qlabel{display:flex;flex-wrap:wrap;gap:6px}
.qcard #qlabel .qtag{margin:0;font-size:13px;padding:4px 12px}
.qcard .opts{margin-top:22px}
.qcard .opt,.qcard .tile,.qcard .spell,.qcard textarea,.qcard .intro .ex,.qcard .hook.edit{background:var(--surface)}
.qcard .spell:focus,.qcard textarea:focus{background:var(--surface)}
.qcard .fb{border-radius:20px;padding:14px 16px;margin-top:16px}
.qcard .fb.ok{background:var(--surface);color:var(--ink)}
.fbh{font-weight:700}.fb.ok .fbh{color:var(--ok)}
.qcard .fb.ok + .ex:not(.hidden){background:var(--surface);border-radius:0 0 20px 20px;margin-top:0;padding:0 16px 14px}
.qcard .fb.ok:has(+ .ex:not(.hidden)){border-radius:20px 20px 0 0;padding-bottom:10px}
.qcard .fb.bad + .ex{background:var(--surface);border-radius:20px;padding:14px 16px;margin-top:8px}
.qcard .row{margin-top:18px!important}
/* segmentli tanlov */
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:16px;padding:4px}
.seg .mode{flex:1 1 auto;min-width:0;justify-content:center;align-items:center;min-height:44px;padding:0 6px;border-radius:12px;background:transparent;box-shadow:none;color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg:has(.mode:nth-child(5)) .mode{font-size:13px;padding:0 4px}
.seg .mode.on{background:var(--seg-on,var(--surface));color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}

{

   1 — o'zbekchasiga qarab inglizchasini tanlash, 2 — eshitib ma'nosini tanlash, 3 — xotiradan yozish.

const LEARN_N = 5, ACTIVE = 3, LMODE = ["intro", "uz-en", "en-uz", "spell"];
function startLearn(list, title, back, tag) {
  const words = list.slice(0, LEARN_N); if (!words.length) return;
  Z = { learn: true, words, pool: list, lv: {}, errs: {}, fin: new Set(), intro: 0, q: [], i: 0, right: 0, ans: 0, wrong: [], done: new Set(), mode: "learn", title, state: "ask", retype: false, cur: null, tag, back: back || location.hash || "#", base: 0 };

  app.innerHTML = `<div class="top"><button class="icon" id="quit" aria-label="Chiqish" title="Chiqish">${ICON.x}</button><div class="bar"><i style="width:${T.i / T.q.length * 100}%"></i></div><span class="cnt">${T.i + 1}/${T.q.length}</span></div>
  <div class="card qcard"><p class="label">${esc(T.title)} · ${yoz ? "inglizcha yozing" : "inglizcha gap tuzing"}</p><div class="q qsmall">${esc(it.u)}</div>
    ${yoz ? `<textarea class="spell" id="tin" rows="1" wrap="off" enterkeyhint="go" style="font-size:19px" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Inglizcha yozing…"></textarea>
      <div class="tools"><button class="icon" id="th1">1-so'z</button><button class="icon" id="th2">So'zlar</button></div><div class="hintline" id="thint"></div>`
    : `<div class="answer" id="ans"></div><div class="tiles" id="bank"></div>`}
    <div class="fb hidden" id="tf"></div>
    <div class="row" style="margin-top:14px">${yoz ? "" : `<button class="btn ghost" id="clr">Tozalash</button>`}<button class="btn${yoz ? "" : " hidden"}" id="chk" disabled>Tekshirish</button></div>
  </div>`;
  $("#quit").onclick = () => { const b = T.back; T = null; location.hash = b; };
  let done = false;
  const show = (cls, html) => {
    $("#tf").className = "fb " + cls; buzz(cls === "ok");
    $("#tf").innerHTML = html + ` <button class="icon" data-say="${esc(it.e)}" style="padding:4px 8px">${ICON.vol}</button><div style="margin-top:6px">${esc(it.h)}</div>`;
    bindSay($("#tf")); say(it.e);
    const c = $("#clr"); if (c) c.classList.add("hidden");
    $("#chk").classList.remove("hidden"); $("#chk").disabled = false; $("#chk").textContent = T.i + 1 < T.q.length ? "Keyingisi →" : "Natijani ko'rish"; if (document.activeElement !== $("#tin")) $("#chk").focus();
  };
  if (yoz) {
    const inp = $("#tin"), want = canon(it.e);
    inp.focus(); // darhol: oldingi gapdan qolgan klaviatura yopilmasdan yangi maydonga o'tadi
    inp.oninput = () => { if (!done) $("#chk").disabled = !inp.value.trim(); };
    $("#th1").onclick = () => { $("#thint").textContent = "1-so'z: " + words(it.e)[0]; };
    $("#th2").onclick = () => { $("#thint").textContent = words(it.e).length + " ta so'z: " + words(it.e).map(w => w[0] + "…").join(" "); };
    const check = () => {
      if (done) return tuzNext();
      if (!inp.value.trim()) return;
      done = true; inp.dataset.lock = inp.value;
      const got = canon(inp.value), exact = got.join(" ") === want.join(" ");
      const close = !exact && got.length === want.length && lev(got.join(" "), want.join(" ")) === 1 && want.join(" ").length > 8;
      const ok = exact || close; tuzResult(it, ok);
      inp.className = "spell " + (ok ? "ok" : "bad"); inp.style.fontSize = "19px";
      if (exact) show("ok", `To'g'ri! <b>${esc(it.e)}</b>`);
      else if (close) { const d = wordDiff(got, want); show("ok", `To'g'ri, faqat bitta harf xato: <div class="diff" style="font-size:18px">${d.want}</div>`); }
      else { const d = wordDiff(got, want); show("bad", `To'g'risi: <b>${esc(it.e)}</b>${d.want.includes('class="x"') ? `<div style="margin-top:8px">Qizil — xato yozilgan yoki tushib qolgan so'zlar:</div><div class="diff" style="font-size:18px">${d.want}</div>` : ""}${d.extra.length ? `<div>Ortiqcha: <s>${esc(d.extra.join(" "))}</s></div>` : ""}`); }
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check(); } });
    $("#chk").onclick = check;
    return;
  }
  const want = words(it.e), have = new Set(want.map(w => w.toLowerCase()));
  const tiles = shuffle(want.concat((it.x || []).filter(x => !have.has(x.toLowerCase()))));
  const picked = [];
  const draw = () => {
    $("#ans").innerHTML = picked.length ? picked.map((k, j) => `<button class="tile" data-j="${j}">${esc(tiles[k])}</button>`).join("") : `<span class="muted">So'zlarni bosing…</span>`;
    $("#bank").innerHTML = tiles.map((t, k) => `<button class="tile ${picked.includes(k) ? "used" : ""}" data-k="${k}">${esc(t)}</button>`).join("");
    $("#ans").querySelectorAll("[data-j]").forEach(b => b.onclick = () => { if (done) return; picked.splice(+b.dataset.j, 1); draw(); });
    $("#bank").querySelectorAll("[data-k]").forEach(b => b.onclick = () => { if (done || picked.includes(+b.dataset.k)) return; picked.push(+b.dataset.k); say(tiles[+b.dataset.k]); draw();
      if (picked.length === want.length) setTimeout(() => { if (!done && picked.length === want.length) $("#chk").onclick(); }, 350); });
    if (!done) { $("#chk").disabled = !picked.length; $("#clr").disabled = !picked.length; }
  };
  $("#clr").onclick = () => { if (done) return; picked.length = 0; draw(); };
  $("#chk").onclick = () => {
    if (done) return tuzNext();
    done = true;
    const ok = picked.map(k => tiles[k].toLowerCase()).join(" ") === want.join(" ").toLowerCase();
    tuzResult(it, ok);
    show(ok ? "ok" : "bad", (ok ? "To'g'ri! " : "To'g'risi: ") + `<b>${esc(it.e)}</b>`);
  };
  draw();
});
function tuzFinish() {
  if (T.tag) markDone(T.tag);
  const { right, total, wrong, title, key, back, tag } = T; T = null;
  if (key) { S.pat[key] = Math.max(S.pat[key] || 0, right); save(); }
  app.innerHTML = `<div class="stack"><div class="card" style="text-align:center"><p class="label">${esc(title)} · natija</p><div class="score">${right} / ${total}</div>
    <p class="muted">${wrong.length ? "Xato gaplarni yana bir marta tuzib ko'ring." : "Zo'r! Hamma gap birinchi urinishda to'g'ri."}</p></div>
    ${wrong.length ? `<div class="card"><p class="label">Xato qilingan gaplar</p><ul class="wl">${wrong.map(it => `<li><div class="h"><span class="w">${esc(it.e)}</span><button class="icon say" data-say="${esc(it.e)}">${ICON.vol}</button></div><div class="u">${esc(it.u)}</div><div class="e"><small>${esc(it.h)}</small></div></li>`).join("")}</ul></div>` : ""}
    <div class="card">${lessonBtn(tag)}${wrong.length ? `<button class="btn${LES && tag ? " ghost" : ""}" id="again">Xatolarni qayta tuzish</button><div style="height:10px"></div>` : ""}<button class="btn ghost" id="back">${backLabel(tag)}</button></div></div>`;
  bindSay(app); bindLesson();
  const a = $("#again"); if (a) a.onclick = () => { startTuz(wrong, title, null); T.back = back; };
  $("#back").onclick = () => { location.hash = back; };
}

/* ---------- SOZLAMA: export / import ---------- */
route(/^sozlama$/, () => {
  app.innerHTML = `${nav(`#`, `Bugun`, `Sozlamalar`)}
  <p class="sub">${cloud.status === "cloud" ? "Natijalar hisobingizda o'zi saqlanadi. Bu yerdagi kod — qo'shimcha zaxira: nusxalab qo'ying yoki boshqa joyga «Yuklash» orqali o'tkazing." : "Natijalar faqat shu brauzerda saqlanadi: brauzer tozalansa yoki telefon almashsa, yo'qoladi. Haftada bir zaxira faylini saqlang — boshqa qurilmada «Zaxiradan tiklash» orqali ochasiz."}</p>
  <div class="stack">${installCard(true)}${remCard()}${clsCard()}
  <div class="card"><p class="label">Zaxira · oxirgisi: ${bakWhen()}</p>
    <button class="btn" id="bk">${sv('<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>')} Zaxira faylini saqlash</button>
    <p class="gohint" style="text-align:left">Telefonda «Ulashish» oynasi ochiladi — Telegram «Saqlangan xabarlar»ga yuboring.</p><p class="muted" id="bkmsg" role="status"></p></div>
  <div class="card"><p class="label">Zaxiradan tiklash</p>
    <label class="btn ghost" for="bf">Faylni tanlash<input type="file" id="bf" class="vh" accept=".json,application/json,text/plain"></label>
    <p class="gohint" style="text-align:left">Hozirgi natijalar o'chmaydi: har so'z bo'yicha ko'proq ishlangani qoladi.</p><p class="muted" id="msg" role="status"></p></div>
  <details class="card"><summary class="label" style="cursor:pointer;margin:0">Kod orqali (eski usul)</summary><div style="height:12px"></div>
    <p class="label">Mening kodim</p><textarea id="ex" rows="4" readonly>${esc(btoa(unescape(encodeURIComponent(JSON.stringify(S)))))}</textarea>
    <div style="height:10px"></div><button class="btn ghost" id="cp">Nusxalash</button>
    <div style="height:16px"></div><p class="label">Boshqa qurilmadan kod</p><textarea id="im" rows="4" placeholder="Kodni shu yerga qo'ying"></textarea><div style="height:10px"></div><button class="btn ghost" id="ld">Yuklash</button></details>
  ${canSpeak() ? `<div class="card"><label class="sw"><span><b>Takrorlashda gapirish savollari</b><span class="muted">Ba'zan so'zni ovoz chiqarib aytasiz. Ofisda bo'lsangiz — «Yozib javob bering».</span></span><input type="checkbox" id="spk"${spkOn() ? " checked" : ""}></label></div>` : ""}
  ${canBuzz() ? `<div class="card"><label class="sw"><span><b>Javobda titrash</b><span class="muted">To'g'ri — bir marta, xato — ikki marta</span></span><input type="checkbox" id="vib"${buzzOn() ? " checked" : ""}></label></div>` : ""}</div>`;
  bindInstall(); bindRem(); bindCls();
  const sk = $("#spk"); if (sk) sk.onchange = () => { try { localStorage.setItem("ingliz-spk", sk.checked ? "1" : "0"); } catch (e) {} };
  const vb = $("#vib"); if (vb) vb.onchange = () => { try { localStorage.setItem("ingliz-vib", vb.checked ? "1" : "0"); } catch (e) {} buzz(true); };
  $("#cp").onclick = () => {
    const t = $("#ex"), b = $("#cp"); t.select(); persist();
    const ok = () => { bakMark(); b.textContent = "Nusxalandi ✓"; };
    const old = () => { let r = false; try { r = document.execCommand("copy"); } catch (e) {} if (r) ok(); else b.textContent = "Kodni belgilab, o'zingiz nusxalang"; };
    try { navigator.clipboard.writeText(t.value).then(ok, old); } catch (e) { old(); }
  };
  const done = add => { $("#msg").textContent = "Tiklandi ✓" + (add > 0 ? " · " + add + " ta yangi so'z natijasi qo'shildi" : " · natijalar birlashtirildi"); };
  $("#ld").onclick = () => { try { done(restoreBackup(readBackup($("#im").value))); } catch (e) { $("#msg").textContent = "Kod noto'g'ri. Qaytadan nusxalab ko'ring."; } };
  $("#bk").onclick = async () => { const b = $("#bk"); b.disabled = true; const r = await saveBackup(); b.disabled = false; $("#bkmsg").textContent = r === "fail" ? "Saqlab bo'lmadi. «Kod orqali» usulini ishlating." : r === "cancel" ? "" : "Saqlandi ✓"; };
  $("#bf").onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { done(restoreBackup(readBackup(t))); } catch (er) { $("#msg").textContent = "Bu fayl zaxira emas. «ingliz-zaxira-…json» faylini tanlang."; } }); e.target.value = ""; };
});

render();
initCloud();
if (isStandalone() && Object.keys(S.srs).length >= 10) persist();
})();
</script>
