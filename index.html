{"id": "paral", "t": "The Ships in the Desert", "u": "Cho'ldagi kemalar", "lv": "Pre-intermediate", "p": [[["Kamola had always wanted to photograph the old ships of Moynaq.", "Kamola doim Mo'ynoqning eski kemalarini suratga olishni orzu qilgan edi."], ["In October, she finally flew from Tashkent to Nukus with her camera and two lenses.", "Oktyabrda u nihoyat kamerasi va ikkita obyektivi bilan Toshkentdan Nukusga uchib bordi."], ["She planned to stay for three days and to spend most of the time outdoors.", "U uch kun qolishni va vaqtining ko'p qismini ochiq havoda o'tkazishni rejalashtirgan edi."], ["She didn't know yet that the most interesting part of her trip would happen indoors.", "U hali safarining eng qiziqarli qismi bino ichida bo'lishini bilmasdi."]], [["On the first day, a strong wind brought so much dust that she couldn't see the street.", "Birinchi kuni kuchli shamol shunchalik ko'p chang olib keldiki, u ko'chani ko'ra olmadi."], ["Her driver, a cheerful man called Polat, said the trip to Moynaq would have to wait.", "Uning haydovchisi, Po'lat ismli xushchaqchaq odam, Mo'ynoqqa safar kutib turishiga to'g'ri kelishini aytdi."], ["Instead, he suggested visiting the Savitsky Museum.", "Buning o'rniga u Savitskiy muzeyiga borishni taklif qildi."], ["Kamola agreed, although she wasn't very interested in museums.", "Kamola rozi bo'ldi, garchi muzeylarga unchalik qiziqmasa ham."]], [["The museum was full of paintings that had been hidden from the authorities in Soviet times.", "Muzey sovet davrida hukumatdan yashirilgan rasmlarga to'la edi."], ["A guide told her that Igor Savitsky had collected them when it was dangerous to own such art.", "Gid unga Igor Savitskiy bu rasmlarni bunday san'atni saqlash xavfli bo'lgan paytda yig'ganini aytdi."], ["He had brought thousands of works to Nukus, far away from Moscow.", "U minglab asarlarni Moskvadan uzoqdagi Nukusga olib kelgan ekan."], ["Kamola stayed there for four hours and forgot to take a single photo.", "Kamola u yerda to'rt soat qoldi va birorta ham surat olishni unutib qo'ydi."]], [["The next morning, the air was clear, and they drove north to Moynaq.", "Ertasi kuni ertalab havo musaffo edi va ular shimolga, Mo'ynoq tomon yo'l olishdi."], ["Polat explained that the town used to be a busy fishing port.", "Po'lat shahar ilgari gavjum baliqchilik porti bo'lganini tushuntirdi."], ["His grandfather had caught fish there when the sea was still at the edge of the town.", "Uning bobosi dengiz hali shahar chetida bo'lgan paytlarda u yerda baliq tutgan ekan."], ["Now the water was more than a hundred kilometres away.", "Endi suv yuz kilometrdan ham ko'proq uzoqda edi."]], [["The rusty ships stood in the sand like tired animals.", "Zanglagan kemalar qumda charchagan hayvonlardek turardi."], ["Kamola took hundreds of photos, but none of them felt quite right.", "Kamola yuzlab suratlar oldi, lekin ularning hech biri unga ko'ngildagidek tuyulmadi."], ["Then she noticed Polat standing quietly next to one of the boats.", "Keyin u Po'latning kemalardan birining yonida jimgina turganini payqadi."], ["She asked if she could photograph him, and he slowly nodded.", "U undan suratga olsam maylimi, deb so'radi, u esa sekin bosh irg'adi."]], [["Back in Tashkent, that picture became the centre of her first exhibition.", "Toshkentga qaytgach, o'sha surat uning birinchi ko'rgazmasining markaziga aylandi."], ["Visitors often asked whether the man was a fisherman.", "Tashrif buyuruvchilar ko'pincha bu odam baliqchimi, deb so'rashardi."], ["Kamola always answered that he was a driver, but his grandfather had been a fisherman.", "Kamola doim u haydovchi, baliqchi esa uning bobosi bo'lgan, deb javob berardi."], ["She sent Polat a printed copy, and he hung it in his car.", "U Po'latga bosma nusxasini yubordi, u esa uni mashinasiga osib qo'ydi."], ["He says tourists now ask about the photo before they ask about the price.", "Uning aytishicha, sayyohlar endi narxni so'rashdan oldin surat haqida so'rashadi."]]]},
{"id": "psteps", "t": "Ten Thousand Steps", "u": "O'n ming qadam", "lv": "Pre-intermediate", "p": [[["A few months ago, I noticed that my back hurt every evening.", "Bir necha oy oldin har kuni kechqurun belim og'riyotganini sezdim."], ["Most days, I sit for nine or ten hours without moving much.", "Ko'p kunlari to'qqiz-o'n soat deyarli qimirlamay o'tiraman."], ["My phone told me that I had walked only eight hundred steps on a normal Tuesday.", "Telefonim oddiy bir seshanba kuni bor-yo'g'i sakkiz yuz qadam yurganimni ko'rsatdi."], ["Even my grandmother walks more than that.", "Hatto buvim ham bundan ko'proq yuradi."]], [["My cousin Jasur suggested a challenge for the whole family.", "Amakivachcham Jasur butun oila uchun bir musobaqa taklif qildi."], ["For thirty days, everyone had to walk at least ten thousand steps a day.", "O'ttiz kun davomida har kim kuniga kamida o'n ming qadam yurishi kerak edi."], ["Whoever had the lowest total at the end would buy plov for everyone.", "Oxirida eng kam natija ko'rsatgan kishi hammaga osh olib berishi kerak edi."], ["I agreed immediately, because I hate paying for plov even more than I hate walking.", "Men darhol rozi bo'ldim, chunki osh uchun pul to'lashni yurishdan ham ko'proq yomon ko'raman."]], [["The first week was much harder than I had expected.", "Birinchi hafta men kutganimdan ancha qiyin bo'ldi."], ["I started getting off the metro one station early and walking the rest of the way.", "Metrodan bir bekat oldin tushib, qolgan yo'lni piyoda yura boshladim."], ["I took the stairs instead of the lift and had my phone calls while walking around the yard.", "Lift o'rniga zinadan chiqdim va telefonda hovli bo'ylab yurib gaplashdim."], ["By Friday, my legs were tired, but my back felt a little better.", "Jumaga kelib oyoqlarim charchagan edi, lekin belim biroz yengillashgandek edi."]], [["In the second week, something strange happened in our family chat.", "Ikkinchi haftada oilaviy chatimizda g'alati narsa yuz berdi."], ["Jasur was suddenly walking twenty-five thousand steps a day.", "Jasur birdaniga kuniga yigirma besh ming qadam yura boshladi."], ["We were all impressed until someone saw him sitting in a café with his phone in his hand.", "Kimdir uni qo'lida telefon bilan kafeda o'tirganini ko'rmaguncha hammamiz hayratda edik."], ["He was shaking it under the table to add steps.", "U qadam qo'shish uchun telefonni stol ostida silkitayotgan ekan."], ["The family decided that he would buy the plov, whatever his total was.", "Oila natijasi qanday bo'lishidan qat'i nazar, oshni u olib berishiga qaror qildi."]], [["After that, the challenge became more honest and much more fun.", "Shundan keyin musobaqa halolroq va ancha qiziqroq bo'ldi."], ["We started walking together in the evenings along the Ankhor canal.", "Kechqurunlari Anhor kanali bo'ylab birga sayr qila boshladik."], ["Some of our best family conversations happened during those walks, not at the dinner table.", "Eng yaxshi oilaviy suhbatlarimizning ba'zilari dasturxon atrofida emas, aynan o'sha sayrlarda bo'ldi."], ["I also noticed that I was sleeping better and drinking less coffee.", "Shuningdek, yaxshiroq uxlayotganimni va kamroq qahva ichayotganimni sezdim."]], [["The thirty days ended a long time ago, but I still walk every day.", "O'ttiz kun allaqachon tugagan, lekin men hali ham har kuni yuraman."], ["My back hasn't hurt for weeks, and I've lost four kilos without really trying.", "Belim bir necha haftadan beri og'rimayapti va unchalik urinmasdan to'rt kilo ozdim."], ["If I had known it was so simple, I would have started years ago.", "Agar bu shunchalik oddiy ekanini bilganimda, yillar oldin boshlagan bo'lardim."], ["As for Jasur, he paid for the plov and now walks with his phone in his pocket.", "Jasurga kelsak, u osh pulini to'ladi va endi telefonini cho'ntagiga solib yuradi."]]]},
{"id": "phashar", "t": "The Saturday Hashar", "u": "Shanbalik hashar", "lv": "Pre-intermediate", "p": [[["Every spring, the people of Bog'ishamol mahalla organise a hashar to clean their streets.", "Har bahor Bog'ishamol mahallasi aholisi ko'chalarini tozalash uchun hashar uyushtiradi."], ["This year, the chairman, Karim aka, had a bigger plan.", "Bu yil mahalla raisi Karim akaning kattaroq rejasi bor edi."], ["He wanted to plant fifty young trees along the main street, which had become hot and dusty.", "U issiq va changli bo'lib qolgan bosh ko'cha bo'ylab ellikta yosh daraxt ekmoqchi edi."], ["He announced it at the mosque, in the mahalla chat and on a sheet of paper on every gate.", "U buni masjidda, mahalla chatida va har bir darvozaga yopishtirilgan qog'ozda e'lon qildi."]], [["On Saturday morning, almost everyone came out with shovels, buckets and brooms.", "Shanba kuni ertalab deyarli hamma belkurak, chelak va supurgi bilan chiqdi."], ["The children were given the job of carrying water, which they did with a lot of noise.", "Bolalarga suv tashish vazifasi berildi, ular buni katta shovqin bilan bajarishdi."], ["The women set up a huge kazan in the school yard.", "Ayollar maktab hovlisida ulkan qozon o'rnatishdi."], ["Only one person didn't come out: Botir aka from house number nine.", "Faqat bir kishi chiqmadi: to'qqizinchi uydagi Botir aka."]], [["Botir aka was known for complaining about everything.", "Botir aka hamma narsadan shikoyat qilishi bilan tanilgan edi."], ["He had told Karim aka that trees would only bring leaves, birds and extra work.", "U Karim akaga daraxtlar faqat barg, qush va ortiqcha ish olib keladi, degan edi."], ["When the volunteers reached his gate, he came out and refused to let them dig there.", "Ko'ngillilar uning darvozasiga yetib kelganda, u chiqib, u yerni qazishlariga ruxsat bermadi."], ["\"Plant your trees somewhere else,\" he said, and he shut the gate loudly.", "«Daraxtlaringizni boshqa joyga eking», dedi u va darvozani qarsillatib yopdi."]], [["Karim aka didn't argue with him.", "Karim aka u bilan bahslashmadi."], ["Instead, he planted two extra trees in front of the house opposite.", "Buning o'rniga u qarshidagi uy oldiga ikkita qo'shimcha daraxt ekdi."], ["By lunchtime, the street looked completely different, and everyone was hungry.", "Tushlikka kelib ko'cha butunlay boshqacha ko'rinardi va hamma och edi."], ["The plov was served on long tables, and the smell reached every house in the mahalla.", "Palov uzun stollarda tortildi va uning hidi mahalladagi har bir uyga yetib bordi."]], [["It even reached house number nine.", "U hatto to'qqizinchi uyga ham yetib bordi."], ["After about ten minutes, the gate opened slowly, and Botir aka appeared with an empty plate.", "Taxminan o'n daqiqadan keyin darvoza sekin ochildi va bo'sh likopcha ko'targan Botir aka paydo bo'ldi."], ["Nobody said anything, and Karim aka simply filled his plate.", "Hech kim hech narsa demadi, Karim aka esa shunchaki uning likopchasini to'ldirdi."], ["Botir aka sat at the end of the table and ate in silence.", "Botir aka stolning oxiriga o'tirdi va jimgina ovqatlandi."]], [["That summer was one of the hottest in years.", "O'sha yoz so'nggi yillardagi eng issiq yozlardan biri bo'ldi."], ["Every afternoon, the neighbours sat in the shade of the young trees and drank tea.", "Har kuni tushdan keyin qo'shnilar yosh daraxtlar soyasida o'tirib choy ichishardi."], ["The only sunny spot on the whole street was in front of house number nine.", "Butun ko'chadagi yagona quyoshli joy to'qqizinchi uy oldida edi."], ["In September, Botir aka knocked on Karim aka's door and asked, a little embarrassed, if any trees were left.", "Sentabrda Botir aka Karim akaning eshigini taqillatdi va biroz uyalib, daraxt qolmadimi, deb so'radi."], ["Karim aka smiled, because he had kept one in his garden just for him.", "Karim aka jilmaydi, chunki u bitta daraxtni aynan uning uchun bog'ida saqlab qo'ygan edi."]]]},
{"id": "pstars", "t": "The Boy Who Saved the Stars", "u": "Yulduzlarni saqlab qolgan bola", "lv": "Pre-intermediate", "p": [[["About six hundred years ago, a clever boy named Ali grew up in Samarkand.", "Taxminan olti yuz yil oldin Samarqandda Ali ismli zukko bir bola voyaga yetdi."], ["His father looked after the falcons of the ruler, Ulugh Beg.", "Uning otasi hukmdor Ulug'bekning lochinlariga qarardi."], ["Ulugh Beg was the grandson of Amir Temur, but unlike his famous grandfather, he preferred books to wars.", "Ulug'bek Amir Temurning nabirasi edi, lekin mashhur bobosidan farqli o'laroq, u urushdan ko'ra kitobni afzal ko'rardi."], ["He loved mathematics, and above all, he loved the stars.", "U matematikani yaxshi ko'rardi, hammasidan ham ko'proq esa yulduzlarni sevardi."]], [["When Ali was older, he became a student at the madrasa that Ulugh Beg had built on the Registan.", "Ali ulg'aygach, Ulug'bek Registonda qurdirgan madrasaga talaba bo'ldi."], ["Sometimes the ruler himself came into the classroom and gave lessons.", "Ba'zan hukmdorning o'zi sinfga kirib, dars berardi."], ["The students were surprised that a king could explain difficult problems so patiently.", "Talabalar podshohning qiyin masalalarni bunchalik sabr bilan tushuntira olishidan hayratlanishardi."], ["Ali worked so hard that Ulugh Beg soon noticed him.", "Ali shunchalik qattiq mehnat qildiki, Ulug'bek tez orada uni payqadi."]], [["At that time, a huge observatory was being built on a hill outside the city.", "O'sha paytda shahar tashqarisidagi tepalikda ulkan rasadxona qurilayotgan edi."], ["Its main instrument was a giant curved wall, which was used to measure the positions of the stars.", "Uning asosiy asbobi yulduzlarning o'rnini o'lchash uchun ishlatiladigan ulkan egri devor edi."], ["Ali spent many cold nights there, writing down numbers while the others watched the sky.", "Ali u yerda ko'plab sovuq tunlarni o'tkazdi, boshqalar osmonni kuzatayotganda u raqamlarni yozib bordi."], ["Year after year, they measured the length of the year and the positions of more than a thousand stars.", "Yildan-yilga ular yilning uzunligini va mingdan ortiq yulduzning o'rnini o'lchashdi."], ["Their results were more accurate than almost anything else in the world at that time.", "Ularning natijalari o'sha davrda dunyodagi deyarli har qanday boshqa natijadan aniqroq edi."]], [["But not everyone in Samarkand liked a ruler who spent his nights looking at the sky.", "Lekin Samarqanddagi hamma ham tunlarini osmonga qarab o'tkazadigan hukmdorni yoqtirmasdi."], ["Some powerful people believed he should pay more attention to politics.", "Ba'zi nufuzli odamlar u siyosatga ko'proq e'tibor berishi kerak, deb hisoblashardi."], ["In 1449, Ulugh Beg was killed after his own son had turned against him.", "1449-yilda Ulug'bek o'z o'g'li unga qarshi chiqqanidan keyin o'ldirildi."], ["Soon afterwards, the observatory was destroyed, and its stones were taken away.", "Ko'p o'tmay rasadxona vayron qilindi va uning toshlari olib ketildi."]], [["Ali knew that the work of many years could easily be lost.", "Ali ko'p yillik mehnat osongina yo'qolib ketishi mumkinligini bilardi."], ["He took the star tables with him and left Samarkand.", "U yulduz jadvallarini o'zi bilan olib, Samarqanddan ketdi."], ["Many years later, he settled in Istanbul, where he taught mathematics and astronomy.", "Ko'p yillar o'tib u Istanbulda qo'nim topdi va u yerda matematika hamda astronomiyadan dars berdi."], ["Thanks to him, Ulugh Beg's tables were copied and studied by scholars in many countries.", "Uning sharofati bilan Ulug'bekning jadvallari ko'chirildi va ko'plab mamlakatlar olimlari tomonidan o'rganildi."]], [["For centuries, nobody knew exactly where the observatory had stood.", "Asrlar davomida rasadxona aniq qayerda turganini hech kim bilmasdi."], ["Then, in 1908, an archaeologist named Vyatkin found its remains after studying old documents.", "Keyin, 1908-yilda Vyatkin ismli arxeolog eski hujjatlarni o'rganib, uning qoldiqlarini topdi."], ["Today, visitors to Samarkand can walk down into the part of the great wall that has survived.", "Bugun Samarqandga kelganlar buyuk devorning saqlanib qolgan qismiga tushib ko'rishlari mumkin."], ["Few of them know about the boy who saved the numbers.", "Ulardan kamchiligi raqamlarni saqlab qolgan o'sha bola haqida biladi."], ["History remembers him as Ali Qushchi, the falconer's son, and the stars he measured are still in the sky.", "Tarix uni lochinchining o'g'li Ali Qushchi nomi bilan eslaydi, u o'lchagan yulduzlar esa hamon osmonda."]]]},
{"id": "pseoul", "t": "A Talk Without Slides", "u": "Slaydsiz nutq", "lv": "Pre-intermediate", "p": [[["Gulnoza worked as a scientist at a small farming institute in Tashkent.", "Gulnoza Toshkentdagi kichik bir qishloq xo'jaligi institutida olima bo'lib ishlardi."], ["In the spring, she was invited to speak at a farming conference in Seoul.", "Bahorda uni Seuldagi qishloq xo'jaligi konferensiyasida nutq so'zlashga taklif qilishdi."], ["It was her first trip abroad and her first time on a big stage.", "Bu uning chet elga birinchi safari va katta sahnaga birinchi marta chiqishi edi."], ["She prepared forty slides and practised her talk every evening for a month.", "U qirqta slayd tayyorladi va bir oy davomida har kuni kechqurun nutqini mashq qildi."]], [["Seoul was faster and brighter than anything she had seen before.", "Seul u ilgari ko'rgan hamma narsadan tezroq va yorqinroq edi."], ["The metro was so clean that she was afraid to put her bag on the floor.", "Metro shunchalik toza ediki, u sumkasini yerga qo'yishga qo'rqdi."], ["She used a translation app to order food, and once it turned \"not spicy, please\" into something very strange.", "U ovqat buyurtma qilish uchun tarjima ilovasidan foydalandi, bir safar esa ilova «achchiq bo'lmasin, iltimos» degan gapni juda g'alati narsaga aylantirib yubordi."], ["The waiter laughed and then brought her the spiciest soup in the restaurant.", "Ofitsiant kulib yubordi va keyin unga restorandagi eng achchiq sho'rvani olib keldi."]], [["On the day of the conference, she arrived an hour early to test her laptop.", "Konferensiya kuni u noutbukini sinab ko'rish uchun bir soat erta keldi."], ["Everything worked perfectly during the test.", "Sinov paytida hammasi a'lo darajada ishladi."], ["But when she went on stage, the screen behind her stayed completely black.", "Lekin u sahnaga chiqqanida, orqasidagi ekran butunlay qora bo'lib qoldi."], ["The technicians ran around pressing buttons, while three hundred people waited in silence.", "Uch yuz kishi jimgina kutib turganda, texniklar tugmalarni bosib u yoqdan bu yoqqa yugurishdi."], ["After five minutes, one of them told her that the problem couldn't be fixed quickly.", "Besh daqiqadan keyin ulardan biri muammoni tez tuzatib bo'lmasligini aytdi."]], [["Gulnoza's hands were shaking, and her mind went completely empty.", "Gulnozaning qo'llari titrar, xayoli esa butunlay bo'shab qolgan edi."], ["Then she remembered something her grandmother used to say: a good story doesn't need pictures.", "Keyin buvisi ko'p aytadigan bir gapni esladi: yaxshi hikoyaga rasm kerak emas."], ["She put down the remote, stepped to the front of the stage and started talking.", "U pultni qo'ydi, sahnaning old qismiga chiqdi va gapira boshladi."], ["She described the farmers she had visited in Samarkand and the mistakes her team had made.", "U Samarqandda borib ko'rgan fermerlari va jamoasi yo'l qo'ygan xatolar haqida so'zlab berdi."]], [["She told them about an old farmer who had read their instructions upside down for a week.", "U bir hafta davomida ularning yo'riqnomasini teskari ushlab o'qigan keksa fermer haqida gapirib berdi."], ["The audience laughed, and then they listened more and more carefully.", "Tomoshabinlar kulishdi, keyin esa tobora diqqat bilan tinglay boshlashdi."], ["Without her slides, she couldn't hide behind charts, so she spoke directly to the people in front of her.", "Slaydlari bo'lmagani uchun u diagrammalar ortiga yashirina olmasdi, shuning uchun to'g'ridan-to'g'ri qarshisidagi odamlarga gapirdi."], ["When she finished, the applause lasted much longer than she had expected.", "U tugatganida qarsaklar u kutganidan ancha uzoq davom etdi."]], [["Afterwards, several people came up to ask questions and exchange contacts.", "Keyin bir necha kishi savol berish va kontakt almashish uchun uning oldiga keldi."], ["One of the organisers told her that it had been the most honest talk of the day.", "Tashkilotchilardan biri unga bu kunning eng samimiy nutqi bo'lganini aytdi."], ["He also invited her to come back and speak again next year.", "U uni kelgusi yili yana kelib nutq so'zlashga ham taklif qildi."], ["Gulnoza said she would love to, but she might bring printed slides, just in case.", "Gulnoza bajonidil kelishini, lekin har ehtimolga qarshi bosma slaydlar olib kelishi mumkinligini aytdi."]]]},
{"id": "iclient", "t": "I'll Pay at the End", "u": "Oxirida to'layman", "lv": "Intermediate", "p": [[["Jamshid had been working as a freelance photographer for almost two years.", "Jamshid qariyb ikki yildan beri frilans fotograf bo'lib ishlayotgan edi."], ["Most of his clients were small shops and cafes in Tashkent.", "Mijozlarining aksariyati Toshkentdagi kichik do'konlar va kafelar edi."], ["So when a man named Kamron offered him a really big project, he was delighted.", "Shuning uchun Kamron ismli bir kishi unga juda katta loyiha taklif qilganida, u qattiq xursand bo'ldi."], ["Kamron wanted new photos of every dish for the menus and the website of his chain of restaurants.", "Kamron o'z restoranlar tarmog'ining menyulari va veb-sayti uchun har bir taomning yangi suratlarini istardi."], ["The price was more than Jamshid usually earned in three months.", "Narx Jamshid odatda uch oyda topadigan puldan ham ko'p edi."]], [["Kamron was charming and full of compliments.", "Kamron xushmuomala edi va maqtovni ayamasdi."], ["He said he had seen Jamshid's portfolio and that only he could do the job.", "U Jamshidning portfoliosini ko'rganini va bu ishni faqat u uddalay olishini aytdi."], ["When Jamshid asked for an advance, Kamron just laughed.", "Jamshid oldindan to'lov so'raganda, Kamron shunchaki kulib qo'ydi."], ["\"We're friends now, brother. I'll pay everything at the end.\"", "«Endi biz do'stmiz, uka. Hammasini oxirida to'layman.»"], ["Against his better judgement, Jamshid agreed and started working the same night.", "Ichki ovozi qarshi bo'lsa ham, Jamshid rozi bo'ldi va o'sha kechasiyoq ishga kirishdi."]], [["For six weeks, he worked late almost every evening.", "Olti hafta davomida u deyarli har kuni kechgacha ishladi."], ["Kamron kept asking for changes: brighter light, a different background, another angle.", "Kamron tinmay o'zgartirish so'rardi: yorug'roq nur, boshqacha fon, yana boshqa rakurs."], ["Each time, he promised that this was the final version.", "Har safar bu oxirgi variant ekanini va'da qilardi."], ["Finally, Jamshid sent all the photos together with the invoice.", "Nihoyat, Jamshid barcha suratlarni hisob-faktura bilan birga yubordi."], ["The next day, Kamron stopped answering his messages.", "Ertasi kuni Kamron uning xabarlariga javob berishni to'xtatdi."]], [["At first, Jamshid thought he was just busy.", "Avvaliga Jamshid u shunchaki band bo'lsa kerak, deb o'yladi."], ["After a week, he noticed that his photos were already on Kamron's Instagram page.", "Bir haftadan keyin u o'zi olgan suratlar allaqachon Kamronning Instagram sahifasida turganini payqadi."], ["The new menu with his pictures was being used in all three restaurants.", "Uning suratlari tushirilgan yangi menyu uchala restoranda ham ishlatilayotgan edi."], ["Jamshid was so angry that he couldn't sleep.", "Jamshidning jahli chiqqanidan uyqusi qochdi."], ["His older sister, a lawyer, told him to calm down and save every message.", "Huquqshunos opasi unga tinchlanib, har bir xabarni saqlab qo'yishni maslahat berdi."]], [["Together, they wrote a polite but very clear letter.", "Ular birgalikda xushmuomala, lekin juda aniq xat yozishdi."], ["It said that the photos still belonged to Jamshid until they were paid for.", "Unda to'lov qilinmaguncha suratlar Jamshidga tegishli ekani aytilgan edi."], ["If the money didn't arrive within ten days, the case would go to court.", "Pul o'n kun ichida kelmasa, masala sudga oshirilishi ham yozilgan edi."], ["His sister also sent a copy to the restaurants' official email address.", "Opasi xatning nusxasini restoranlarning rasmiy elektron pochtasiga ham yubordi."], ["Three days later, the full amount appeared in Jamshid's account.", "Uch kundan keyin to'liq summa Jamshidning hisobiga tushdi."]], [["There was no apology, just a short message: \"Sorry, I was travelling.\"", "Hech qanday uzr bo'lmadi, faqat qisqa xabar keldi: «Kechir, safarda edim.»"], ["Jamshid didn't reply.", "Jamshid javob bermadi."], ["Now he uses a simple contract and asks every new client for fifty per cent in advance.", "Endi u oddiy shartnoma tuzadi va har bir yangi mijozdan ellik foiz oldindan to'lov so'raydi."], ["Some clients leave when they hear this, and he lets them go.", "Ba'zi mijozlar buni eshitib ketib qolishadi, u esa ularni ushlab qolmaydi."], ["He has learned that the friendliest clients are not always the best ones.", "U eng xushmuomala mijozlar har doim ham eng yaxshilari emasligini o'rganib oldi."]]]},
{"id": "idubai", "t": "The Champion in the Park", "u": "Bog'dagi chempion", "lv": "Intermediate", "p": [[["Last spring, I decided to learn chess properly.", "O'tgan bahorda shaxmatni jiddiy o'rganishga qaror qildim."], ["I had played a little as a child, but I always lost to my older brother.", "Bolaligimda ozroq o'ynaganman, lekin akamga doim yutqazardim."], ["This time, I watched videos online and practised against an app every evening.", "Bu safar internetda videolar ko'rib, har kuni kechqurun ilovaga qarshi mashq qildim."], ["After two months, I could beat the app on its easiest level.", "Ikki oydan keyin ilovani eng oson darajada yuta oladigan bo'ldim."], ["I felt ready to play against real people.", "Haqiqiy odamlarga qarshi o'ynashga tayyordek his qildim."]], [["Near our house, there is a small park where old men play chess every afternoon.", "Uyimiz yaqinida keksa kishilar har kuni tushdan keyin shaxmat o'ynaydigan kichkina bog' bor."], ["They sit at stone tables under the plane trees and argue loudly about every move.", "Ular chinorlar ostidagi tosh stollarda o'tirib, har bir yurish haqida baland ovozda bahslashishadi."], ["On a Saturday in May, I finally found the courage to join them.", "May oyidagi bir shanba kuni nihoyat ularga qo'shilishga jur'at topdim."], ["Most of them ignored me, but one quiet man in a grey cap invited me to sit down.", "Ularning ko'pchiligi menga e'tibor bermadi, lekin kulrang kepkali bir kamgap kishi meni o'tirishga taklif qildi."], ["He introduced himself as Rustam aka and set up the pieces without a word.", "U o'zini Rustam aka deb tanishtirdi va indamay donalarni terib chiqdi."]], [["I lost the first game in less than ten minutes.", "Birinchi o'yinni o'n daqiqaga yetmay yutqazdim."], ["I lost the second one even faster, because I was trying too hard.", "Ikkinchisini esa haddan tashqari tirishganim uchun undan ham tezroq boy berdim."], ["Rustam aka didn't laugh at me, but he didn't let me win either.", "Rustam aka ustimdan kulmadi, lekin menga yutib berishga ham yo'l qo'ymadi."], ["After each game, he showed me exactly where I had made my mistake.", "Har bir o'yindan keyin u qayerda xato qilganimni aniq ko'rsatib berardi."], ["\"You look at your own pieces too much,\" he said. \"Look at mine.\"", "«Sen o'z donalaringga juda ko'p qarayapsan, — dedi u. — Menikilariga qara.»"]], [["I started coming to the park every Saturday and Sunday.", "Bog'ga har shanba va yakshanba kela boshladim."], ["Rustam aka never talked about himself, only about chess and his grandchildren.", "Rustam aka hech qachon o'zi haqida gapirmasdi, faqat shaxmat va nevaralari haqida so'zlardi."], ["The other old men treated him with a respect that I didn't understand at first.", "Boshqa keksalar unga men avvaliga tushunmagan alohida hurmat bilan munosabatda bo'lishardi."], ["Whenever there was an argument about a move, they always asked for his opinion.", "Biror yurish haqida bahs chiqsa, ular doim uning fikrini so'rashardi."], ["By the end of the summer, I could sometimes play forty moves before I lost.", "Yoz oxiriga kelib ba'zan yutqazishdan oldin qirq yurishgacha o'ynay oladigan bo'ldim."]], [["In September, I went to the chess club in the city centre to play in my first real tournament.", "Sentabrda birinchi haqiqiy turnirimda o'ynash uchun shahar markazidagi shaxmat klubiga bordim."], ["On the wall near the entrance, there was a row of old black-and-white photographs.", "Kirish yonidagi devorda bir qator eski oq-qora suratlar osilib turardi."], ["One of them showed a young man holding a large cup, with a familiar serious face.", "Ulardan birida qo'lida katta kubok ushlagan, tanish jiddiy yuzli yigit tasvirlangan edi."], ["Under the photo were the words \"Champion of Uzbekistan, 1979\".", "Surat ostida «O'zbekiston chempioni, 1979-yil» degan yozuv bor edi."], ["It was Rustam aka, more than forty years younger.", "Bu Rustam aka edi, faqat qirq yildan ham ko'proq yosh."]], [["I didn't win the tournament, but I won three games out of seven.", "Turnirda g'olib bo'lmadim, lekin yetti o'yindan uchtasida yutdim."], ["The next Saturday, I asked Rustam aka why he had never told me.", "Keyingi shanba Rustam akadan nega bu haqda menga hech qachon aytmaganini so'radim."], ["He shrugged and said that a cup on a wall doesn't play chess.", "U yelka qisdi va devordagi kubok shaxmat o'ynamasligini aytdi."], ["Then he set up the pieces, as he always did, and pushed the first pawn forward.", "Keyin odatdagidek donalarni terdi va birinchi piyodani oldinga surdi."], ["I still haven't beaten him, but I'm getting closer every week.", "Hali ham uni yuta olganim yo'q, lekin har hafta bunga yaqinlashib boryapman."]]]},
{"id": "iwallet", "t": "Found on the Metro", "u": "Metroda topilgan hamyon", "lv": "Intermediate", "p": [[["Last Thursday, I was in a terrible hurry to get to my English class.", "O'tgan payshanba kuni ingliz tili darsimga juda shoshib ketayotgan edim."], ["The lesson started at nine, and our teacher doesn't let late students in.", "Dars soat to'qqizda boshlanardi, o'qituvchimiz esa kechikkan o'quvchilarni kiritmaydi."], ["I ran down the stairs at Novza station and jumped onto the train just before the doors closed.", "Novza bekatining zinalaridan yugurib tushib, eshiklar yopilishidan sal oldin poyezdga sakrab chiqdim."], ["At Mustaqillik Maydoni, I got off and rushed to the language centre.", "Mustaqillik maydoni bekatida tushib, o'quv markaziga shoshildim."], ["It wasn't until lunchtime that I realised my wallet was missing.", "Faqat tushlik paytida hamyonim yo'qligini angladim."]], [["Inside were my ID card, two bank cards and about three hundred thousand sum.", "Ichida ID-kartam, ikkita bank kartam va uch yuz ming so'mga yaqin pul bor edi."], ["There was also a small photo of my grandfather that I had carried for years.", "Yillar davomida olib yurgan bobomning kichkina surati ham bor edi."], ["I blocked the cards in the app within two minutes.", "Ilova orqali kartalarni ikki daqiqada blokladim."], ["As someone who often loses things, I was secretly pleased that it was so easy.", "Tez-tez narsalarini yo'qotib qo'yadigan odam sifatida bu ishning shunchalik osonligidan ichimda mamnun bo'ldim."], ["But nothing could replace the photo, and that made me feel sick.", "Lekin suratning o'rnini hech narsa bosa olmasdi va bu ko'nglimni g'ash qildi."]], [["In the evening, I went back to the metro and spoke to a police officer at the station.", "Kechqurun metroga qaytib, bekatdagi politsiya xodimi bilan gaplashdim."], ["He wrote down my details, but he didn't look very hopeful.", "U ma'lumotlarimni yozib oldi, lekin unchalik umidvor ko'rinmadi."], ["\"People find wallets, but they don't often bring them back,\" he said.", "«Odamlar hamyon topishadi, lekin kamdan-kam qaytarib olib kelishadi», — dedi u."], ["I walked home slowly, trying to remember every moment of the morning.", "Ertalabki har bir lahzani eslashga urinib, uyga sekin yurib bordim."], ["My mother said I should simply stop running everywhere.", "Onam menga shunchaki hamma joyga yugurishni bas qilishim kerakligini aytdi."]], [["Two days later, I got a call from an unknown number.", "Ikki kundan keyin notanish raqamdan qo'ng'iroq bo'ldi."], ["A woman asked whether I had lost a wallet.", "Bir ayol hamyon yo'qotmadingizmi, deb so'radi."], ["She explained that her son had found it under a seat on the train.", "U o'g'li hamyonni poyezddagi o'rindiq tagidan topganini tushuntirdi."], ["They had found my number on a business card inside.", "Raqamimni ichidagi tashrif qog'ozidan topishgan ekan."], ["She invited me to come and collect it that evening.", "U o'sha kuni kechqurun kelib olib ketishimni so'radi."]], [["They lived in a small flat in Chilonzor, on the fourth floor.", "Ular Chilonzordagi kichik xonadonda, to'rtinchi qavatda yashashardi."], ["Her son, Sanjar, was about fourteen and very shy.", "O'g'li Sanjar o'n to'rt yoshlarda bo'lib, juda uyatchan edi."], ["He handed me the wallet, and everything was still inside, even the money.", "U menga hamyonni uzatdi, ichidagi hamma narsa, hatto pul ham joyida edi."], ["I tried to give him a reward, but his mother politely refused.", "Unga mukofot bermoqchi bo'ldim, lekin onasi muloyimlik bilan rad etdi."], ["\"He only did what anyone should do,\" she said.", "«U har kim qilishi kerak bo'lgan ishni qildi, xolos», — dedi u."]], [["Then I noticed a drawing pad on the table, full of sketches of cars and buildings.", "Keyin stol ustida mashina va binolar eskizlariga to'la chizma daftarni ko'rib qoldim."], ["It turned out that Sanjar dreamed of becoming an architect.", "Ma'lum bo'lishicha, Sanjar me'mor bo'lishni orzu qilarkan."], ["So instead of money, I offered him something else: a day with my uncle, who is an architect.", "Shuning uchun pul o'rniga unga boshqa narsa taklif qildim: me'mor bo'lib ishlaydigan amakim bilan bir kun o'tkazish."], ["Next month, he is coming to see how real buildings are planned.", "Kelasi oy u haqiqiy binolar qanday loyihalanishini ko'rgani keladi."], ["And I have started keeping my grandfather's photo in a safer place.", "Men esa bobomning suratini xavfsizroq joyda saqlaydigan bo'ldim."]]]},
{"id": "isamsa", "t": "A Fair Price", "u": "Adolatli narx", "lv": "Intermediate", "p": [[["Dilnoza opa had made the best samsa in her mahalla for twenty years.", "Dilnoza opa yigirma yildan beri mahallasidagi eng mazali somsani pishirib kelardi."], ["Her neighbours always said she should sell them, and she always laughed.", "Qo'shnilari doim ularni sotishi kerakligini aytishardi, u esa doim kulib qo'yardi."], ["Then, last autumn, her husband's salary was cut, and the family needed extra money.", "Keyin o'tgan kuzda erining maoshi qisqardi va oilaga qo'shimcha pul kerak bo'lib qoldi."], ["So she decided to give it a try.", "Shunday qilib, u bir sinab ko'rishga qaror qildi."], ["Her son Sardor set up a Telegram channel for her in one evening.", "O'g'li Sardor bir kechadayoq unga Telegram kanal ochib berdi."]], [["The first week was a huge success.", "Birinchi hafta katta muvaffaqiyat bo'ldi."], ["Orders came from offices, schools and even a nearby hospital.", "Buyurtmalar ofislardan, maktablardan va hatto yaqindagi kasalxonadan ham kelardi."], ["Dilnoza got up at five every morning to prepare the dough.", "Dilnoza har kuni ertalab soat beshda turib xamir qorardi."], ["She sold each samsa for four thousand sum, the same price as the shop at the bazaar.", "U har bir somsani bozordagi do'kondagi narxda, to'rt ming so'mdan sotardi."], ["By Friday, she was exhausted but very proud of herself.", "Jumaga kelib u holdan toygan, lekin o'zidan juda faxrlanardi."]], [["At the end of the month, Sardor asked to see her notebook.", "Oy oxirida Sardor uning daftarini ko'rishni so'radi."], ["He was studying economics, and he had a bad feeling about the numbers.", "U iqtisodiyotni o'rganardi va raqamlardan ko'ngli g'ash edi."], ["He added up the cost of meat, flour, gas and delivery.", "U go'sht, un, gaz va yetkazib berish xarajatlarini qo'shib chiqdi."], ["Then he looked up at his mother with a serious face.", "Keyin jiddiy qiyofada onasiga qaradi."], ["\"Mum, you've been paying people to eat your samsa,\" he said.", "«Oyi, siz odamlarga somsangizni yeganlari uchun pul to'lab kelyapsiz», — dedi u."]], [["It turned out that each samsa cost her almost four and a half thousand to make.", "Ma'lum bo'lishicha, har bir somsa unga deyarli to'rt yarim mingga tushar ekan."], ["The shop at the bazaar used less meat and much more onion.", "Bozordagi do'kon esa kamroq go'sht va ancha ko'p piyoz ishlatarkan."], ["Dilnoza refused to change her recipe.", "Dilnoza retseptini o'zgartirishdan bosh tortdi."], ["But she was afraid that if she raised the price, everyone would leave.", "Lekin narxni oshirsa, hamma ketib qolishidan qo'rqardi."], ["They argued about it for two whole evenings.", "Ular bu haqda ikki kecha bo'yi bahslashishdi."]], [["In the end, Sardor suggested an experiment.", "Oxiri Sardor bir tajriba o'tkazishni taklif qildi."], ["They would raise the price to six thousand and explain why in the channel.", "Ular narxni olti mingga ko'tarib, sababini kanalda tushuntirib berishadi."], ["Dilnoza wrote a short, honest message about real meat and real butter.", "Dilnoza haqiqiy go'sht va haqiqiy sariyog' haqida qisqa, samimiy xabar yozdi."], ["She sent it and then couldn't look at her phone for an hour.", "U xabarni yubordi va keyin bir soat davomida telefoniga qaray olmadi."], ["When she finally did, she found more orders than ever before.", "Nihoyat qaraganida, avvalgidan ham ko'proq buyurtma kelganini ko'rdi."]], [["Only two customers complained, and one of them came back a week later.", "Faqat ikki mijoz norozi bo'ldi, ulardan biri ham bir haftadan keyin qaytib keldi."], ["Today, Dilnoza has two helpers and a second tandoor in the yard.", "Bugun Dilnozaning ikki yordamchisi va hovlida ikkinchi tandiri bor."], ["Sardor manages the money, and she manages everything else.", "Pulni Sardor boshqaradi, qolgan hamma narsani esa onasining o'zi."], ["She has learned that a fair price is not the same as a low price.", "U adolatli narx arzon narx degani emasligini tushunib yetdi."], ["And she still refuses to add more onion.", "Va u hali ham piyozni ko'paytirishga rozi emas."]]]},
{"id": "iroses", "t": "Who Waters the Roses?", "u": "Atirgullarni kim sug'oradi?", "lv": "Intermediate", "p": [[["Karim aka had retired from his job as an engineer two years earlier.", "Karim aka ikki yil oldin muhandislik ishidan nafaqaga chiqqan edi."], ["Since then, he had loved nothing more than the roses in front of his house.", "O'shandan beri u uyi oldidagi atirgullarni hamma narsadan ham yaxshi ko'rardi."], ["He watered them every evening at exactly seven o'clock.", "U har kuni kechqurun aynan soat yettida ularni sug'orardi."], ["One morning in July, he noticed that the soil was already wet.", "Iyul oyidagi bir tongda u tuproq allaqachon ho'l ekanini payqadi."], ["It hadn't rained for weeks, so this was very strange.", "Haftalardan beri yomg'ir yog'magan edi, shuning uchun bu juda g'alati edi."]], [["The same thing happened the next morning, and the morning after that.", "Ertasi tongda ham, undan keyingi tongda ham xuddi shu narsa takrorlandi."], ["Karim aka began to suspect his neighbours.", "Karim aka qo'shnilaridan shubhalana boshladi."], ["Perhaps Hamid aka was trying to show that his own garden was better?", "Balki Hamid aka o'z bog'i yaxshiroq ekanini ko'rsatmoqchidir?"], ["Or maybe there was a broken water pipe under the street?", "Yoki ko'cha ostidagi suv quvuri yorilgandir?"], ["His wife told him he was watching too many detective films.", "Xotini unga detektiv filmlarni haddan ortiq ko'p ko'rayotganini aytdi."]], [["Being an engineer, he decided to collect evidence.", "Muhandis bo'lgani uchun u dalil to'plashga qaror qildi."], ["He put his old phone on the windowsill and pointed it at the garden.", "U eski telefonini deraza tokchasiga qo'yib, bog'ga qaratdi."], ["He set it to record all night, which took him almost an hour to figure out.", "Uni tun bo'yi yozib olishga sozladi, buni tushunib olishga esa deyarli bir soat ketdi."], ["Then he went to bed, feeling like Sherlock Holmes.", "Keyin o'zini Sherlok Xolmsdek his qilib, uxlagani yotdi."], ["In the morning, the soil was wet again.", "Ertalab tuproq yana ho'l edi."]], [["He watched the video with his tea, fast-forwarding through hours of darkness.", "U choy ichib, soatlab davom etgan qorong'ilikni tez o'tkazib, videoni ko'rdi."], ["At 4:17 a.m., a small figure appeared at the gate with a plastic bucket.", "Tongi soat 4:17 da darvoza oldida plastik chelak ko'targan kichkina bir sharpa paydo bo'ldi."], ["It carefully watered each bush and then disappeared.", "U har bir butani ehtiyotkorlik bilan sug'ordi-da, g'oyib bo'ldi."], ["Karim aka zoomed in, and his mouth fell open.", "Karim aka tasvirni kattalashtirdi va og'zi ochilib qoldi."], ["It was Bobur, the ten-year-old boy from across the street.", "Bu ko'chaning narigi tomonida yashovchi o'n yoshli Bobur edi."]], [["That evening, Karim aka knocked on Bobur's door.", "O'sha kuni kechqurun Karim aka Boburlarning eshigini taqillatdi."], ["The boy went pale as soon as he saw him.", "Bola uni ko'rishi bilanoq rangi oqarib ketdi."], ["He admitted that his football had broken one of the rose bushes in June.", "U iyun oyida to'pi atirgul butalaridan birini sindirib qo'yganini tan oldi."], ["He had been too scared to say sorry, so he had decided to help in secret instead.", "Kechirim so'rashga qo'rqqan, shuning uchun o'rniga yashirincha yordam berishga qaror qilgan edi."], ["He had been getting up before dawn for almost a month.", "U deyarli bir oydan beri tong otmasdan turib kelayotgan ekan."]], [["Karim aka didn't know whether to laugh or to give the boy a lecture.", "Karim aka kulishini ham, bolaga nasihat qilishini ham bilmay qoldi."], ["In the end, he did both, and then he offered him a job.", "Oxiri ikkalasini ham qildi, keyin esa unga ish taklif qildi."], ["Now Bobur helps in the garden every Saturday, in daylight, for a small salary.", "Endi Bobur har shanba kuni, kunduzi, kichik maosh evaziga bog'da yordam beradi."], ["He has already learned the names of twelve kinds of roses.", "U allaqachon atirgulning o'n ikki xilining nomini o'rganib oldi."], ["And Karim aka has finally stopped watching detective films.", "Karim aka esa nihoyat detektiv filmlarni ko'rishni to'xtatdi."]]]},
{"id": "iscam", "t": "Too Good to Be True", "u": "Ishonib bo'lmas darajada arzon", "lv": "Intermediate", "p": [[["Lola had been saving for a new phone since the beginning of the year.", "Lola yil boshidan beri yangi telefon uchun pul yig'ib kelardi."], ["Her old one was so slow that it took a minute to open the camera.", "Eskisi shunchalik sekin ediki, kamerani ochish uchun bir daqiqa ketardi."], ["One evening, she found the perfect advert on a popular website.", "Bir kuni kechqurun u mashhur saytda ayni muddao e'lonni topdi."], ["An almost new iPhone was being sold for half the usual price.", "Deyarli yangi iPhone odatdagi narxning yarmiga sotilayotgan edi."], ["The seller wrote that he was moving abroad and needed money quickly.", "Sotuvchi chet elga ko'chib ketayotganini va pul tezda kerakligini yozgan edi."]], [["Lola sent him a message straight away.", "Lola darhol unga xabar yozdi."], ["The seller, who called himself Bekzod, replied within a minute.", "O'zini Bekzod deb tanishtirgan sotuvchi bir daqiqada javob qaytardi."], ["He said three other people were interested, so she had to decide quickly.", "U yana uch kishi qiziqayotganini, shuning uchun tez qaror qilishi kerakligini aytdi."], ["He couldn't meet in person, he explained, because he was already in Kazan.", "U allaqachon Qozonda bo'lgani uchun yuzma-yuz uchrasha olmasligini tushuntirdi."], ["Instead, he promised to send the phone by courier as soon as she paid.", "Buning o'rniga, pul to'lanishi bilan telefonni kuryer orqali jo'natishga va'da berdi."]], [["Lola was excited, but something felt strange.", "Lola hayajonda edi, lekin nimadir g'alati tuyuldi."], ["Why would anyone sell such a phone so cheaply?", "Nega kimdir bunday telefonni shunchalik arzon sotarkan?"], ["Then Bekzod sent her a link to a page that looked like a delivery service.", "Keyin Bekzod unga yetkazib berish xizmatiga o'xshagan sahifaning havolasini yubordi."], ["The page asked for her card number, the expiry date and the code from the SMS.", "Sahifa karta raqami, amal qilish muddati va SMSdagi kodni so'rardi."], ["Her finger was already above the button when her brother came into the room.", "Akasi xonaga kirganida uning barmog'i allaqachon tugma ustida turgan edi."]], [["Her brother, Diyor, worked in IT security at a bank.", "Akasi Diyor bankda axborot xavfsizligi bo'yicha ishlardi."], ["He took one look at the screen and told her to stop.", "U ekranga bir qaradi-yu, to'xtashini aytdi."], ["He pointed out that the website address had one extra letter in it.", "U sayt manzilida bitta ortiqcha harf borligini ko'rsatdi."], ["\"No real service ever asks for the SMS code,\" he said.", "«Hech bir haqiqiy xizmat SMS kodini so'ramaydi», — dedi u."], ["If she had entered it, the money would have disappeared from her card in seconds.", "Agar uni kiritganida, pul bir necha soniyada kartasidan g'oyib bo'lgan bo'lardi."]], [["Lola felt foolish and angry at the same time.", "Lola o'zini ham ahmoqona ahvolda his qildi, ham jahli chiqdi."], ["Diyor told her not to feel bad, because these tricks are designed very carefully.", "Diyor xafa bo'lmasligini aytdi, chunki bunday nayranglar juda puxta o'ylab tuziladi."], ["Even some of his colleagues had almost been caught once or twice.", "Hatto uning ba'zi hamkasblari ham bir-ikki marta deyarli aldanib qolishgan ekan."], ["Together, they reported the advert, and it was removed the next morning.", "Ular birgalikda e'lon ustidan shikoyat qilishdi va ertasi kuni ertalab u o'chirib tashlandi."], ["Lola also blocked Bekzod, who had already sent her five angry messages.", "Lola allaqachon unga beshta jahldor xabar yuborgan Bekzodni ham blokladi."]], [["A month later, she bought a phone from a real shop, with a guarantee.", "Bir oydan keyin u haqiqiy do'kondan, kafolati bilan telefon sotib oldi."], ["It wasn't the newest model, and it wasn't cheap.", "U eng yangi model ham, arzon ham emas edi."], ["But it works perfectly, and she sleeps well at night.", "Lekin u a'lo ishlaydi va Lola kechalari xotirjam uxlaydi."], ["Now she warns her friends whenever they find a deal that looks too good.", "Endi do'stlari haddan tashqari yaxshi ko'ringan taklif topganida, u har safar ularni ogohlantiradi."], ["Her rule is simple: if something sounds too good to be true, it probably is.", "Uning qoidasi oddiy: agar biror narsa ishonib bo'lmas darajada yaxshi ko'rinsa, ehtimol, bu aldovdir."]]]},
{"id": "ialmaty", "t": "My Coach in Almaty", "u": "Olmaotadagi murabbiyim", "lv": "Intermediate", "p": [[["In January, my sister Nodira persuaded me to go skiing in Almaty.", "Yanvarda singlim Nodira meni Olmaotaga chang'i uchishga borishga ko'ndirdi."], ["She had been skiing since university, while I had never even worn ski boots.", "U universitetdan beri chang'i uchardi, men esa hatto chang'i botinkasini ham kiyib ko'rmagan edim."], ["The flight from Tashkent took only an hour and a half.", "Toshkentdan parvoz atigi bir yarim soat davom etdi."], ["From the plane window, the mountains looked close enough to touch.", "Samolyot derazasidan tog'lar qo'l cho'zsa yetadigandek yaqin ko'rinardi."], ["I remember thinking, \"How difficult can it be?\"", "Esimda, «Buning nimasi qiyin ekan?» deb o'ylagandim."]], [["On the first morning, we took the cable car up to Shymbulak.", "Birinchi kuni ertalab kanatli yo'lda Shimbuloqqa chiqdik."], ["The view was incredible: white peaks, blue sky and the city far below.", "Manzara ajoyib edi: oppoq cho'qqilar, moviy osmon va pastda, uzoqda shahar."], ["Nodira rented equipment for me and gave me a ten-minute lesson.", "Nodira menga anjom ijaraga olib, o'n daqiqalik dars berdi."], ["Then she disappeared down a steep slope, shouting, \"See you at lunch!\"", "Keyin «Tushlikda ko'rishamiz!» deb qichqirgancha tik qiyalikdan pastga g'oyib bo'ldi."], ["I stood there alone, holding my poles like two umbrellas.", "Men tayoqlarimni ikkita soyabondek ushlagancha yolg'iz qoldim."]], [["Within an hour, I had fallen down at least twenty times.", "Bir soat ichida kamida yigirma marta yiqildim."], ["Small children kept passing me at high speed, and some of them were laughing.", "Kichkina bolalar yonimdan katta tezlikda o'tib ketishardi, ba'zilari esa kulishardi."], ["One girl, who couldn't have been older than six, stopped next to me.", "Bir qizcha yonimda to'xtadi, u olti yoshdan oshmagan bo'lsa kerak."], ["She looked at me seriously and said something in Kazakh.", "U menga jiddiy qarab, qozoqcha nimadir dedi."], ["I understood most of it, because Kazakh and Uzbek are quite similar.", "Ko'p qismini tushundim, chunki qozoq va o'zbek tillari ancha o'xshash."]], [["She told me to bend my knees and stop looking at my feet.", "U tizzalarimni bukishimni va oyoqlarimga qarashni bas qilishimni aytdi."], ["Then she showed me how to stop by making a triangle with my skis.", "Keyin chang'ilarni uchburchak qilib qanday to'xtashni ko'rsatdi."], ["Her name was Aruzhan, and her father was a ski instructor.", "Uning ismi Aruzhan edi, otasi esa chang'i bo'yicha murabbiy ekan."], ["For the next half hour, she followed me down the beginner slope, giving orders.", "Keyingi yarim soat davomida u buyruq berib, yangi boshlovchilar qiyaligi bo'ylab orqamdan tushib bordi."], ["To my surprise, her method actually worked.", "Ajablanarlisi, uning usuli haqiqatan ham ish berdi."]], [["At lunch, Nodira found me in the cafe, looking very pleased with myself.", "Tushlikda Nodira meni kafeda o'zimdan juda mamnun holda o'tirgan joyimda topdi."], ["\"Who taught you to stop like that?\" she asked.", "«Senga bunday to'xtashni kim o'rgatdi?» — deb so'radi u."], ["I told her I had hired a very strict private coach.", "Men unga juda qattiqqo'l shaxsiy murabbiy yollaganimni aytdim."], ["When Aruzhan walked past with a cup of hot chocolate, Nodira couldn't stop laughing.", "Aruzhan qo'lida bir chashka issiq shokolad bilan yonimizdan o'tganida, Nodira kulgidan to'xtay olmadi."], ["I bought my coach a second cup as a thank-you.", "Murabbiyimga minnatdorchilik sifatida yana bir chashka olib berdim."]], [["We spent the last evening walking around the city, which was much greener than I had expected.", "Oxirgi kechani shaharni aylanib o'tkazdik, u men kutganimdan ancha yashil ekan."], ["We ate beshbarmak and argued about whose plov is better.", "Beshbarmoq yedik va kimning palovi yaxshiroq ekani haqida bahslashdik."], ["On the flight home, my legs hurt so much that I could hardly sit.", "Uyga qaytishda oyoqlarim shunchalik og'ridiki, zo'rg'a o'tirdim."], ["But I had already decided to come back next winter.", "Lekin kelasi qishda yana qaytib kelishga allaqachon qaror qilgan edim."], ["This time, I might even be able to ski without a six-year-old supervisor.", "Bu safar, ehtimol, olti yoshli nazoratchisiz ham chang'i ucha olarman."]]]},
{"id": "inotebook", "t": "Grandmother's Blue Notebook", "u": "Buvimning ko'k daftari", "lv": "Intermediate", "p": [[["After her grandmother passed away, Malika was given a small blue notebook.", "Buvisi olamdan o'tgach, Malikaga kichkina ko'k daftar berildi."], ["It was full of recipes in her grandmother's tiny, careful handwriting.", "U buvisining mayda, chiroyli yozuvidagi retseptlarga to'la edi."], ["Nobody else in the family had wanted it, because hardly anyone cooked anymore.", "Oiladagi boshqa hech kim uni olishni xohlamagan edi, chunki endi deyarli hech kim ovqat pishirmasdi."], ["Malika didn't cook either, but she couldn't bring herself to throw it away.", "Malika ham ovqat pishirmasdi, lekin uni tashlab yuborishga qo'li bormadi."], ["For a year, the notebook stayed on a shelf next to her laptop.", "Bir yil davomida daftar noutbuki yonidagi javonda turdi."]], [["Then one winter evening, she missed the smell of her grandmother's kitchen.", "Keyin qishning bir oqshomida u buvisining oshxonasi hidini qattiq sog'indi."], ["She opened the notebook and chose the simplest recipe: lentil soup.", "U daftarni ochib, eng oddiy retseptni tanladi: yasmiq sho'rva."], ["Most of the instructions were clear, but some were rather strange.", "Ko'rsatmalarning aksariyati tushunarli, lekin ba'zilari ancha g'alati edi."], ["\"Add salt until it tastes like Saturday,\" one line said.", "Bir qatorda «Shanba kunining ta'mi kelguncha tuz soling» deb yozilgan edi."], ["Another said, \"Cook it as long as a phone call with your aunt.\"", "Boshqasida «Xolang bilan telefonda gaplashadigan vaqtcha qaynating» deyilgan edi."]], [["Malika laughed out loud in the empty kitchen.", "Malika bo'm-bo'sh oshxonada baland ovozda kulib yubordi."], ["She called her mother to ask what these notes meant.", "U bu yozuvlar nimani anglatishini so'rash uchun onasiga qo'ng'iroq qildi."], ["Her mother explained that Saturday was the day Grandma cooked for the whole family.", "Onasi shanba buvisi butun oilaga ovqat pishiradigan kun bo'lganini tushuntirdi."], ["Everything was saltier on Saturdays, because the uncles liked it that way.", "Shanba kunlari hamma narsa sho'rroq bo'lardi, chunki tog'alar shuni yaxshi ko'rishardi."], ["And the aunt's phone calls, of course, usually lasted about forty minutes.", "Xolaning telefon suhbatlari esa, albatta, odatda qirq daqiqacha davom etardi."]], [["The soup was not perfect, but it was surprisingly close.", "Sho'rva mukammal chiqmadi, lekin buvisinikiga hayratlanarli darajada o'xshash edi."], ["Encouraged, Malika tried a new recipe every weekend.", "Bundan ruhlanib, Malika har dam olish kuni yangi retsept sinab ko'rdi."], ["She burned her first chak-chak and forgot to put onions in the chuchvara.", "Birinchi chak-chagini kuydirib qo'ydi, chuchvaraga esa piyoz solishni unutdi."], ["Slowly, she began to understand her grandmother's secret language.", "Asta-sekin u buvisining sirli tilini tushuna boshladi."], ["She also started writing her own notes in the margins.", "U hoshiyalarga o'z izohlarini ham yoza boshladi."]], [["On the last page, Malika found something that was not a recipe at all.", "Oxirgi sahifada Malika umuman retsept bo'lmagan narsani topdi."], ["It was a short list of names, and her own name was at the bottom.", "Bu qisqa ismlar ro'yxati edi, eng pastida esa uning o'z ismi turardi."], ["Next to each name, her grandmother had written that person's favourite dish.", "Har bir ism yoniga buvisi o'sha odamning sevimli taomini yozib qo'ygan edi."], ["Next to \"Malika,\" it said: \"Pumpkin manti. Teach her when she is ready.\"", "«Malika» yonida esa shunday yozilgan edi: «Qovoqli manti. Tayyor bo'lganda o'rgat.»"], ["Malika sat down on the kitchen floor and cried for a long time.", "Malika oshxona poliga o'tirib, uzoq yig'ladi."]], [["The pumpkin manti recipe was on page twelve, of course.", "Qovoqli manti retsepti, albatta, o'n ikkinchi sahifada edi."], ["She made it for the whole family on her grandmother's birthday.", "U buvisining tug'ilgan kunida uni butun oila uchun tayyorladi."], ["Her uncles said it needed a little more salt.", "Tog'alari biroz tuzi kamroq ekanini aytishdi."], ["Malika smiled and reminded them that it wasn't Saturday.", "Malika jilmayib, bugun shanba emasligini eslatdi."], ["Now she is copying the notebook so that each of her cousins can have one.", "Endi u amakivachchalarining har biriga bittadan bo'lishi uchun daftardan nusxa ko'chiryapti."]]]},
{"id": "isleep", "t": "The Ten O'Clock Rule", "u": "Soat o'n qoidasi", "lv": "Intermediate", "p": [[["For years, I believed I was simply a night person.", "Yillar davomida o'zimni shunchaki tungi odam deb hisoblardim."], ["I usually went to bed after one and scrolled through my phone until two.", "Odatda soat birdan keyin yotardim va soat ikkigacha telefonimni varaqlardim."], ["In the morning, I needed three alarms and two cups of coffee to feel human.", "Ertalab o'zimni odamdek his qilishim uchun uchta budilnik va ikki finjon qahva kerak bo'lardi."], ["I told myself this was normal for people my age.", "O'zimga bu mening yoshimdagilar uchun odatiy hol, deb aytardim."], ["Then, at a routine check-up, my doctor asked me a simple question.", "Keyin navbatdagi tibbiy ko'rikda shifokorim menga oddiy bir savol berdi."]], [["\"How many hours do you sleep?\" she asked, looking at my blood pressure results.", "«Necha soat uxlaysiz?» — deb so'radi u qon bosimim natijalariga qarab."], ["When I answered \"about five,\" she put down her pen.", "«Besh soatcha», deb javob berganimda, u ruchkasini qo'ydi."], ["She explained that poor sleep could affect my heart, my memory and even my mood.", "U yomon uyqu yuragimga, xotiramga va hatto kayfiyatimga ta'sir qilishi mumkinligini tushuntirdi."], ["She didn't give me any pills, just one rule: no screens after ten o'clock.", "U menga hech qanday dori bermadi, faqat bitta qoida berdi: soat o'ndan keyin ekran yo'q."], ["I laughed, but she was completely serious.", "Men kuldim, lekin u mutlaqo jiddiy edi."]], [["The first week was much harder than I had expected.", "Birinchi hafta men kutganimdan ancha qiyin bo'ldi."], ["At ten, I would put my phone in the kitchen and then wander around the flat like a lost cat.", "Soat o'nda telefonimni oshxonaga qo'yib, keyin uyda adashgan mushukdek aylanib yurardim."], ["Twice, I went back to check my messages, telling myself they might be urgent.", "Ikki marta «balki shoshilinchdir» deb o'zimni aldab, xabarlarni tekshirgani qaytib bordim."], ["They never were.", "Ular hech qachon shoshilinch bo'lmagan."], ["Nobody really needs me at midnight.", "Aslida yarim tunda hech kimga kerak emasman."]], [["In the second week, I bought a paper book for the first time in years.", "Ikkinchi haftada yillar ichida birinchi marta qog'oz kitob sotib oldim."], ["It was a detective story, and I chose it because the cover looked nice.", "Bu detektiv hikoya edi va men uni muqovasi chiroyli bo'lgani uchun tanladim."], ["I fell asleep after reading only four pages.", "Atigi to'rt sahifa o'qib, uxlab qoldim."], ["The same thing happened the next night, and the night after that.", "Keyingi kechasi ham, undan keyingi kechasi ham xuddi shunday bo'ldi."], ["It took me a month to find out who the murderer was.", "Qotil kimligini bilib olishim uchun bir oy kerak bo'ldi."]], [["Slowly, other things began to change as well.", "Asta-sekin boshqa narsalar ham o'zgara boshladi."], ["I started waking up before my alarm, which had never happened before.", "Budilnikdan oldin uyg'ona boshladim, bunday hech qachon bo'lmagan edi."], ["My family noticed that I was less irritable in the mornings.", "Oilam ertalablari kamroq asabiylashayotganimni payqadi."], ["I even had time for breakfast, instead of eating a biscuit in the taxi.", "Taksida pechenye kavshash o'rniga hatto nonushtaga ham vaqtim qoladigan bo'ldi."], ["My life did not become perfect, but my problems became smaller.", "Hayotim mukammal bo'lib qolmadi, lekin muammolarim kichiklashdi."]], [["Three months later, I went back to the doctor for another check-up.", "Uch oydan keyin yana ko'rikdan o'tish uchun shifokorga bordim."], ["My blood pressure was normal, and she gave me a satisfied smile.", "Qon bosimim normal edi, u menga mamnun tabassum qildi."], ["I still break the rule sometimes, especially when there is a big football match on.", "Hali ham ba'zan qoidani buzaman, ayniqsa katta futbol o'yini bo'lganda."], ["But now I notice the difference the next day, and I don't like it.", "Lekin endi ertasi kuni farqni sezaman va bu menga yoqmaydi."], ["It turns out I was never a night person, just a tired one.", "Ma'lum bo'lishicha, men hech qachon tungi odam bo'lmaganman, shunchaki charchagan odam bo'lganman."]]]},
{"id": "ivoice", "t": "Plov After Football", "u": "Futboldan keyin osh", "lv": "Intermediate", "p": [[["Every Tuesday evening, I play football with a group of friends on a small pitch in Yunusabad.", "Har seshanba kuni kechqurun Yunusoboddagi kichik maydonda bir guruh do'stlarim bilan futbol o'ynayman."], ["There are about twenty of us, including two Korean brothers and a German teacher called Markus.", "Biz yigirma kishicha bo'lamiz, ular orasida ikki koreys aka-uka va Markus ismli nemis o'qituvchi ham bor."], ["We organise everything in a group chat: who is coming, who brings the ball and who pays for the pitch.", "Hammasini guruh chatida kelishib olamiz: kim keladi, to'pni kim olib keladi va maydon puliga kim to'laydi."], ["One Tuesday, I was getting ready for the game when my mother asked to borrow my phone.", "Bir seshanba kuni o'yinga tayyorlanayotganimda onam telefonimni olib turishni so'radi."], ["She wanted to call my aunt, and I didn't think anything of it.", "U xolamga qo'ng'iroq qilmoqchi edi, men bunga hech qanday e'tibor bermadim."]], [["Ten minutes later, a voice message appeared in our football chat.", "O'n daqiqadan keyin futbol chatimizda ovozli xabar paydo bo'ldi."], ["It was my mother, speaking loudly in Uzbek.", "Bu onam edi, o'zbekcha baland ovozda gapirardi."], ["She said the plov was ready, that I should stop running after a ball like a child, and that everyone should come over.", "U osh tayyor ekanini, bolalardek to'p quvishni bas qilishim kerakligini va hamma kelaverishi mumkinligini aytdi."], ["Apparently, she had meant to send it to my aunt's family.", "Aftidan, u buni xolamning oilasiga yubormoqchi bo'lgan."], ["Instead, she had sent it to twenty grown men who were about to play football.", "Buning o'rniga esa uni futbol o'ynashga hozirlanib turgan yigirmata katta yoshli erkakka yuborib qo'ygan edi."]], [["My Uzbek friends started sending laughing faces immediately.", "O'zbek do'stlarim darhol kulayotgan smayliklar yubora boshlashdi."], ["Markus and the Korean brothers, however, used an automatic translator to understand the message.", "Markus va koreys aka-ukalar esa xabarni tushunish uchun avtomatik tarjimondan foydalanishdi."], ["The translation said something like: \"The rice is finished. Stop running. All guests come now.\"", "Tarjimada shunga o'xshash gap chiqdi: «Guruch tugadi. Yugurishni to'xtat. Barcha mehmonlar hozir kelsin.»"], ["Markus asked politely whether he should bring anything.", "Markus xushmuomalalik bilan biror narsa olib kelishi kerakmi, deb so'radi."], ["I tried to explain, but by then the chat was completely out of control.", "Tushuntirishga urindim, lekin bu paytga kelib chat butunlay nazoratdan chiqib bo'lgan edi."]], [["When I told my mother what had happened, she wasn't embarrassed at all.", "Onamga nima bo'lganini aytganimda, u umuman xijolat bo'lmadi."], ["\"Then invite them properly,\" she said.", "«Unda ularni yaxshilab taklif qil», — dedi u."], ["She explained that if people have heard about plov, you can't just leave them hungry.", "Agar odamlar osh haqida eshitgan bo'lsa, ularni shunchaki och qoldirib bo'lmasligini tushuntirdi."], ["I thought she was joking, but she was already making a list of ingredients.", "Hazillashyapti deb o'yladim, lekin u allaqachon masalliqlar ro'yxatini tuzayotgan edi."], ["In our family, nobody argues with my mother about food.", "Bizning oilada ovqat masalasida hech kim onam bilan bahslashmaydi."]], [["Two weeks later, after our Tuesday game, the whole team came to our house.", "Ikki haftadan keyin seshanbadagi o'yinimizdan so'ng butun jamoa uyimizga keldi."], ["They sat at our table in the courtyard, still in their football shirts.", "Ular futbolkalarini ham yechmay, hovlimizdagi dasturxon atrofida o'tirishdi."], ["My mother had cooked plov in a huge kazan, as if she expected a hundred guests.", "Onam go'yo yuzta mehmon kutayotgandek, ulkan qozonda osh damlagan edi."], ["Markus ate three plates and asked for the recipe.", "Markus uch likopcha yedi va retseptini so'radi."], ["She refused to give it to him, but she promised to send him a voice message instead.", "Onam retseptni bermadi, lekin o'rniga unga ovozli xabar yuborishga va'da qildi."]], [["Since then, the voice message has become a legend in our football group.", "O'shandan beri o'sha ovozli xabar futbol guruhimizda afsonaga aylandi."], ["New players hear the story on their first evening.", "Yangi o'yinchilar bu hikoyani birinchi kechasidayoq eshitishadi."], ["Someone even printed the words \"All guests come now\" on our football shirts.", "Kimdir hatto futbolkalarimizga «All guests come now» degan yozuvni bostirib qo'ydi."], ["And my mother? She now has her own phone and a chat with my football friends.", "Onam-chi? Endi uning o'z telefoni va futbolchi do'stlarim bilan alohida chati bor."], ["I am not allowed to join it.", "Menga unga qo'shilishga ruxsat yo'q."]]]}

/* matnlar darajasi: tanlangan daraja birinchi, keyin pastroqlari (yaqinidan), keyin yuqorilari */
const BK_LV = ["Beginner", "Elementary", "Pre-intermediate", "Intermediate"];
const BK_OF = { zero: "Beginner", beginner: "Beginner", elementary: "Elementary", pre: "Pre-intermediate", inter: "Intermediate" };
const curBk = () => BK_OF[curLevel().id] || "Beginner";
const bkLvOrder = () => { const c = BK_LV.indexOf(curBk()); return [c, ...BK_LV.map((_, i) => i).filter(i => i < c).reverse(), ...BK_LV.map((_, i) => i).filter(i => i > c)].map(i => BK_LV[i]); };
const bookList = () => bkLvOrder().flatMap(l => BOOKS.filter(b => b.lv === l));
const lvBooks = () => BOOKS.filter(b => b.lv === curBk());

const bookRec = b => (S.read || {})[b.id];
const bookWords = b => b.p.flat().map(x => x[0]).join(" ").split(/\s+/).length;
const bookMin = b => Math.max(2, Math.round(bookWords(b) / 70));
const bookPct = b => { const r = bookRec(b); return !r ? 0 : r.done ? 100 : Math.min(99, Math.round((r.p || 0) / b.p.length * 100)); };
/* bugungi hikoya: boshlangan, tugamagani → aks holda birinchi o'qilmagani */
const nextBook = () => { const L = bookList(), mine = lvBooks(), open = b => { const r = bookRec(b); return r && !r.done && r.p > 0; }, unread = b => !bookRec(b) || !bookRec(b).done;
  return mine.find(open) || mine.find(unread) || L.find(open) || L.find(unread); };
function hikCard() {
  const b = nextBook(), mine = lvBooks(), read = mine.filter(x => bookRec(x) && bookRec(x).done).length;
  const head = `<div class="xm-h"><b>${ICON.read}Bugungi hikoya</b><a href="#hikoyalar">Barchasi${ICON.chev}</a></div>`;
  if (!b) return `<section class="xm hkc">${head}<p class="xm-note">Hamma ${BOOKS.length} ta hikoya o'qildi. Yangilari tez orada qo'shiladi — eskilarini qayta o'qish ham foydali.</p></section>`;
  const pct = bookPct(b), first = b.p.slice(0, 2).map(pp => pp.map(x => x[0]).join(" ")).join(" ");
  return `<section class="xm hkc">${head}<p class="hk-t" lang="en">${esc(b.t)}</p><p class="hk-u">${esc(b.u)} · ${b.lv} · ${bookMin(b)} daq${read && b.lv === curBk() ? ` · ${read} / ${mine.length} o'qildi` : ""}</p>

    <div class="flb"><button class="mchip" id="hkgo">${ICON.read}${pct ? "Davom etish · " + pct + "%" : "O'qish"}</button><button class="mchip" id="hkls">${ICON.vol}Tinglash</button></div></section>`;
}
let BK_PLAY = false;
route(/^hikoyalar$/, () => {
  const row = b => { const r = bookRec(b), pct = bookPct(b);
    return `<a class="li" href="#oqish-${b.id}"><span class="lic">${ICON.read}</span><span class="tx"><b lang="en">${esc(b.t)}</b><span>${esc(b.u)} · ${bookMin(b)} daq</span></span><span class="st${r && r.done ? " full" : ""}">${r && r.done ? ICON.check + "o'qildi" : pct ? pct + "%" : "yangi"}</span><span class="go">${ICON.chev}</span></a>`; };
  const lv = l => BOOKS.filter(b => b.lv === l), cl = curBk(), mine = lv(cl), read = mine.filter(b => bookRec(b) && bookRec(b).done).length;

  <div class="stack">${mine.length ? sec(cl) : ""}
  ${units.length ? `<section class="sec"><div class="sec-h"><h2>Unit hikoyalari</h2><span class="n">qisqa · 6 gap</span></div><div class="list">${units.map(n => `<a class="li" href="#hikoya-${n}"><span class="lic">${un(n)}</span><span class="tx"><b lang="en">${esc(STORIES[n].t)}</b><span>Unit ${un(n)} · ${esc(STORIES[n].u)}</span></span>${S.story && S.story[n] ? `<span class="st full">${ICON.check}o'qildi</span>` : ""}<span class="go">${ICON.chev}</span></a>`).join("")}</div></section>` : ""}
  ${others.length ? `<p class="label bk-oth">Boshqa darajalar</p>${others.map(sec).join("")}` : ""}</div>`;

route(/^oqish-([a-z]+)$/, id => {
  const b = BOOKS.find(x => x.id === id); if (!b) return go("hikoyalar");
  stopVoice(); S.read = S.read || {};
  const r = bookRec(b), seenPast = new Set(felSeen().flatMap(v => v.v2.split("/").map(x => x.trim().toLowerCase())).filter(x => !["put", "read", "cut", "hit"].includes(x)));

/* ---------- SO'Z O'YINI: o'zbekcha so'z → 4 ta bir-biriga juda o'xshash inglizcha variant ----------
   Savollar faqat ko'rilgan so'zlardan. Variantlar shakli (harflari) yoki talaffuzi o'xshash so'zlardan tanlanadi.
   Xato javob: ikkala so'z yonma-yon ko'rsatiladi, so'z takrorga tushadi, juftlik S.conf ga yoziladi */
const OY_N = 10, OY_LVKEY = "ingliz-oyin-lv";
const OY_POOLS = [
  { id: "beginner", t: "Beginner", s: "A1", f: w => !w.mine && !w.vb && w.unit > 0 && w.unit < 100 },
  { id: "elementary", t: "Elementary", s: "A2", f: w => lvOf(w.unit) === "elementary" && w.unit > 200 },
  { id: "pre", t: "Pre-intermediate", s: "B1", f: w => w.unit > 100 && w.unit < 200 },
  { id: "inter", t: "Intermediate", s: "B1+", f: w => w.unit > 300 },
  { id: "extra", t: "Qo'shimcha so'zlarim", s: "So'z boyligi va o'zingiz qo'shganlar", f: w => !!(w.mine || w.vb) },
  { id: "all", t: "Hammasi aralash", s: "Barcha ko'rgan so'zlaringiz", f: () => true }];
let OY = null;
const oyLv = () => { let v = ""; try { v = localStorage.getItem(OY_LVKEY) || ""; } catch (e) {} return OY_POOLS.find(p => p.id === v) ? v : OY_POOLS.some(p => p.id === curLvId()) ? curLvId() : "beginner"; };
const oyPr = w => norm(w.p || "").replace(/[^a-z']/g, "");
const oyOk = w => w && w.w && w.u && norm(w.w).split(" ").length <= 2;
/* kichik son — o'xshashroq; null — o'xshash emas. 0 — talaffuzi bir xil (meat / meet) */
function oySim(t, c) {
  const a = norm(t.w), b = norm(c.w); if (a === b || norm(t.u) === norm(c.u) || synClash(t, c)) return null;
  const pa = oyPr(t), pb = oyPr(c);
  if (pa && pa.length > 1 && pa === pb) return 0;
  const L = Math.max(a.length, b.length), d = lev(a, b), lim = L <= 4 ? 1 : L <= 7 ? 2 : 3;
  if (d <= lim) return d + (a[0] === b[0] ? 0 : .5);
  if (pa && pb && pa.length >= 3 && lev(pa, pb) <= 1) return 1.6;
  return null;
}
/* variantlar manbasi: avval ko'rilgan so'zlar, keyin kitobdagi boshqa so'zlar (bir so'z bir marta) */
function oyLexicon() {
  const seen = new Map(), rest = new Map();
  WORDS.forEach(w => { if (!oyOk(w)) return; const k = norm(w.w); if (isSeen(w)) { if (!seen.has(k)) seen.set(k, w); } else if (!rest.has(k)) rest.set(k, w); });
  VB_ALL.forEach(x => { const k = norm(x.w); if (oyOk(x) && !seen.has(k) && !rest.has(k)) rest.set(k, x); });
  seen.forEach((_, k) => rest.delete(k));
  return { seen: [...seen.values()], rest: [...rest.values()] };
}
function oyDistractors(t, lex) {
  const pick = [], used = new Set([norm(t.w)]), meanings = new Set([norm(t.u)]);
  const scan = list => list.map(c => ({ c, s: oySim(t, c) })).filter(x => x.s != null).sort((x, y) => x.s - y.s || Math.random() - .5);
  for (const { c } of scan(lex.seen).concat(scan(lex.rest))) {
    if (pick.length === 3) break; const k = norm(c.w), m = norm(c.u);
    if (used.has(k) || meanings.has(m)) continue; used.add(k); meanings.add(m); pick.push(c);
  }
  return pick;
}
function oyRound(poolId) {
  const P = OY_POOLS.find(p => p.id === poolId), lex = oyLexicon(), conf = S.conf || {};
  const was = new Set(Object.values(conf).filter(x => x.d < today()).map(x => x.id));
  const cand = shuffle(WORDS.filter(w => P.f(w) && isSeen(w) && oyOk(w)));
  cand.sort((a, b) => was.has(b.id) - was.has(a.id)); // avval ilgari chalkashtirilgan so'zlar
  const q = [], weak = [], took = new Set(); // bir so'z (masalan letter — harf / xat) raundda bir marta
  for (const w of cand) {
    if (q.length >= OY_N) break;
    const kw = norm(w.w); if (took.has(kw)) continue; took.add(kw);
    const d = oyDistractors(w, lex);
    if (d.length === 3) q.push({ w, o: shuffle([w].concat(d)) }); else if (d.length === 2 && weak.length < OY_N) weak.push({ w, d });
  }
  // o'xshash so'z yetmasa: 2 ta o'xshash + 1 ta shu mavzudan
  for (const x of weak) { if (q.length >= OY_N) break; const f = distractors(x.w, "w").find(z => !x.d.some(y => norm(y.w) === norm(z.w)) && norm(z.u) !== norm(x.w.u)); if (f) q.push({ w: x.w, o: shuffle([x.w, ...x.d, f]) }); }
  return shuffle(q);
}
const oySeenCount = P => WORDS.filter(w => P.f(w) && isSeen(w) && oyOk(w)).length;
/* ikki so'zning farq qiladigan harflari */
function oyDiff(a, b) {
  const m = a.length, n = b.length, d = [...Array(m + 1)].map(() => Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) d[i][j] = a[i] === b[j] ? d[i + 1][j + 1] + 1 : Math.max(d[i + 1][j], d[i][j + 1]);
  const keep = new Set(); let i = 0, j = 0;
  while (i < m && j < n) { if (a[i] === b[j]) { keep.add(i); i++; j++; } else if (d[i + 1][j] >= d[i][j + 1]) i++; else j++; }
  return [...a].map((c, k) => keep.has(k) ? esc(c) : `<u>${esc(c)}</u>`).join("");
}

  // xato: so'z takrorga (grade), tanlangan so'z ham ko'rilgan bo'lsa — ertaga takrorga; juftlik eslab qolinadi

  if (o.id && S.srs[o.id]) { const r = S.srs[o.id]; if (!r.due || r.due > addDays(1)) { r.due = addDays(1); save(); } }
  S.conf = S.conf && typeof S.conf === "object" ? S.conf : {};

/* yozilgan so'z → to'g'ri so'z: to'g'risida yetishmagan / farqli harflar belgilanadi */
function felDiff(a, b) {

  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) d[i][j] = a[i] === b[j] ? d[i + 1][j + 1] + 1 : Math.max(d[i + 1][j], d[i][j + 1]);
  const keep = new Set(); let i = 0, j = 0;
  while (i < m && j < n) { if (a[i] === b[j]) { keep.add(j); i++; j++; } else if (d[i + 1][j] >= d[i][j + 1]) i++; else j++; }
  return [...b].map((c, k) => keep.has(k) ? esc(c) : `<u>${esc(c)}</u>`).join("");
}

    const v = FEL.find(x => x.id === id), r = felRec(v) || { b: 0, ok: 0, bad: 0 }, was = FL.from[id], missed = FL.miss.has(id);

/* qo'llanma oxiridagi mashq: 8 savol, 4 variant; 6 va undan ko'p to'g'ri — o'rganildi */
function guideQuiz(g) {
  const box = $("#gq"), pool = guidePool(g), canHear = "speechSynthesis" in window, listen = g.quiz === "listen" && canHear;
  if (!canHear && g.kind === "sounds") { box.innerHTML = `<p class="gqi">Bu mashq uchun telefonda ovoz (matnni o'qish) kerak.</p>`; return; }
  const intro = () => {
    box.innerHTML = `<p class="gqi">${listen ? "Eshiting va to'g'ri javobni tanlang." : g.quiz === "listen" ? "O'qilishiga qarab to'g'ri javobni tanlang." : "O'zbekchasiga qarab inglizchasini tanlang."}</p><button class="btn" id="gqs">${guideDone(g) ? "Yana mashq qilish" : "Mashqni boshlash"}</button>`;
    $("#gqs").onclick = start;
  };
  let q = [], k = 0, right = 0;
  const start = () => { q = shuffle(pool.slice()).slice(0, Math.min(8, pool.length)); k = 0; right = 0; ask(); };
  const ask = () => {
    if (k >= q.length) return end();
    const it = q[k], opts = shuffle([it].concat(shuffle(pool.filter(x => x.label !== it.label)).slice(0, 3)));
    box.innerHTML = `<div class="gqh"><span>${k + 1} / ${q.length}</span><span>✓ ${right}</span></div>
      ${listen ? `<button class="gplay" id="gqp" aria-label="Qayta eshitish">${ICON.vol}<span>Qayta eshitish</span></button>` : `<p class="gqw">${esc(g.quiz === "listen" ? it.uz : it.uz)}</p>`}
      <div class="opts${g.kind === "grid" ? " g4" : ""}">${opts.map(o => `<button class="opt" data-l="${esc(o.label)}">${esc(o.label)}</button>`).join("")}</div>`;
    if (listen) { say(it.say); $("#gqp").onclick = () => say(it.say); }
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (box.dataset.lock) return; box.dataset.lock = "1";
      const ok = b.dataset.l === it.label; if (ok) right++;
      b.classList.add(ok ? "ok" : "bad");
      if (!ok) box.querySelectorAll(".opt").forEach(x => { if (x.dataset.l === it.label) x.classList.add("ok"); });
      if (!listen) say(it.say);
      setTimeout(() => { delete box.dataset.lock; if (box.isConnected) { k++; ask(); } }, ok ? 650 : 1300);
    });
  };
  const end = () => {
    const pass = right >= Math.ceil(q.length * .75); if (pass) markGuide(g);
    box.innerHTML = `<p class="gqr"><b>${right} / ${q.length}</b>${pass ? " — zo'r, o'rganildi ✓" : " — yana bir marta urinib ko'ring"}</p><button class="btn${pass ? " ghost" : ""}" id="gqs">Qayta mashq</button>`;
    $("#gqs").onclick = start;
  };
  intro();
}

/* ---------- O'RGANISH: yangi so'z avval ko'rsatiladi, keyin seansning o'zida 3 marta eslab topiladi ----------
   1 — o'zbekchasiga qarab inglizchasini tanlash, 2 — eshitib ma'nosini tanlash, 3 — xotiradan yozish.
   Bir vaqtda ko'pi bilan 3 ta so'z «ochiq» turadi; har bosqich orasiga boshqa so'zlar tushadi (oraliq). Xato bo'lsa — shu bosqich 2 savoldan keyin yana. */
const LEARN_N = 5, ACTIVE = 3, LMODE = ["intro", "uz-en", "en-uz", "spell"];
function startLearn(list, title, back, tag) {
  const words = list.slice(0, LEARN_N); if (!words.length) return;
  Z = { learn: true, words, pool: list, lv: {}, errs: {}, fin: new Set(), intro: 0, q: [], i: 0, right: 0, ans: 0, wrong: [], done: new Set(), mode: "learn", title, state: "ask", retype: false, cur: null, tag, back: back || location.hash || "#", base: 0 };
  refill();
  if (location.hash === "#quiz") render(); else go("quiz");
}
function refill() {
  while (Z.intro < Z.words.length && Z.intro - Z.fin.size < ACTIVE && Z.q.length - Z.i < 3) {
    const w = Z.words[Z.intro++]; Z.lv[w.id] = 0; Z.errs[w.id] = 0;
    Z.q.push({ w, k: 0 }, { w, k: 1 });
  }
}
const learnAt = (t, gap) => Z.q.splice(Math.min(Z.i + 1 + gap, Z.q.length), 0, t);
function learnResult(ok) {
  const t = Z.q[Z.i], w = t.w;
  Z.ans++; logAns(ok, t.k === 3);
  if (ok) {
    if (!t.re) Z.right++;
    Z.lv[w.id] = Math.max(Z.lv[w.id], t.k);
    if (t.k === 3) Z.fin.add(w.id); else learnAt({ w, k: t.k + 1 }, 2);
  } else {
    Z.errs[w.id]++;
    if (Z.errs[w.id] > 4) Z.fin.add(w.id); // juda ko'p xato: seansni cho'zmaymiz, so'z ertaga yana chiqadi
    else learnAt({ w, k: t.k, re: true }, 2);
  }
  refill();
}
function finishLearn() {
  const now = Date.now(), back = Z.back, tag = Z.tag, words = Z.words, title = Z.title, errs = Z.errs;
  words.forEach(w => { if (!S.srs[w.id]) untomb("srs:" + w.id); if (!S.srs[w.id]) S.srs[w.id] = { b: 1, due: addDays(1), ok: 1, bad: errs[w.id] ? 1 : 0, lt: now, ls: today() }; });
  touchStreak(); save(); if (tag) markDone(tag);

    <button class="btn ghost" id="back">${backLabel(tag)}</button></div></div>`;
  bindSay(app); bindLesson();
  const pool = Z.pool; Z = null; zSave();

}

const canSpeak = () => !!(window.SpeechRecognition || window.webkitSpeechRecognition); // SR pastda, «Tayyor gaplar» bilan umumiy
